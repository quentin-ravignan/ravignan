async function createVente(){
  if(busy)return;
  if(!nv.nom.trim()||!nv.lieu.trim())return flash("Indiquez le nom et le lieu de la vente.");
  if(!(nv.vendeurs||[]).length)return flash("Choisissez au moins un vendeur.");
  if(!nv.refs.length&&!nv.extras.length)return flash("Ajoutez au moins un produit.");
  if(nv.dateFin&&nv.dateFin<nv.dateDebut)return flash("La date de fin est avant la date de début.");
  const refs=[...nv.refs.map(r=>({id:r.id,nom:r.nom,format:r.format,stock:Math.max(0,parseInt(r.stock)||0),prix:parseFloat(r.prix)||0})),
              ...nv.extras.map(x=>({id:x.id,nom:x.nom,format:x.format,stock:Math.max(0,x.stock||0),prix:x.prix}))];
  const id="v"+uid();
  const v={nom:nv.nom.trim(),lieu:nv.lieu.trim(),dateDebut:nv.dateDebut,dateFin:nv.dateFin||nv.dateDebut,vendeurPrincipal:nv.vendeurs[0],vendeurs:nv.vendeurs,refs,cloturee:false,createdAt:new Date().toISOString()};
  busy=true;qs("#btn-create").disabled=true;
  try{
    await db.collection("ventes").doc(id).set(v);
    store.set(VENDEUR_KEY,nv.vendeurs[0]);
    nv=blankNv();
    if(!ventes.find(x=>x.id===id))ventes.push({id,...v});
    go("vente",id);flash("Vente créée.","ok");
  }catch(e){flash(dbMessage(e));const b=qs("#btn-create");if(b)b.disabled=false;}
  finally{busy=false;}
}

  const v=getVente();const t=txsOf(v.id);

  m.appendChild(el("div","row",`<p class="muted">${esc(v.lieu)} · ${esc(periode(v))}</p><span class="badge ${v.cloturee?"closed":"open"}">${v.cloturee?"Clôturée":"En cours"}</span>`));
  const k=el("div","grid3");
  [[fmt(ca),"Chiffre d'affaires"],[t.length,"Transactions"],[btl,"Articles"]].forEach(([val,lab])=>k.appendChild(el("div","kpi",`<div class="val num">${val}</div><div class="lab">${lab}</div>`)));
  m.appendChild(k);

  if(parP.length)m.appendChild(el("p","muted num",parP.map(([l,s])=>`${l} ${fmt(s)}`).join(" · ")));
  const offerts=t.filter(x=>estGratuit(x.paiement));
  if(offerts.length)m.appendChild(el("p","muted num",GRATUITS.map(g=>{const q=offerts.filter(x=>x.paiement===g).reduce((s,x)=>s+(x.lignes||[]).reduce((a,l)=>a+l.qte,0),0);return q?`${g} : ${q} bouteille${q>1?"s":""}`:"";}).filter(Boolean).join(" · ")));
  const actions=el("div","grid2");
  if(!v.cloturee&&canWrite){
    const b=el("button","btn go full","+ Transaction");
    b.onclick=()=>{sv=blankSv();horsOpen=false;go("saisie",v.id);};actions.appendChild(b);
  }
  if(downloads&&isAdmin()){const e=el("button","btn ghost full","Exporter CSV");e.onclick=()=>exportCSV(v);actions.appendChild(e);}
  if(actions.children.length===1)actions.style.gridTemplateColumns="1fr";
  if(actions.children.length)m.appendChild(actions);
  if(!v.cloturee&&canWrite){
    if(!confirmClose){
      const l=el("button","link","Clôturer la vente");l.onclick=()=>{confirmClose=true;render();};m.appendChild(l);
    }else{
      const cf=el("div","confirm",`<p style="font-size:13px;font-weight:700;color:var(--bad)">Clôturer « ${esc(v.nom)} » ? Plus aucune transaction ne pourra être saisie.</p>`);
      const r=el("div","grid2");
      const yes=el("button","btn danger sm","Clôturer");yes.onclick=()=>cloturer(v.id);
      const no=el("button","btn ghost sm","Annuler");no.onclick=()=>{confirmClose=false;render();};
      r.appendChild(yes);r.appendChild(no);cf.appendChild(r);m.appendChild(cf);
    }
  }
  const tabs=el("div","tabs");
  const tv=el("button",tab==="tx"?"active":"","Transactions"),ts=el("button",tab==="stock"?"active":"","Stocks"),tvd=el("button",tab==="vendeurs"?"active":"","Vendeurs");
  tv.onclick=()=>{tab="tx";render();};ts.onclick=()=>{tab="stock";render();};tvd.onclick=()=>{tab="vendeurs";render();};
  tabs.appendChild(tv);tabs.appendChild(ts);tabs.appendChild(tvd);m.appendChild(tabs);
  if(tab==="tx")renderTxList(m,t);else if(tab==="vendeurs")renderParVendeur(m,t);else renderStock(m,v);
  // suppression : libre tant qu'aucune transaction n'est saisie, réservée aux administrateurs ensuite
  if(!t.length||isAdmin()){
    if(confirmSuppr!==v.id){const l=el("button","link","Supprimer la vente");l.style.color="var(--bad)";l.onclick=()=>{confirmSuppr=v.id;render();};m.appendChild(l);}
    else{const cf=el("div","confirm",`<p style="font-size:13px;font-weight:700;color:var(--bad)">Supprimer « ${esc(v.nom)} »${t.length?` et ses ${t.length} transaction${t.length>1?"s":""}`:""} ? C'est définitif.</p>`);
      const r=el("div","grid2");const yes=el("button","btn danger sm","Supprimer");yes.onclick=()=>supprimerVente(v.id);
      const no=el("button","btn ghost sm","Annuler");no.onclick=()=>{confirmSuppr=null;render();};r.appendChild(yes);r.appendChild(no);cf.appendChild(r);m.appendChild(cf);}
  }else m.appendChild(txt("p","muted","Vente commencée : seul un administrateur peut la supprimer."));
}

let confirmSuppr=null;
async function supprimerVente(vid){
  if(busy)return;busy=true;
  try{
    const t=txsOf(vid);
    if(t.length&&!isAdmin())throw {code:"invalid_argument"};
    for(const x of t){await db.collection("transactions").doc(x.id).delete();try{await db.collection("clients").doc(x.id).delete();}catch(e){}}
    await db.collection("ventes").doc(vid).delete();
    ventes=ventes.filter(x=>x.id!==vid);txs=txs.filter(x=>x.venteId!==vid);confirmSuppr=null;
    busy=false;go("home");flash("Vente supprimée.","ok");
  }catch(e){busy=false;flash(dbMessage(e));render();}
}
// suivi des caissiers : ce que chacun a encaissé, par moyen de paiement

  const parV={};t.forEach(x=>{const k=x.vendeurPrenom||"Non renseigné";(parV[k]=parV[k]||[]).push(x);});
  Object.entries(parV).sort((a,b)=>b[1].reduce((s,x)=>s+(x.total||0),0)-a[1].reduce((s,x)=>s+(x.total||0),0)).forEach(([nom,l])=>{
    const tot=l.reduce((s,x)=>s+(x.total||0),0),art=l.reduce((s,x)=>s+(x.lignes||[]).reduce((a,y)=>a+y.qte,0),0);
    const c=el("div","card",`<div class="row"><p style="font-weight:800">${esc(nom)}</p><p class="num" style="font-weight:800;color:var(--accent-ink)">${fmt(tot)}</p></div>
      <p class="muted num">${l.length} transaction${l.length>1?"s":""} · ${art} article${art>1?"s":""}</p>`);

async function reassortir(v,refId,qte){
  if(qte<=0||busy)return flash("Indiquez une quantité.");
  busy=true;
  try{
    const refs=v.refs.map(r=>r.id!==refId?r:{...r,stock:(r.stock||0)+qte,reassorts:[...(r.reassorts||[]),{qte,date:new Date().toISOString(),par:sv.vendeur||store.get(VENDEUR_KEY)||monPrenom||""}]});
    await db.collection("ventes").doc(v.id).update({refs});v.refs=refs;flash(`Réassort de ${qte} enregistré.`,"ok");
  }catch(e){flash(dbMessage(e));}
  finally{busy=false;render();}
}
function renderStock(m,v){
  const c=el("div","card");
  v.refs.forEach(r=>{
    const vendu=venduDe(v.id,r.id);const illimite=!r.stock;
    const reste=(r.stock||0)-vendu;const pct=illimite?1:Math.max(0,reste/r.stock);
    const col=illimite?"var(--muted)":reste<=0?"var(--bad)":reste<=2?"var(--warn)":"var(--ok)";
    const etat=illimite?`${vendu} vendu${vendu>1?"s":""} · sans limite`:reste<0?`${reste} (à découvert)`:reste===0?"Rupture":`${reste} / ${r.stock}`;
    const ligneStock=el("div","stack",`<div class="row" style="font-size:14px"><span style="font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nom)} ${esc(r.format)}</span>
      <span class="num" style="font-weight:700;white-space:nowrap;color:${col}">${esc(etat)}</span></div>
      ${illimite?"":`<div class="bar"><i style="width:${pct*100}%;background:${col}"></i></div>`}
      <p class="muted num">${fmt(r.prix)} / unité${illimite?"":" · "+vendu+" vendu"+(vendu>1?"s":"")}${(r.reassorts||[]).length?" · réassort +"+r.reassorts.reduce((s,x)=>s+x.qte,0):""}</p>`);
    c.appendChild(ligneStock);
    if(!v.cloturee&&canWrite){const f=el("form","row");f.style.cssText="justify-content:flex-start;gap:6px";
      const q=el("input");q.type="number";q.min="1";q.inputMode="numeric";q.placeholder="Qté";q.setAttribute("aria-label","Quantité à réassortir");q.style.cssText="width:80px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;background:var(--surface);color:var(--fg)";
      const b=el("button","btn ghost sm","+ Réassort");b.type="submit";f.appendChild(q);f.appendChild(b);
      f.onsubmit=e=>{e.preventDefault();reassortir(v,r.id,parseInt(q.value)||0);};ligneStock.appendChild(f);}
  });

async function submitTx(){
  if(busy)return;
  const v=getVente();
  if(!v||v.cloturee)return flash("Cette vente est clôturée.");
  if(!sv.vendeur.trim())return flash("Indiquez votre prénom de vendeur.");
  const gratuit=estGratuit(sv.pmt);
  if(!gratuit&&(!sv.client.prenom.trim()||!sv.client.nom.trim()))return flash(sv.client.nouveau||sv.client.existant?"Indiquez le prénom et le nom du client.":"Choisissez un client existant ou « Nouveau client ».");
  if(!gratuit&&sv.client.nouveau&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(sv.client.email.trim()))return flash("Indiquez l'email du nouveau client.");
  if(!sv.lignes.length)return flash("Ajoutez au moins un produit.");
  const id="t"+uid();
  const lignes=sv.lignes.map(l=>({refId:l.refId,nom:l.nom,format:l.format,qte:l.qte,prix:gratuit?0:l.prix,...(gratuit?{valeur:l.prix}:{}),...(l.libre?{libre:true}:{})}));
  if(gratuit&&!sv.client.prenom.trim())sv.client.prenom=sv.pmt;
  const contact={prenom:sv.client.prenom.trim(),nom:sv.client.nom.trim(),tel:sv.client.tel.trim(),email:sv.client.email.trim()};
  // en public, seulement le prénom et l'initiale ; les coordonnées vont dans « clients », lisible par les admins
  const tx={venteId:v.id,client:{prenom:contact.prenom,initiale:contact.nom.charAt(0).toUpperCase()},
    lignes,paiement:sv.pmt,total:lignes.reduce((s,l)=>s+l.qte*l.prix,0),vendeurPrenom:sv.vendeur.trim(),date:new Date().toISOString()};
  busy=true;updateTotal();
  try{
    await db.collection("transactions").doc(id).set(tx);
    try{await db.collection("clients").doc(id).set({...contact,venteId:v.id,date:tx.date});}
    catch(e){flash("Vente enregistrée, mais les coordonnées du client n'ont pas pu l'être.");}
    store.set(VENDEUR_KEY,sv.vendeur.trim());
    if(!txs.find(x=>x.id===id))txs.push({id,...tx});
    sv=blankSv();horsOpen=false;
    busy=false;go("vente",v.id);flash(`Transaction enregistrée : ${fmt(tx.total)}.`,"ok");
    // la facture reste proposée au retour de l'app SumUp (la page est alors rechargée)
    if(gratuit){}
    else{factureEnAttente.set(id,contact);store.set(FACTURE_KEY,JSON.stringify({id,contact,t:Date.now()}));}
    if(gratuit){}
    else if(tx.paiement==="CB")ouvrirSumUp(tx.total,id,v.nom,()=>ouvrirFacture(id));
    else ouvrirFacture(id);
  }catch(e){busy=false;updateTotal();flash(dbMessage(e));}
}

const ETAGES=[[3,"3e étage"],[2,"2e étage"],[1,"1er étage"]];
let chView="liste", resas=[], sejour={du:"",au:""}, roomOpenId=null, roomForm=null, adjustPins=false, planStart=today(), confirmResa=null;
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10);};
const nuits=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const frCourt=d=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const overlap=(a1,d1,a2,d2)=>a1<d2&&a2<d1;
const resasDe=id=>resas.filter(r=>r.chambreId===id).sort((a,b)=>a.arrivee.localeCompare(b.arrivee));
const sejourOk=()=>sejour.du&&sejour.au&&sejour.du<sejour.au;
// statut d'une chambre : sur le séjour choisi, sinon pour la nuit de ce soir
function statut(c){
  if(c.type!=="chambre")return null;
  const [du,au]=sejourOk()?[sejour.du,sejour.au]:[today(),addDays(today(),1)];
  const r=resasDe(c.id).filter(x=>overlap(du,au,x.arrivee,x.depart));
  return r.length?{libre:false,qui:r.map(x=>x.nom).join(", ")}:{libre:true};
}

  const rooms=chambres.filter(c=>c.type==="chambre");

/* plan du château : photo aérienne (1500×842) et repères par étage et par côté */
const PLAN_W=1500, PLAN_H=842, CROP={x:410,y:330,w:450,h:290}; // cadrage sur le château
const LNG_EST=-0.28312, LNG_OUEST=-0.28356; // côté Balançoire (avant gauche) → côté Cuisine (arrière droite)
const LNG_COTE={Balançoire:-0.28320,Milieu:-0.28339,Cuisine:-0.28352};
const Y_ETAGE={1:505,2:474,3:446};
function posDefaut(c){
  let lng=null;const g=(c.gps||"").split(",").map(Number);
  if(g.length===2&&!isNaN(g[1])&&g[1]<0)lng=g[1];
  if(lng==null)lng=LNG_COTE[c.aile]??LNG_COTE.Milieu;
  const t=Math.min(1,Math.max(0,(lng-LNG_EST)/(LNG_OUEST-LNG_EST)));
  const x=470+t*330, y=(Y_ETAGE[c.etage]||505)-0.15*(x-470);
  return {px:(x-CROP.x)/CROP.w*100,py:(y-CROP.y)/CROP.h*100};
}
function renderPlan(z){
  const rooms=chambres.filter(c=>c.type==="chambre").sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  const wrap=el("div","plan"+(adjustPins?" adjust":""));
  wrap.style.aspectRatio=CROP.w+"/"+CROP.h;
  const img=el("img","plan-img");img.src="chateau.webp";img.alt="Vue aérienne du château de Ravignan";
  img.style.width=(PLAN_W/CROP.w*100)+"%";img.style.left=(-CROP.x/CROP.w*100)+"%";img.style.top=(-CROP.y/CROP.h*100)+"%";
  wrap.appendChild(img);
  const pos=rooms.map(c=>({c,...(typeof c.px==="number"&&typeof c.py==="number"?{px:c.px,py:c.py}:posDefaut(c))}));
  // écarte les repères superposés quand la position vient du calcul
  pos.forEach((p,i)=>{let k=0;while(pos.slice(0,i).some(o=>Math.abs(o.px-p.px)<4.5&&Math.abs(o.py-p.py)<6)&&k<8){p.px+=4.6;k++;}});
  pos.forEach((p,i)=>{
    const s=statut(p.c);
    const pin=el("button","pin "+(s.libre?"free":"busy"),String(i+1));
    pin.style.left=p.px+"%";pin.style.top=p.py+"%";
    pin.title=p.c.nom+(s.libre?" · libre":" · "+s.qui);
    pin.setAttribute("aria-label",p.c.nom+(s.libre?", libre":", réservée"));
    if(adjustPins)dragPin(pin,wrap,p.c);else pin.onclick=()=>openRoom(p.c.id);
    wrap.appendChild(pin);
  });
  z.appendChild(wrap);
  const tools=el("div","row");
  tools.appendChild(el("p","muted",adjustPins?"Faites glisser chaque repère sur sa fenêtre. La position est enregistrée au relâchement.":"Repères placés d'après l'étage et le côté de chaque chambre. Touchez un numéro pour ouvrir la chambre."));
  if(isAdmin()){const b=el("button","btn ghost sm",adjustPins?"Terminer":"Ajuster les repères");b.onclick=()=>{adjustPins=!adjustPins;refreshChambres();};tools.appendChild(b);}
  z.appendChild(tools);
  const leg=el("div","legend");
  pos.forEach((p,i)=>{
    const s=statut(p.c);
    const b=el("button","leg-item",`<span class="leg-n ${s.libre?"free":"busy"}">${i+1}</span>`);
    const t=el("span");t.textContent=p.c.nom;b.appendChild(t);
    b.onclick=()=>openRoom(p.c.id);leg.appendChild(b);
  });
  z.appendChild(leg);
}
function dragPin(pin,wrap,c){
  pin.onpointerdown=e=>{
    e.preventDefault();pin.setPointerCapture(e.pointerId);pin.classList.add("drag");
    const r=wrap.getBoundingClientRect();let px,py;
    const move=ev=>{px=Math.min(99,Math.max(1,(ev.clientX-r.left)/r.width*100));py=Math.min(99,Math.max(1,(ev.clientY-r.top)/r.height*100));pin.style.left=px+"%";pin.style.top=py+"%";};
    pin.onpointermove=move;
    pin.onpointerup=async()=>{
      pin.onpointermove=null;pin.onpointerup=null;pin.classList.remove("drag");
      if(px==null)return;
      try{await db.collection("chambres").doc(c.id).update({px:Math.round(px*100)/100,py:Math.round(py*100)/100});}
      catch(err){flash(dbMessage(err));}
    };
  };
}

function openRoom(id,arrivee){

  const au=arrivee?addDays(arrivee,1):(sejourOk()?sejour.au:addDays(du,1));

}
function closeRoom(){roomOpenId=null;qs("#modal").hidden=true;document.body.style.overflow="";document.body.classList.remove("modal-open");}
function renderRoomModal(){
  const c=chambres.find(x=>x.id===roomOpenId);const sh=qs("#modal .sheet");
  if(!c){closeRoom();return;}
  // garde la saisie en cours si le formulaire est déjà affiché

  sh.appendChild(roomPhoto(c,"sheet-photo"));
  const meta=el("div","meta");

  [c.couchage,c.localisation].filter(Boolean).forEach(v=>{const t=el("span","tag");t.textContent=v;meta.appendChild(t);});
  sh.appendChild(meta);
  if(c.gps&&/^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(c.gps)){
    const a=el("a","map-link","Voir sur la carte ↗");a.href="https://www.google.com/maps?q="+encodeURIComponent(c.gps.replace(/\s+/g,""));a.target="_blank";a.rel="noopener";sh.appendChild(a);
  }
  if(c.type!=="chambre")return;
  // réservations
  const rs=resasDe(c.id).filter(r=>r.depart>addDays(today(),-1));
  const box=el("div","stack");box.appendChild(el("h3","sheet-sub","Réservations"));
  if(!rs.length)box.appendChild(el("p","muted","Aucune réservation à venir."));
  rs.forEach(r=>{
    const row=el("div","resa");
    const t=el("div");t.style.minWidth="0";
    const n=el("p");n.style.fontWeight="700";n.textContent=r.nom;t.appendChild(n);
    t.appendChild(el("p","muted num",`${esc(frCourt(r.arrivee))} → ${esc(frCourt(r.depart))} · ${nuits(r.arrivee,r.depart)} nuit${nuits(r.arrivee,r.depart)>1?"s":""}`));
    if(r.note){const no=el("p","muted");no.textContent=r.note;t.appendChild(no);}
    row.appendChild(t);
    if(canWrite){
      if(confirmResa===r.id){
        const g=el("div","row");
        const y=el("button","btn danger sm","Annuler la réservation");y.onclick=()=>supprimerResa(r.id);
        const n2=el("button","btn ghost sm","Garder");n2.onclick=()=>{confirmResa=null;renderRoomModal();};
        g.appendChild(y);g.appendChild(n2);row.appendChild(g);
      }else{const d=el("button","link","Annuler");d.onclick=()=>{confirmResa=r.id;renderRoomModal();};row.appendChild(d);}
    }
    box.appendChild(row);
  });
  sh.appendChild(box);
  if(!canWrite)return;
  const form=el("form","card soft",`<h3 class="sheet-sub">Réserver cette chambre</h3>
    <div class="field"><label for="rs-nom">Pour qui ?</label><input id="rs-nom" required autocomplete="off" placeholder="ex : Tom & Jo"></div>
    <div class="grid2"><div class="field"><label for="rs-du">Arrivée</label><input id="rs-du" type="date" required></div>
    <div class="field"><label for="rs-au">Départ</label><input id="rs-au" type="date" required></div></div>

    <p class="muted" id="rs-info"></p>
    <button class="btn primary full" type="submit" id="rs-ok">Réserver</button>`);
  form.style.padding="14px";
  form.querySelector("#rs-nom").value=roomForm.nom;form.querySelector("#rs-du").value=roomForm.arrivee;

    const conf=a&&b&&a<b?resasDe(c.id).filter(r=>overlap(a,b,r.arrivee,r.depart)):[];

  };

  info();sh.appendChild(form);
}
async function reserver(c,form){
  if(busy)return;
  const nom=form.querySelector("#rs-nom").value.trim(),a=form.querySelector("#rs-du").value,b=form.querySelector("#rs-au").value,note=form.querySelector("#rs-note").value.trim();
  if(!nom)return flash("Indiquez pour qui est la réservation.");
  if(!(a&&b&&a<b))return flash("Le départ doit être après l'arrivée.");
  const conf=resasDe(c.id).filter(r=>overlap(a,b,r.arrivee,r.depart));
  if(conf.length)return flash(`${c.nom} est déjà réservée sur ces dates (${conf.map(r=>r.nom).join(", ")}).`);
  busy=true;form.querySelector("#rs-ok").disabled=true;
  try{
    await db.collection("reservations").doc("r"+uid()).set({chambreId:c.id,nom,arrivee:a,depart:b,note,createdAt:new Date().toISOString()});
    roomForm={nom:"",arrivee:b,depart:addDays(b,1),note:""};
    const f=qs("#modal .sheet #rs-nom");if(f)f.remove();
    flash(`${c.nom} réservée pour ${nom}, du ${frCourt(a)} au ${frCourt(b)}`,"ok");
  }catch(err){flash(dbMessage(err));}
  finally{busy=false;renderRoomModal();}
}
async function supprimerResa(id){
  if(busy)return;busy=true;
  try{await db.collection("reservations").doc(id).delete();confirmResa=null;flash("Réservation annulée.","ok");}
  catch(err){flash(dbMessage(err));}
  finally{busy=false;renderRoomModal();}
}

/* graphiques SVG simples (un seul axe, survol avec infobulle) */
function graphLigne({titre,series,ux,uy,points}){
  const W=640,H=280,L=48,R=16,T=16,B=36;
  const all=[...series.flatMap(s=>s.pts),...(points||[]).flatMap(s=>s.pts)];
  const xmin=Math.floor(Math.min(...all.map(p=>p.x))/5)*5,xmax=Math.ceil(Math.max(...all.map(p=>p.x))/5)*5;
  const ymax=Math.ceil(Math.max(...all.map(p=>p.y))/50)*50;
  const X=v=>L+(v-xmin)/(xmax-xmin)*(W-L-R),Y=v=>T+(1-v/ymax)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(titre)}">`;
  for(let v=0;v<=ymax;v+=ymax/5){s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axe" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}${uy}</text>`;}
  for(let v=xmin;v<=xmax;v+=5)s+=`<text class="axe" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}${ux}</text>`;
  series.forEach(se=>{const ps=[...se.pts].sort((a,b)=>a.x-b.x);
    s+=`<polyline class="ligne ${se.cls}" points="${ps.map(p=>X(p.x)+","+Y(p.y)).join(" ")}"/>`;
    ps.forEach(p=>s+=`<circle class="pt ${se.cls}" cx="${X(p.x)}" cy="${Y(p.y)}" r="5" data-tip="${esc(se.nom+" "+(p.label||"")+" · "+p.x+ux+" · "+p.y+uy)}"/>`);});
  (points||[]).forEach(se=>se.pts.forEach(p=>s+=`<rect class="pt ${se.cls}" x="${X(p.x)-5}" y="${Y(p.y)-5}" width="10" height="10" rx="2" data-tip="${esc((p.label||se.nom)+" · "+p.x+ux+" · "+p.y+uy)}"/>`));
  s+="</svg>";
  const w=el("figure","fig",`<figcaption>${esc(titre)}</figcaption>`);
  const box=el("div","chart-box",s);const tip=el("div","tip");tip.hidden=true;box.appendChild(tip);w.appendChild(box);
  const lg=el("div","legende");[...series,...(points||[])].forEach(se=>lg.appendChild(el("span","",`<i class="sw ${se.cls}${points&&points.includes(se)?" carre":""}"></i>${esc(se.nom)}`)));
  if(series.length+(points||[]).length>1)w.appendChild(lg);
  brancherTip(box,tip);return w;
}
function graphDonut({titre,parts,note}){
  const tot=parts.reduce((s,p)=>s+p.v,0);const R=80,r=50,C=100;let a=-Math.PI/2;
  let s=`<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="${esc(titre)}">`;
  parts.forEach(p=>{const da=p.v/tot*Math.PI*2,a2=a+da,g=0.012;
    const P=(rad,t)=>[C+rad*Math.cos(t),C+rad*Math.sin(t)];const [x1,y1]=P(R,a+g),[x2,y2]=P(R,a2-g),[x3,y3]=P(r,a2-g),[x4,y4]=P(r,a+g);const big=da>Math.PI?1:0;
    s+=`<path class="part ${p.cls}" d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" data-tip="${esc(p.nom+" : "+p.lab)}"/>`;a=a2;});
  s+="</svg>";
  const w=el("figure","fig",`<figcaption>${esc(titre)}</figcaption>`);
  const row=el("div","donut-row");const box=el("div","chart-box",s);const tip=el("div","tip");tip.hidden=true;box.appendChild(tip);row.appendChild(box);
  const lg=el("ul","legende-v");parts.forEach(p=>lg.appendChild(el("li","",`<i class="sw ${p.cls}"></i><span>${esc(p.nom)}</span><b class="num">${esc(p.lab)}</b>`)));row.appendChild(lg);
  w.appendChild(row);if(note)w.appendChild(txt("p","muted",note));brancherTip(box,tip);return w;
}
function brancherTip(box,tip){
  const montrer=e=>{const t=e.target.closest("[data-tip]");if(!t){tip.hidden=true;return;}const r=box.getBoundingClientRect();
    tip.textContent=t.dataset.tip;tip.hidden=false;const x=(e.clientX??r.left+r.width/2)-r.left,y=(e.clientY??r.top)-r.top;
    tip.style.left=Math.min(Math.max(x,70),r.width-70)+"px";tip.style.top=Math.max(y-12,0)+"px";};
  box.addEventListener("pointermove",montrer);box.addEventListener("pointerdown",montrer);box.addEventListener("pointerleave",()=>tip.hidden=true);
}

// carte satellite (Leaflet + imagerie Esri), chargée seulement sur cette page
let leafletPromesse=null;
function chargerLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletPromesse)return leafletPromesse;
  leafletPromesse=new Promise((ok,ko)=>{
    const css=document.createElement("link");css.rel="stylesheet";css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(css);
    const js=document.createElement("script");js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";js.onload=ok;js.onerror=ko;document.head.appendChild(js);
  });

}
function carteSatellite(doms){
  const c=carte("Carte des maisons d'armagnac");

  c.appendChild(txt("p","muted","Vue satellite. Touchez un point pour voir la maison ; le point orange est le Château de Ravignan."));

    if(!box.isConnected)return;

    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:18}).addTo(carteLeaflet);
    const pts=[];

      const mk=L.circleMarker([x.lat,x.lng],{radius:moi?11:7,color:"#fff",weight:2,fillColor:moi?"#e08a3c":"#2a78d6",fillOpacity:1}).addTo(carteLeaflet);
      const div=document.createElement("div");div.className="pop";
      div.appendChild(txt("b","",x.nom));div.appendChild(txt("span","",[x.commune,x.terroir].filter(Boolean).join(" · ")));if(x.particularite)div.appendChild(txt("p","",x.particularite));
      mk.bindPopup(div,{maxWidth:260});if(moi){mk.bindTooltip("Château de Ravignan",{permanent:true,direction:"right",className:"tt-moi"});}
      pts.push([x.lat,x.lng]);});

// petite carte schématique : chaque maison placée d'après sa latitude / longitude
function carteDomaines(doms){
  const c=carte("Carte des maisons");
  const lats=doms.map(x=>x.lat),lngs=doms.map(x=>x.lng);
  const pad=0.08,minLat=Math.min(...lats)-pad,maxLat=Math.max(...lats)+pad,minLng=Math.min(...lngs)-pad,maxLng=Math.max(...lngs)+pad;
  const W=800,kx=Math.cos((minLat+maxLat)/2*Math.PI/180),H=Math.round(W*(maxLat-minLat)/((maxLng-minLng)*kx));
  const X=l=>(l-minLng)/(maxLng-minLng)*W,Y=l=>(maxLat-l)/(maxLat-minLat)*H;
  const NS="http://www.w3.org/2000/svg";const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","dmap");svg.setAttribute("role","img");svg.setAttribute("aria-label","Carte schématique des maisons d'armagnac");
  const info=txt("p","muted","Touchez un point pour voir la maison. Le point orange est Ravignan.");
  doms.forEach(x=>{
    const moi=/ravignan/i.test(x.nom);const g=document.createElementNS(NS,"g");g.setAttribute("tabindex","0");
    const ci=document.createElementNS(NS,"circle");ci.setAttribute("cx",X(x.lng));ci.setAttribute("cy",Y(x.lat));ci.setAttribute("r",moi?10:6);ci.setAttribute("class",moi?"pt moi":"pt");
    const ti=document.createElementNS(NS,"title");ti.textContent=x.nom+" · "+(x.commune||"");ci.appendChild(ti);g.appendChild(ci);
    if(moi){const t=document.createElementNS(NS,"text");t.setAttribute("x",X(x.lng)+14);t.setAttribute("y",Y(x.lat)+5);t.setAttribute("class","pt-lab");t.textContent="Ravignan";g.appendChild(t);}
    const voir=()=>{info.textContent=x.nom+" — "+[x.commune,x.terroir].filter(Boolean).join(", ")+(x.particularite?" · "+x.particularite:"");};
    g.onclick=voir;g.onkeydown=e=>{if(e.key==="Enter")voir();};svg.appendChild(g);
  });
  const w=el("div","dmap-wrap");w.appendChild(svg);c.appendChild(w);c.appendChild(info);return c;
}

const nomComplet=p=>[p.titre,p.prenom,p.nom].filter(Boolean).join(" ");
const datesDe=p=>p.vivant?"":(p.naissance||p.deces?`${annee(p.naissance)||"?"} – ${annee(p.deces)||(p.naissance&&+annee(p.naissance)<1925?"?":"")}`:"");

function layoutFamille(){
  // Mise en page par familles : chaque couple forme un bloc, ses enfants sont centrés dessous,
  // et chaque branche occupe sa propre largeur pour ne jamais se mêler aux branches voisines.
  const byId=new Map(famille.map(p=>[p.id,p]));
  const par=p=>(p.parents||[]).filter(id=>byId.has(id));
  const conj=p=>(p.conjoints||[]).filter(id=>byId.has(id));
  const enfantsDe=new Map();famille.forEach(p=>par(p).forEach(id=>{if(!enfantsDe.has(id))enfantsDe.set(id,[]);enfantsDe.get(id).push(p);}));
  const descendants=id=>{const vu=new Set();const pile=[id];while(pile.length){const x=pile.pop();(enfantsDe.get(x)||[]).forEach(c=>{if(!vu.has(c.id)){vu.add(c.id);pile.push(c.id);}});}return vu;};
  // la lignée principale : les descendants de l'ancêtre qui en a le plus
  const racines=famille.filter(p=>!par(p).length);
  const ancetre=[...racines].sort((a,b)=>descendants(b.id).size-descendants(a.id).size)[0];
  const lignee=ancetre?descendants(ancetre.id):new Set();if(ancetre)lignee.add(ancetre.id);
  // qui est dessiné à côté de son conjoint plutôt que sous ses propres parents
  const hote=new Map();
  famille.forEach(p=>{const sp=conj(p);if(!sp.length)return;
    if(!par(p).length){const h=sp.find(s=>par(byId.get(s)).length||lignee.has(s));if(h&&!(hote.get(h)===p.id))hote.set(p.id,h);}
    else if(!lignee.has(p.id)){const h=sp.find(s=>lignee.has(s));if(h)hote.set(p.id,h);}});
  // un conjoint rattaché à un conjoint lui-même rattaché remonte jusqu'à la personne d'origine
  const ancre=id=>{let x=id,n=0;while(hote.has(x)&&n<5){x=hote.get(x);n++;}return x;};
  const unites=new Map();
  famille.forEach(p=>{const a=ancre(p.id);if(!unites.has(a))unites.set(a,{ancre:a,membres:[a],enfants:[]});if(a!==p.id)unites.get(a).membres.push(p.id);});
  const uniteDe=id=>unites.get(ancre(id));
  const tri=(a,b)=>(a.ordre??99)-(b.ordre??99)||annee(a.naissance).localeCompare(annee(b.naissance))||famille.indexOf(a)-famille.indexOf(b);
  // chaque enfant (non rattaché) est placé sous la famille de son premier parent connu
  const place=new Set();
  famille.filter(p=>!hote.has(p.id)&&par(p).length).sort(tri).forEach(p=>{const u=uniteDe(par(p)[0]);if(u&&u.ancre!==p.id&&!place.has(p.id)){u.enfants.push(unites.get(p.id));place.add(p.id);}});
  unites.forEach(u=>u.enfants.sort((a,b)=>tri(byId.get(a.ancre),byId.get(b.ancre))));
  const GF=48; // écart entre deux familles voisines
  const largeurBloc=u=>u.membres.length*NW+(u.membres.length-1)*GX;
  const larg=new Map();
  const largeur=u=>{if(larg.has(u))return larg.get(u);larg.set(u,largeurBloc(u));
    const k=u.enfants.reduce((s,c,i)=>s+largeur(c)+(i?GF:0),0);const w=Math.max(largeurBloc(u),k);larg.set(u,w);return w;};
  const pos=new Map();
  const poser=(u,gauche,niveau)=>{const w=largeur(u);
    const kw=u.enfants.reduce((s,c,i)=>s+largeur(c)+(i?GF:0),0);let x=gauche+(w-kw)/2;
    const centres=[];u.enfants.forEach(c=>{poser(c,x,niveau+1);const pc=pos.get(c.ancre);centres.push(pc.x+NW/2);x+=largeur(c)+GF;});
    const lb=largeurBloc(u);let x0=centres.length?(centres[0]+centres[centres.length-1])/2-lb/2:gauche+(w-lb)/2;
    x0=Math.max(gauche,Math.min(x0,gauche+w-lb));
    u.membres.forEach((id,i)=>pos.set(id,{x:x0+i*(NW+GX),y:niveau*(NH+GY)}));};
  // familles de départ : les racines qui ont des enfants dans l'arbre, la lignée principale d'abord
  const depart=[...unites.values()].filter(u=>!par(byId.get(u.ancre)).length&&!place.has(u.ancre));
  const avecEnfants=depart.filter(u=>u.enfants.length).sort((a,b)=>(lignee.has(b.ancre)?1:0)-(lignee.has(a.ancre)?1:0));
  let x=0;avecEnfants.forEach(u=>{poser(u,x,0);x+=largeur(u)+GF*3;});
  // familles « par alliance » (ex. les parents d'un conjoint) : au-dessus de leur enfant, sans chevaucher
  const occupe=y=>[...pos.values()].filter(p=>p.y===y);
  depart.filter(u=>!u.enfants.length&&!pos.has(u.ancre)).forEach(u=>{
    const ch=(enfantsDe.get(u.ancre)||[]).map(c=>pos.get(c.id)).filter(Boolean)[0];
    const lb=largeurBloc(u);let y=ch?ch.y-(NH+GY):0,xx=ch?ch.x:x;
    if(y<0){y=0;}
    const libre=v=>occupe(y).every(p=>v+lb+GX<=p.x||v>=p.x+NW+GX);
    let n=0;while(!libre(xx)&&n<200){xx+=NW/2;n++;}
    u.membres.forEach((id,i)=>pos.set(id,{x:xx+i*(NW+GX),y}));
    if(!ch)x+=lb+GF;});
  famille.forEach(p=>{if(!pos.has(p.id)){pos.set(p.id,{x,y:0});x+=NW+GF;}});
  return {pos,byId,par,conj,gen:null};
}

  const chef=[...nb.entries()].sort((a,b)=>b[1]-a[1])[0];
  if(chef&&chef[1]>2){const fr=famille.filter(p=>(p.parents||[]).includes(chef[0])).sort((a,b)=>(a.ordre??99)-(b.ordre??99));
    const w=el("div","chips fam-branches");w.appendChild(txt("span","muted","Branches : "));
    fr.forEach(p=>{const b=txt("button","chip",p.prenom);b.onclick=()=>{famSel=p.id;voirFamille(p.id);dessinerArbre();ficheFamille();};w.appendChild(b);});
    m.appendChild(w);}
  const zone=el("div","fam-zone");zone.id="fam-zone";
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.id="fam-svg";svg.setAttribute("role","img");svg.setAttribute("aria-label","Arbre généalogique de la famille");
  zone.appendChild(svg);m.appendChild(zone);
  m.appendChild(txt("p","muted","Faites glisser pour vous déplacer, molette ou pincement pour zoomer, touchez une personne pour voir sa fiche."));
  const fiche=el("div","stack");fiche.id="fam-fiche";m.appendChild(fiche);
  brancherPanZoom(zone);
  if(!familleChargee){svg.innerHTML="";zone.appendChild(el("div","empty fam-vide","Chargement de l'arbre…"));return;}
  if(!famille.length){zone.appendChild(el("div","empty fam-vide","L'arbre est vide pour le moment."));ficheFamille();return;}
  if(famVue.k===1&&famVue.x===0&&famVue.y===0){ajusterVue();
    // arbre large : on ouvre lisible, centré sur le baron Jean-Hippolyte (mort au château)
    if(famVue.k<0.55){const nb=new Map();famille.forEach(p=>(p.parents||[]).forEach(id=>nb.set(id,(nb.get(id)||0)+1)));
      const chef=[...nb.entries()].sort((a,b)=>b[1]-a[1])[0];if(chef)voirFamille(chef[0]);}}
  dessinerArbre();ficheFamille();
}
function dessinerArbre(){
  const svg=qs("#fam-svg");if(!svg)return;
  const NS="http://www.w3.org/2000/svg";svg.innerHTML="";
  const {pos,byId,par}=layoutFamille();
  const g=document.createElementNS(NS,"g");g.setAttribute("transform",`translate(${famVue.x},${famVue.y}) scale(${famVue.k})`);svg.appendChild(g);
  const ligne=(d,cls)=>{const p=document.createElementNS(NS,"path");p.setAttribute("d",d);p.setAttribute("class",cls);g.appendChild(p);};
  // liens de couple
  const fait=new Set();
  famille.forEach(p=>(p.conjoints||[]).forEach(id=>{const k=[p.id,id].sort().join("|");if(fait.has(k)||!pos.has(id))return;fait.add(k);
    const a=pos.get(p.id),b=pos.get(id);if(a.y!==b.y)return;const y=a.y+NH/2;ligne(`M${Math.min(a.x,b.x)+NW} ${y} H${Math.max(a.x,b.x)}`,"fam-couple");}));
  // liens parents → enfants (depuis le milieu du couple de parents)
  famille.forEach(p=>{const ps=par(p);if(!ps.length)return;const c=pos.get(p.id);
    const px=ps.map(id=>pos.get(id).x+NW/2);const py=Math.max(...ps.map(id=>pos.get(id).y))+NH;
    const sx=px.reduce((s,x)=>s+x,0)/px.length, cx=c.x+NW/2, my=c.y-GY/2;
    ligne(`M${sx} ${py} V${my} H${cx} V${c.y}`,"fam-lien");});
  famille.forEach(p=>{
    const {x,y}=pos.get(p.id);const n=document.createElementNS(NS,"g");n.setAttribute("class","fam-noeud"+(p.id===famSel?" sel":"")+(p.incertain?" incertain":""));
    n.setAttribute("transform",`translate(${x},${y})`);n.setAttribute("tabindex","0");n.setAttribute("role","button");n.setAttribute("aria-label",nomComplet(p));
    const r=document.createElementNS(NS,"rect");r.setAttribute("width",NW);r.setAttribute("height",NH);r.setAttribute("rx",12);n.appendChild(r);
    // portrait : photo si une adresse est renseignée, sinon les initiales
    const cid="av-"+p.id.replace(/[^a-z0-9-]/gi,"");
    const cp=document.createElementNS(NS,"clipPath");cp.id=cid;const cc=document.createElementNS(NS,"circle");cc.setAttribute("cx",30);cc.setAttribute("cy",NH/2);cc.setAttribute("r",20);cp.appendChild(cc);n.appendChild(cp);
    const fond=document.createElementNS(NS,"circle");fond.setAttribute("cx",30);fond.setAttribute("cy",NH/2);fond.setAttribute("r",20);fond.setAttribute("class","fam-av");n.appendChild(fond);
    const ini=document.createElementNS(NS,"text");ini.setAttribute("x",30);ini.setAttribute("y",NH/2+5);ini.setAttribute("text-anchor","middle");ini.setAttribute("class","fam-ini");
    ini.textContent=((p.prenom||"").charAt(0)+((p.nom||"").replace(/^(de |d'|du |de la )/i,"").charAt(0)||"")).toUpperCase();n.appendChild(ini);
    if(p.photo&&String(p.photo).startsWith("https://")){const im=document.createElementNS(NS,"image");im.setAttribute("href",p.photo);im.setAttribute("x",10);im.setAttribute("y",NH/2-20);im.setAttribute("width",40);im.setAttribute("height",40);
      im.setAttribute("preserveAspectRatio","xMidYMid slice");im.setAttribute("clip-path","url(#"+cid+")");n.appendChild(im);}
    const t1=document.createElementNS(NS,"text");t1.setAttribute("x",58);t1.setAttribute("y",27);t1.setAttribute("class","fam-nom");
    const nom=[p.prenom,p.nom].filter(Boolean).join(" ");t1.textContent=nom.length>15?nom.slice(0,14)+"…":nom;n.appendChild(t1);
    const bs=(p.badges||[]).filter(k=>BADGES[k]);
    if(bs.length){const w=bs.length*22+8,g2=document.createElementNS(NS,"g");g2.setAttribute("class","fam-badges");g2.setAttribute("transform",`translate(${NW-w-8},-12)`);
      const bg=document.createElementNS(NS,"rect");bg.setAttribute("width",w);bg.setAttribute("height",24);bg.setAttribute("rx",12);g2.appendChild(bg);
      bs.forEach((k,i)=>{const t=document.createElementNS(NS,"text");t.setAttribute("x",15+i*22);t.setAttribute("y",17);t.setAttribute("text-anchor","middle");if(BADGES[k].cls)t.setAttribute("class",BADGES[k].cls);t.textContent=BADGES[k].ico;g2.appendChild(t);});
      n.appendChild(g2);}
    const t2=document.createElementNS(NS,"text");t2.setAttribute("x",58);t2.setAttribute("y",46);t2.setAttribute("class","fam-dates");
    t2.textContent=[p.titre,datesDe(p)].filter(Boolean).join(" · ");n.appendChild(t2);
    const ti=document.createElementNS(NS,"title");ti.textContent=nomComplet(p);n.appendChild(ti);
    const choisir=()=>{famSel=p.id;famEdit=null;dessinerArbre();ficheFamille();qs("#fam-fiche")?.scrollIntoView({behavior:"smooth",block:"nearest"});};
    n.addEventListener("click",e=>{if(!famDrag.bouge)choisir();});n.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();choisir();}};
    g.appendChild(n);
  });
}
// cadre la famille d'une personne : elle, son conjoint et leurs enfants, à une taille lisible
function voirFamille(id){const z=qs("#fam-zone");if(!z)return;const {pos}=layoutFamille();const p=famille.find(x=>x.id===id);if(!p)return;
  const ids=[id,...(p.conjoints||[]),...famille.filter(x=>(x.parents||[]).includes(id)).map(x=>x.id)].filter(i=>pos.has(i));
  const xs=ids.map(i=>pos.get(i));const x0=Math.min(...xs.map(q=>q.x)),x1=Math.max(...xs.map(q=>q.x))+NW,y0=Math.min(...xs.map(q=>q.y)),y1=Math.max(...xs.map(q=>q.y))+NH;
  const k=Math.max(0.45,Math.min(1,(z.clientWidth-60)/(x1-x0),(z.clientHeight-80)/(y1-y0)));
  famVue={k,x:(z.clientWidth-(x1-x0)*k)/2-x0*k,y:(z.clientHeight-(y1-y0)*k)/2-y0*k};}
function bornesArbre(){const {pos}=layoutFamille();const xs=[...pos.values()].map(p=>p.x),ys=[...pos.values()].map(p=>p.y);
  return {x0:Math.min(...xs),x1:Math.max(...xs)+NW,y0:Math.min(...ys),y1:Math.max(...ys)+NH};}
function ajusterVue(){const z=qs("#fam-zone");if(!z||!famille.length)return;const b=bornesArbre();const W=z.clientWidth,H=z.clientHeight;
  const k=Math.min(1.2,Math.max(0.25,Math.min((W-40)/(b.x1-b.x0),(H-40)/(b.y1-b.y0))));
  famVue={k,x:(W-(b.x1-b.x0)*k)/2-b.x0*k,y:(H-(b.y1-b.y0)*k)/2-b.y0*k};}
function centrerSur(id){const z=qs("#fam-zone");const p=layoutFamille().pos.get(id);if(!z||!p)return;famVue.k=Math.max(famVue.k,0.8);
  famVue.x=z.clientWidth/2-(p.x+NW/2)*famVue.k;famVue.y=z.clientHeight/2-(p.y+NH/2)*famVue.k;}
function zoomer(f,cx,cy){const z=qs("#fam-zone");if(!z)return;cx??=z.clientWidth/2;cy??=z.clientHeight/2;
  const k=Math.min(2.5,Math.max(0.2,famVue.k*f));famVue.x=cx-(cx-famVue.x)*k/famVue.k;famVue.y=cy-(cy-famVue.y)*k/famVue.k;famVue.k=k;dessinerArbre();}
const famDrag={bouge:false};
function brancherPanZoom(z){
  const pts=new Map();let start=null;
  z.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});famDrag.bouge=false;
    if(pts.size===1)start={x:e.clientX,y:e.clientY,vx:famVue.x,vy:famVue.y};
    if(pts.size===2){const [a,b]=[...pts.values()];start={d:Math.hypot(a.x-b.x,a.y-b.y),k:famVue.k};}});
  z.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1&&start&&start.vx!=null){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4){famDrag.bouge=true;z.setPointerCapture(e.pointerId);}
      if(famDrag.bouge){famVue.x=start.vx+dx;famVue.y=start.vy+dy;dessinerArbre();}}
    else if(pts.size===2&&start&&start.d){famDrag.bouge=true;const [a,b]=[...pts.values()];const r=z.getBoundingClientRect();
      zoomer(start.k*Math.hypot(a.x-b.x,a.y-b.y)/start.d/famVue.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}});
  const fin=e=>{pts.delete(e.pointerId);if(!pts.size)start=null;setTimeout(()=>{famDrag.bouge=false;},0);};
  z.addEventListener("pointerup",fin);z.addEventListener("pointercancel",fin);
  z.addEventListener("wheel",e=>{e.preventDefault();const r=z.getBoundingClientRect();zoomer(e.deltaY<0?1.12:0.89,e.clientX-r.left,e.clientY-r.top);},{passive:false});
}

function ficheFamille(){
  const f=qs("#fam-fiche");if(!f)return;f.innerHTML="";
  if(famEdit){f.appendChild(formFamille(famEdit));return;}
  const p=famille.find(x=>x.id===famSel);if(!p)return;
  const byId=new Map(famille.map(x=>[x.id,x]));
  const c=el("div","card fam-carte");
  const h=el("div","row");h.appendChild(txt("h2","sheet-title",nomComplet(p)));
  const x=el("button","x","×");x.setAttribute("aria-label","Fermer la fiche");x.onclick=()=>{famSel=null;dessinerArbre();ficheFamille();};h.appendChild(x);c.appendChild(h);
  const vie=[];
  if(!p.vivant){if(p.naissance)vie.push("Né·e "+(p.naissance.length>4?"le "+frDate(p.naissance):"en "+p.naissance)+(p.lieu_naissance?" à "+p.lieu_naissance:""));
    if(p.deces)vie.push("Mort·e "+(p.deces.length>4?"le "+frDate(p.deces):"en "+p.deces)+(p.lieu_deces?" à "+p.lieu_deces:""));}

  if(p.role)c.appendChild(txt("p","",p.role));
  if(p.bio)c.appendChild(txt("p","",p.bio));
  if(p.incertain)c.appendChild(txt("span","tag","Lien ou date incertains"));
  const liens=(lab,ids)=>{ids=(ids||[]).filter(id=>byId.has(id));if(!ids.length)return;const r=el("div","fam-liens");r.appendChild(txt("span","muted",lab+" : "));
    ids.forEach(id=>{const b=txt("button","chip",nomComplet(byId.get(id)));b.onclick=()=>{famSel=id;centrerSur(id);dessinerArbre();ficheFamille();};r.appendChild(b);});c.appendChild(r);};
  liens("Parents",p.parents);liens("Conjoint·e",p.conjoints);
  liens("Enfants",famille.filter(q=>(q.parents||[]).includes(p.id)).sort((x,y)=>(x.ordre??99)-(y.ordre??99)).map(q=>q.id));
  if(p.photo&&String(p.photo).startsWith("https://")){const im=el("img","fam-photo");im.src=p.photo;im.alt="Portrait de "+nomComplet(p);im.onerror=()=>im.remove();c.insertBefore(im,c.children[1]);}
  const co=el("div","fam-coords");co.appendChild(txt("h3","sub","Coordonnées"));
  if(estMembre){const d=coords.get(p.id)||{};const l=el("div","fam-liens");
    if(d.email){const a=el("a","chip");a.href="mailto:"+d.email;a.textContent="✉️ "+d.email;l.appendChild(a);}
    if(d.tel){const a=el("a","chip");a.href="tel:"+d.tel.replace(/[^\d+]/g,"");a.textContent="📞 "+d.tel;l.appendChild(a);
      const w=lienWhatsApp(d.tel);if(w){const b=el("a","chip wa");b.href=w;b.target="_blank";b.rel="noopener";b.textContent="WhatsApp";l.appendChild(b);}}
    if(d.reseau||d.reseau_lien){const u=lienReseau(d.reseau,d.reseau_lien);const lab=(d.reseau||"Réseau")+(d.reseau_lien&&!/^https?:/.test(d.reseau_lien)?" : "+d.reseau_lien:"");
      if(u){const a=el("a","chip");a.href=u;a.target="_blank";a.rel="noopener";a.textContent=lab+" ↗";l.appendChild(a);}else l.appendChild(txt("span","chip",lab));}

const stripId=q=>{const {id,...r}=q;return r;};
async function envoyerPortrait(fichier,id){
  if(!String(fichier.type).startsWith("image/"))throw new Error("ce fichier n'est pas une image");
  const bmp=await createImageBitmap(fichier);
  const c=Math.min(bmp.width,bmp.height),t=Math.min(480,c);
  const cv=document.createElement("canvas");cv.width=t;cv.height=t;
  cv.getContext("2d").drawImage(bmp,(bmp.width-c)/2,(bmp.height-c)/2,c,c,0,0,t,t);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  const chemin=id.replace(/[^a-z0-9-]/gi,"")+"-"+Date.now()+".jpg";
  const {error}=await sb.storage.from("portraits").upload(chemin,blob,{contentType:"image/jpeg",upsert:false});
  if(error)throw error;
  return sb.storage.from("portraits").getPublicUrl(chemin).data.publicUrl;
}
async function supprimerPersonne(id){

  }catch(err){flash(dbMessage(err));}
}

   Collection « crm » : une fiche par client (clé = email, sinon nom + téléphone).
   {prenom, nom, email, tel, adresse, cp, ville, pays, sources:[], newsletter, tags:[], notes,
    achats:[{date, source, ref, produits:[{nom,qte,prix}], total}]}
   Les ventes saisies dans l'app (collection « clients » + « transactions ») s'ajoutent à l'affichage. */
let crm=[], crmCharge=false, crmAbonne=false, crmQuery="", crmFiltre="tous", crmTri="total", crmSel=null, crmImport=null;
const normEmail=e=>String(e||"").trim().toLowerCase();
const normTxt=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const cleClient=c=>normEmail(c.email)?"e:"+normEmail(c.email):"n:"+normTxt((c.prenom||"")+" "+(c.nom||""))+(c.tel?"|"+String(c.tel).replace(/\D/g,"").slice(-9):"");
const idCrm=cle=>"c"+[...cle].reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0,7).toString(36)+cle.replace(/[^a-z0-9]/g,"").slice(0,24);

function abonnerCrm(){
  if(crmAbonne||!estMembre)return;crmAbonne=true;
  db.collection("crm").onSnapshot(s=>{crm=s.docs.map(x=>({id:x.id,...x.data()}));crmCharge=true;if(page==="clients"&&!crmImport)render();},e=>flash(dbMessage(e)));
}
// fusion : fiches CRM + acheteurs des ventes privées
function clientsFusion(){
  const map=new Map();
  crm.forEach(c=>map.set(cleClient(c),{...c,achats:[...(c.achats||[])],sources:[...(c.sources||[])]}));
  txs.forEach(t=>{
    const c=clients.get(t.id);if(!c)return;
    const k=cleClient(c);let f=map.get(k);
    // rattache aussi par nom quand l'email manque d'un côté
    if(!f&&!normEmail(c.email)){for(const v of map.values()){if(normTxt(v.prenom+" "+v.nom)===normTxt(c.prenom+" "+c.nom)){f=v;break;}}}
    if(!f){f={id:null,prenom:c.prenom,nom:c.nom,email:c.email,tel:c.tel,sources:[],achats:[],tags:[]};map.set(k,f);}
    if(!f.email&&c.email)f.email=c.email;if(!f.tel&&c.tel)f.tel=c.tel;
    if(!f.sources.includes("Ventes privées"))f.sources.push("Ventes privées");
    const v=ventes.find(x=>x.id===t.venteId);
    f.achats.push({date:t.date,source:"Ventes privées",ref:v?v.nom:"",produits:(t.lignes||[]).map(l=>({nom:(l.nom+" "+(l.format||"")).trim(),qte:l.qte,prix:l.prix})),total:t.total||0,paiement:t.paiement});
  });
  return [...map.values()].map(c=>{
    const achats=c.achats.filter(a=>a.total||a.produits?.length).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    const total=achats.reduce((s,a)=>s+(+a.total||0),0);
    return {...c,achats,total,nbAchats:achats.reduce((s,a)=>s+(a.nb||1),0),dernier:achats[0]?.date||null};
  });
}

/* import CSV : Mailchimp (export d'audience) et Squarespace (commandes ou clients) */
function lireCsv(texte){
  texte=texte.replace(/^﻿/,"");const sep=(texte.split("\n")[0].match(/;/g)||[]).length>(texte.split("\n")[0].match(/,/g)||[]).length?";":",";
  const lignes=[];let champ="",ligne=[],q=false;
  for(let i=0;i<texte.length;i++){const ch=texte[i];
    if(q){if(ch==='"'){if(texte[i+1]==='"'){champ+='"';i++;}else q=false;}else champ+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){ligne.push(champ);champ="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&texte[i+1]==="\n")i++;ligne.push(champ);champ="";if(ligne.some(v=>v!==""))lignes.push(ligne);ligne=[];}
    else champ+=ch;}
  ligne.push(champ);if(ligne.some(v=>v!==""))lignes.push(ligne);
  const tete=lignes.shift()||[];return lignes.map(l=>Object.fromEntries(tete.map((h,i)=>[h.trim(),(l[i]??"").trim()])));
}
const col=(r,...noms)=>{for(const n of noms){const k=Object.keys(r).find(x=>x.toLowerCase()===n.toLowerCase());if(k&&r[k])return r[k];}return "";};
const nombre=v=>{v=String(v||"").replace(/[^\d,.-]/g,"");if(v.includes(",")&&v.includes("."))v=v.replace(/\./g,"").replace(",",".");else v=v.replace(",",".");return +v||0;};
const MOIS={janvier:1,"février":2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,"août":8,aout:8,septembre:9,octobre:10,novembre:11,"décembre":12,decembre:12};
const dateIso=v=>{v=String(v||"").trim();const fr=v.match(/^(\d{1,2})\s+([a-zéûô]+)\s+(\d{4})/i);if(fr&&MOIS[fr[2].toLowerCase()])return fr[3]+"-"+String(MOIS[fr[2].toLowerCase()]).padStart(2,"0")+"-"+fr[1].padStart(2,"0");const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10);};
function analyserImport(rows,nomFichier=""){
  const h=Object.keys(rows[0]||{}).map(x=>x.toLowerCase());
  const contacts=new Map();
  const ajout=(c,achat)=>{const k=cleClient(c);if(k==="n:")return;const f=contacts.get(k)||{...c,sources:[],achats:[],tags:[],notes:""};
    if(c.notes&&!String(f.notes||"").includes(c.notes))f.notes=[f.notes,c.notes].filter(Boolean).join(" · ");
    for(const kk of ["prenom","nom","email","tel","adresse","cp","ville","pays"])if(!f[kk]&&c[kk])f[kk]=c[kk];
    if(c.newsletter)f.newsletter=true;(c.tags||[]).forEach(t=>{if(!f.tags.includes(t))f.tags.push(t);});
    if(!f.sources.includes(c.source))f.sources.push(c.source);
    if(achat){const ex=f.achats.find(a=>a.ref===achat.ref&&a.source===achat.source);if(ex){ex.produits.push(...achat.produits);if(!ex.total&&achat.total)ex.total=achat.total;}else f.achats.push(achat);}
    contacts.set(k,f);};
  let type="inconnu";
  const fichier=nomFichier.toLowerCase();
  if(h.includes("adresse email")||(h.includes("email address")&&h.includes("member_rating")&&h.some(x=>x.startsWith("part - ")||x.startsWith("pros - ")))){
    const statut=fichier.includes("unsubscribed")?"Désabonné":fichier.includes("cleaned")?"Email invalide":"";
    type="Mailchimp"+(statut?" ("+statut.toLowerCase()+"s)":" (abonnés)");
    const groupes=Object.keys(rows[0]||{}).filter(k=>/^(part|pros)\s*-/i.test(k.trim()));
    rows.forEach(r=>{
      const tags=groupes.filter(g=>r[g]).map(g=>(/^pros/i.test(g.trim())?"Pro : ":"")+g.replace(/^(part|pros)\s*-\s*/i,"").trim());
      col(r,"TAGS").replace(/"/g,"").split(",").map(t=>t.trim()).filter(Boolean).forEach(t=>tags.push(t));
      if(statut)tags.push(statut);
      const ev=col(r,"Nom de la vente ou évènement");if(ev)tags.push(ev);
      const notes=[col(r,"Entreprise")&&"Entreprise : "+col(r,"Entreprise"),col(r,"Commentaire_libre"),col(r,"Comment avez-vous connu Ravignan ?")&&"A connu Ravignan : "+col(r,"Comment avez-vous connu Ravignan ?")].filter(Boolean).join(" · ");
      ajout({source:"Mailchimp",email:normEmail(col(r,"Adresse email","Email Address")),prenom:col(r,"Prénom","First Name"),nom:col(r,"Nom de famille","Last Name"),
        tel:col(r,"Numéro de téléphone","Phone Number"),adresse:col(r,"Address"),pays:col(r,"CC"),newsletter:!statut,tags,notes});});
  }
  else if(h.includes("e-mail")&&h.includes("nombre de commandes")){type="Squarespace (clients)";
    rows.forEach(r=>{const nb=+col(r,"Nombre de commandes")||0;
      ajout({source:"Squarespace",email:normEmail(col(r,"E-mail")),prenom:col(r,"Prénom"),nom:col(r,"Nom de famille"),
        tel:col(r,"Numéro de téléphone associé à la facturation","Numéro de téléphone associé à la livraison","Numéro de téléphone"),
        adresse:[col(r,"Adresse de facturation 1","Adresse de livraison 1"),col(r,"Adresse de facturation 2","Adresse de livraison 2")].filter(Boolean).join(", "),
        cp:col(r,"Code postal de facturation","Code postal de livraison"),ville:col(r,"Ville de facturation","Ville de livraison"),pays:col(r,"Pays de facturation","Pays de livraison"),
        newsletter:/^(oui|yes|true|vrai)/i.test(col(r,"Accepte les communications marketing par e-mail")),tags:[]},
        nb?{source:"Squarespace",ref:"Boutique en ligne · "+nb+" commande"+(nb>1?"s":""),nb,date:dateIso(col(r,"Date de la dernière commande")),produits:[],total:nombre(col(r,"Total des dépenses"))}:null);});
  }
  else if(h.includes("email address")&&(h.includes("first name")||h.includes("member_rating")||h.includes("optin_time"))){type="Mailchimp";
    rows.forEach(r=>ajout({source:"Mailchimp",email:normEmail(col(r,"Email Address")),prenom:col(r,"First Name","FNAME"),nom:col(r,"Last Name","LNAME"),tel:col(r,"Phone Number","PHONE"),
      adresse:col(r,"Address","ADDRESS"),newsletter:true,tags:col(r,"TAGS").replace(/"/g,"").split(",").map(t=>t.trim()).filter(Boolean)}));}
  else if(h.includes("order id")||h.includes("lineitem name")){type="Squarespace (commandes)";
    // les lignes suivantes d'une même commande peuvent laisser le client vide : on reprend celui de la commande
    const parCommande=new Map();
    rows.forEach(r=>{const oid=col(r,"Order ID");const prec=parCommande.get(oid);
      if(prec&&!col(r,"Email")&&!col(r,"Billing Name"))Object.assign(r,prec);else if(oid)parCommande.set(oid,{Email:col(r,"Email"),"Billing Name":col(r,"Billing Name"),"Billing Phone":col(r,"Billing Phone"),"Billing City":col(r,"Billing City"),"Billing Zip":col(r,"Billing Zip"),"Billing Country":col(r,"Billing Country"),"Billing Address1":col(r,"Billing Address1")});
      const nomc=col(r,"Billing Name","Shipping Name");const [p,...n]=nomc.split(" ");
      const qte=+col(r,"Lineitem quantity")||1,prix=+String(col(r,"Lineitem price")).replace(",",".")||0;
      ajout({source:"Squarespace",email:normEmail(col(r,"Email")),prenom:p||"",nom:n.join(" "),tel:col(r,"Billing Phone","Shipping Phone"),
        adresse:col(r,"Billing Address1","Shipping Address1"),cp:col(r,"Billing Zip","Shipping Zip"),ville:col(r,"Billing City","Shipping City"),pays:col(r,"Billing Country","Shipping Country"),
        newsletter:/yes|oui|true/i.test(col(r,"Accepts Marketing"))},
        {source:"Squarespace",ref:"Commande "+col(r,"Order ID"),date:col(r,"Paid at","Created at"),produits:col(r,"Lineitem name")?[{nom:col(r,"Lineitem name"),qte,prix}]:[],total:+String(col(r,"Total")).replace(",",".")||0});});}
  else if(h.includes("email")&&(h.includes("first name")||h.includes("last name"))){type="Squarespace (clients)";
    rows.forEach(r=>ajout({source:"Squarespace",email:normEmail(col(r,"Email")),prenom:col(r,"First Name"),nom:col(r,"Last Name"),tel:col(r,"Phone","Phone Number"),
      ville:col(r,"City","Billing City"),pays:col(r,"Country","Billing Country"),newsletter:/yes|oui|true|subscribed/i.test(col(r,"Accepts Marketing","Subscribed","Email Marketing"))}));}
  return {type,contacts:[...contacts.values()]};
}

    if(!contacts.length||types.every(t=>t.startsWith("inconnu"))){res.appendChild(txt("p","msg err","Format non reconnu. Utilisez l'export d'audience Mailchimp ou l'export de clients / commandes Squarespace."));return;}

    const go=el("button","btn primary sm","Importer");res.appendChild(go);

      const existants=new Map(crm.map(y=>[cleClient(y),y]));const lot=[];
      const envoyer=async()=>{if(!lot.length)return;const {error}=await sb.from("docs").upsert(lot.splice(0),{onConflict:"collection,id"});if(error)throw error;};
      try{for(const x of contacts){const k=cleClient(x);const ex=existants.get(k);
        const d=ex?{...stripId(ex)}:{prenom:"",nom:"",email:"",tel:"",adresse:"",cp:"",ville:"",pays:"",tags:[],notes:"",sources:[],achats:[],newsletter:false};
        for(const kk of ["prenom","nom","email","tel","adresse","cp","ville","pays"])if(!d[kk]&&x[kk])d[kk]=x[kk];
        if(x.newsletter)d.newsletter=true;d.tags=[...new Set([...(d.tags||[]),...x.tags])];d.sources=[...new Set([...(d.sources||[]),...x.sources])];
        const refs=new Set((d.achats||[]).map(a=>a.source+a.ref));d.achats=[...(d.achats||[]),...x.achats.filter(a=>!refs.has(a.source+a.ref))];d.maj=new Date().toISOString();
        if(!d.notes&&x.notes)d.notes=x.notes;
        lot.push({collection:"crm",id:ex?ex.id:idCrm(k),data:d,updated_at:new Date().toISOString()});n++;
        if(lot.length>=200){await envoyer();etat.textContent=n+" / "+contacts.length+"…";}}
        await envoyer();}

      const {data}=await sb.from("docs").select("id,data").eq("collection","crm");crm=(data||[]).map(r=>({id:r.id,...r.data}));

  c.appendChild(an);m.appendChild(c);

/* ---------- base de données (Supabase) ----------

   db.collection(c).onSnapshot / .doc(id).set|update|delete, db.doc("c/id"). */
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:"implicit"}});
function makeDb(){
  const cache={}, listeners={}, loading={};
  const snapOf=c=>({docs:[...(cache[c]||new Map())].map(([id,d])=>({id,exists:true,data:()=>d}))});
  const emit=c=>(listeners[c]||[]).forEach(f=>{try{f(snapOf(c))}catch(e){console.error(e)}});
  const err=e=>({code:e&&(e.code==="42501"||/row-level security/i.test(e.message||""))?"invalid_argument":"unavailable",message:e&&e.message||""});
  async function load(c){
    const {data,error}=await sb.from("docs").select("id,data").eq("collection",c);
    if(error)throw err(error);
    cache[c]=new Map(data.map(r=>[r.id,r.data]));emit(c);
  }
  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.collection)return;
    const c=row.collection;if(!cache[c])return;
    if(p.eventType==="DELETE")cache[c].delete(row.id);else cache[c].set(row.id,row.data);
    emit(c);
  }).subscribe();
  // si le temps réel décroche (veille du téléphone), on recharge au retour
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)Object.keys(listeners).forEach(c=>load(c).catch(()=>{}));});
  const docRef=(c,id)=>({
    async get(){if(!cache[c])await load(c);const d=cache[c].get(id);return {id,exists:!!d,data:()=>d};},
    async set(data){
      let {error}=await sb.from("docs").insert({collection:c,id,data});
      if(error&&error.code==="23505")({error}=await sb.from("docs").update({data,updated_at:new Date().toISOString()}).eq("collection",c).eq("id",id));
      if(error)throw err(error);(cache[c]||(cache[c]=new Map())).set(id,data);emit(c);
    },
    async update(patch){
      const cur=(cache[c]&&cache[c].get(id))||{};const data={...cur,...patch};
      const {error}=await sb.from("docs").update({data,updated_at:new Date().toISOString()}).eq("collection",c).eq("id",id);
      if(error)throw err(error);(cache[c]||(cache[c]=new Map())).set(id,data);emit(c);
    },
    async delete(){
      const {error}=await sb.from("docs").delete().eq("collection",c).eq("id",id);
      if(error)throw err(error);cache[c]&&cache[c].delete(id);emit(c);
    },
    onSnapshot(next,onError){
      const f=s=>{const d=s.docs.find(x=>x.id===id);next(d||{id,exists:false,data:()=>undefined});};
      return collRef(c).onSnapshot(f,onError);
    }
  });
  const collRef=c=>({
    doc:(id)=>docRef(c,id||("x"+uid())),
    onSnapshot(next,onError){
      (listeners[c]||(listeners[c]=[])).push(next);
      if(cache[c])next(snapOf(c));
      else if(!loading[c])loading[c]=load(c).catch(e=>{loading[c]=null;onError&&onError(e);});
      return ()=>{listeners[c]=(listeners[c]||[]).filter(x=>x!==next);};
    }
  });
  return {collection:collRef,doc:p=>{const [c,id]=p.split("/");return docRef(c,id);}};
}

/* ---------- connexion ---------- */
let authState="loading", authMsg="";
function renderAuth(m){
  if(authState==="loading"){m.appendChild(el("div","empty","Connexion…"));return;}
  const c=el("form","card login");
  if(authState==="denied"){
    c.innerHTML=`<h2>Accès non autorisé</h2><p class="muted">L'adresse <b>${esc(myEmail)}</b> n'est pas administrateur.${estMembre?" Vous êtes connecté·e comme membre de la famille : les coordonnées sont visibles dans la Généalogie.":""} Les ventes et les chambres restent accessibles sans connexion depuis le menu.</p>`;
    const b=el("button","btn ghost full","Se connecter avec une autre adresse");b.type="button";b.onclick=logout;c.appendChild(b);
    m.appendChild(c);return;
  }
  c.innerHTML=`<p class="brand-mark">Connexion</p><h2 style="font-size:22px">Espace famille et administration</h2>
    <p class="muted">Connectez-vous avec votre compte Google. Seules les adresses ajoutées par un administrateur ont accès. Les ventes et les chambres restent accessibles sans connexion.</p>
    <button class="btn google full" type="button" id="login-google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Se connecter avec Google</button>
    <details class="autre-methode"><summary>Pas de compte Google ? Recevoir un lien par email</summary>
    <div class="field"><label for="login-email">Adresse email</label><input id="login-email" type="email" autocomplete="email" placeholder="prenom@exemple.fr"></div>
    <button class="btn ghost full" type="submit" id="login-go">Recevoir le lien de connexion</button></details>
    ${authMsg?`<div class="msg ${authMsg.startsWith("✓")?"ok":"err"}">${esc(authMsg.replace(/^✓ /,""))}</div>`:""}`;
  c.querySelector("#login-google").onclick=async()=>{
    const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}});
    if(error){authMsg="Connexion Google impossible : "+error.message;render();}};
  c.onsubmit=async e=>{
    e.preventDefault();
    const email=c.querySelector("#login-email").value.trim().toLowerCase();if(!email)return;
    const btn=c.querySelector("#login-go");btn.disabled=true;
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});
    authMsg=error?(/rate|seconds/i.test(error.message)?"Trop de demandes. Attendez une minute avant de redemander un lien.":"Envoi impossible : "+error.message)
      :"✓ Lien envoyé à "+email+". Ouvrez l'email sur cet appareil et cliquez sur le lien.";
    render();
  };
  m.appendChild(c);
}
async function logout(){await sb.auth.signOut();location.reload();}
document.querySelector("#btn-logout").onclick=logout;

function telecharger({filename,data}){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));
  a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  return Promise.resolve({status:"saved"});
}

/* ---------- démarrage ---------- */
// Ventes et chambres : ouvertes à tous, sans connexion.
// Administration : connexion par lien email, réservée aux adresses « admin » de la table membres.
let clientsAbonne=false;
const arriveeParLien=/access_token|error_description/.test(location.hash);
function majPied(){
  qs("#side-user").textContent=myEmail?"Connecté : "+myEmail:"";
  qs("#btn-logout").hidden=!myEmail;
}
function demarrerDonnees(){
  db=makeDb();downloads={save:telecharger};
  const onErr=e=>{flash(dbMessage(e));};
  db.collection("famille").onSnapshot(s=>{
    famille=s.docs.map(x=>({id:x.id,...x.data()}));
    const premier=!familleChargee;familleChargee=true;
    if(page!=="genealogie")return;
    if(premier||!qs("#fam-svg"))render();else{dessinerArbre();if(!famEdit)ficheFamille();}
  },()=>{familleChargee=true;});
  chargerContenu("genealogie").then(d=>{famResume=d.resume||"";if(page==="genealogie"&&!famEdit)render();}).catch(()=>{});
  db.collection("reglages").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="caisse");reglages=d?d.data():{};},()=>{});
  db.collection("chambres").onSnapshot(s=>{
    chambres=s.docs.map(x=>({id:x.id,...x.data()}));loaded.chambres=true;
    if(page==="chambres")refreshChambres();
  },onErr);
  db.collection("reservations").onSnapshot(s=>{
    resas=s.docs.map(x=>({id:x.id,...x.data()})).filter(r=>r.chambreId&&r.arrivee&&r.depart);
    if(page==="chambres")refreshChambres();
  },onErr);
  db.collection("ventes").onSnapshot(s=>{
    ventes=s.docs.map(x=>({id:x.id,...x.data()}));loaded.ventes=true;
    if(LIVE_PAGES.includes(page))render();
  },onErr);
  db.collection("transactions").onSnapshot(s=>{
    txs=s.docs.map(x=>({id:x.id,...x.data()}));
    if(!loaded.txs)reprendreFacture();
    loaded.txs=true;
    if(LIVE_PAGES.includes(page))render();
    else if(page==="saisie"&&!horsOpen){renderLignes();updateTotal();}
  },onErr);
  render();
}
async function verifierSession(session){
  if(!session){myEmail="";monPrenom="";isOwner=false;estMembre=false;authState="login";majPied();render();return;}
  myEmail=(session.user.email||"").toLowerCase();
  monPrenom=String(session.user.user_metadata?.full_name||session.user.user_metadata?.name||"").trim().split(/\s+/)[0]||"";
  if(monPrenom&&!store.get(VENDEUR_KEY))store.set(VENDEUR_KEY,monPrenom);
  const {data}=await sb.from("membres").select("role").eq("email",myEmail).maybeSingle();
  isOwner=!!data&&data.role==="admin";estMembre=!!data;
  if(estMembre&&!coordsAbonne){coordsAbonne=true;db.collection("coordonnees").onSnapshot(s=>{coords=new Map(s.docs.map(x=>[x.id,x.data()]));if(page==="genealogie"&&!famEdit)ficheFamille();},()=>{});}
  authState=isOwner?"ok":"denied";majPied();
  if(estMembre)abonnerCrm();
  if(estMembre&&!clientsAbonne){
    clientsAbonne=true;
    db.collection("clients").onSnapshot(s=>{
      clients=new Map(s.docs.map(x=>[x.id,x.data()]));
      if(LIVE_PAGES.includes(page))render();
    },()=>{});
  }
  // arrivée par le lien de connexion : ouvrir directement l'administration
  if(arriveeParLien&&page!=="admin"){page="admin";}
  if(location.hash)history.replaceState(null,"",location.pathname);
  render();
}
demarrerDonnees();
sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>verifierSession(session),0);
});
