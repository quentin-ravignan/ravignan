  --ok:#3fcf92; --ok-soft:#12301f; --warn:#e7b04a; --warn-soft:#3a2a10; --bad:#ff7d6e; --bad-soft:#3b1a15;

  const intro=el("div","card soft",`<p style="font-weight:800;color:var(--accent-ink)">Ventes privées</p>
    <p class="muted">Créez une vente, saisissez les transactions sur place et suivez le stock en direct. Tous les vendeurs voient les mêmes chiffres.</p>`);
  m.appendChild(intro);
  if(canWrite){const b=el("button","btn primary full","+ Nouvelle vente");b.onclick=()=>go("new-vente");m.appendChild(b);}
  else m.appendChild(el("div","msg info","Lecture seule : demandez au propriétaire de vous inviter comme Éditeur pour saisir des ventes."));
  if(!loaded.ventes){m.appendChild(el("div","empty","Chargement…"));return;}
  if(ventes.length===0){m.appendChild(el("div","empty","Aucune vente pour l'instant.<br>Créez la première avec le bouton ci-dessus."));return;}
  renderRoadmap(m);
  renderDashboard(m);
  m.appendChild(txt("h2","dash-titre","Toutes les ventes"));
  const list=[...ventes].sort((a,b)=>(a.cloturee-b.cloturee)||(b.dateDebut||"").localeCompare(a.dateDebut||""));
  list.forEach(v=>{
    const t=txsOf(v.id);const ca=t.reduce((s,x)=>s+montant(x),0);
    const c=el("button","card vente",`<div class="row" style="align-items:flex-start">
      <div style="min-width:0"><p style="font-weight:700">${esc(v.nom)}</p>
      <p class="muted">${esc(v.lieu)} · ${esc(periode(v))}</p></div>
      <span class="badge ${statutVente(v)[0]}">${statutVente(v)[1]}</span></div>
      <div class="row muted num" style="justify-content:flex-start;gap:16px"><span>${t.length} transaction${t.length>1?"s":""}</span><span><b style="color:var(--accent-ink)">${fmt(ca)}</b></span></div>`);
    c.onclick=()=>go("vente",v.id);
    m.appendChild(c);
  });
}

/* ---------- tableau de bord de toutes les ventes ---------- */
let dashPeriode="tout";
function renderDashboard(m){
  const maintenant=new Date(),annee=String(maintenant.getFullYear());
  const periodes=[["tout","Tout"],["annee",annee],["30j","30 jours"]];
  const dans=x=>{if(dashPeriode==="tout")return true;const d=x.date?new Date(x.date):null;if(!d)return false;
    return dashPeriode==="annee"?String(d.getFullYear())===annee:maintenant-d<30*864e5;};
  const ids=new Set(ventes.map(v=>v.id));
  const t=txs.filter(x=>ids.has(x.venteId)&&x.statut!=="abandonnee"&&!enAttente(x)&&dans(x));
  const ventesT=t.filter(x=>x.type!=="avoir"&&!estGratuit(x.paiement));
  const ca=t.reduce((s,x)=>s+montant(x),0);
  const btl=t.filter(x=>!estGratuit(x.paiement)).reduce((s,x)=>s+(x.lignes||[]).reduce((a,l)=>a+(l.qte||0),0),0);
  const panier=ventesT.length?ca/ventesT.length:0;
  const c=el("div","card dash");
  const tete=el("div","row dash-tete");tete.appendChild(txt("h2","","📊 Tableau de bord"));
  const ch=el("div","dash-per");periodes.forEach(([k,lab])=>{const b=el("button",dashPeriode===k?"active":"",lab);b.onclick=()=>{dashPeriode=k;render();};ch.appendChild(b);});
  tete.appendChild(ch);c.appendChild(tete);
  if(!t.length){c.appendChild(txt("p","muted","Aucune transaction sur cette période."));m.appendChild(c);return;}
  // chiffres clés
  const clientsMap=new Map();
  ventesT.concat(t.filter(x=>x.type==="avoir")).forEach(x=>{const cl=clientOf(x);
    const k=(cl.email?String(cl.email).toLowerCase():normTxt([cl.prenom,cl.nom||cl.initiale].join(" ")))||x.id;
    const o=clientsMap.get(k)||{nom:nomClient(x),total:0,n:0};o.total+=montant(x);if(x.type!=="avoir")o.n++;clientsMap.set(k,o);});
  const fideles=[...clientsMap.values()].filter(o=>o.n>1).length;
  const k=el("div","dash-kpis");
  [[fmt(ca),"Chiffre d'affaires"],[String(ventesT.length),"Achats"],[String(btl),"Bouteilles"],[fmt(panier),"Panier moyen"],[String(clientsMap.size),"Clients"],[clientsMap.size?Math.round(fideles/clientsMap.size*100)+" %":"–","Clients revenus"]]
    .forEach(([val,lab])=>k.appendChild(el("div","kpi",`<div class="val num">${val}</div><div class="lab">${lab}</div>`)));
  c.appendChild(k);
  // classements en barres
  const barres=(titre,lignes,format,vide,avec)=>{const b=el("div","dash-bloc");b.appendChild(txt("h3","sub",titre));
    if(!lignes.length){b.appendChild(txt("p","muted",vide||"–"));return b;}
    const max=Math.max(...lignes.map(l=>l[1]),1);
    lignes.forEach(([nom,val,detail],i)=>{const r=el("div","dash-ligne");
      r.innerHTML=`<span class="dash-rang">${i<3?["🥇","🥈","🥉"][i]:i+1}</span><span class="dash-nom" title="${esc(nom)}">${avec?avatar(nom,"mini"):""}${esc(nom)}${detail?` <small class="muted">${esc(detail)}</small>`:""}</span><b class="num">${format(val)}</b><span class="dash-barre"><i style="width:${Math.max(2,val/max*100).toFixed(1)}%"></i></span>`;
      b.appendChild(r);});
    return b;};
  const parV={};t.forEach(x=>{const n=(x.vendeurPrenom||"").trim();if(n&&x.source!=="site"&&!estGratuit(x.paiement))parV[n]=(parV[n]||0)+montant(x);});
  const parP={};t.filter(x=>!estGratuit(x.paiement)).forEach(x=>(x.lignes||[]).forEach(l=>{const n=[l.nom,l.format].filter(Boolean).join(" ");parP[n]=(parP[n]||0)+(l.qte||0);}));
  const parVente={};t.forEach(x=>{parVente[x.venteId]=(parVente[x.venteId]||0)+montant(x);});
  const top=(o,n=5)=>Object.entries(o).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const g=el("div","dash-grille");
  g.appendChild(barres("Meilleurs vendeurs",top(parV),fmt,"",true));
  g.appendChild(barres("Meilleurs clients",[...clientsMap.values()].filter(o=>o.total>0).sort((a,b)=>b.total-a.total).slice(0,5).map(o=>[o.nom,o.total,o.n>1?o.n+" achats":""]),fmt));
  g.appendChild(barres("Produits les plus vendus",top(parP),v=>v+" btl"));
  g.appendChild(barres("Meilleures ventes",top(parVente).map(([id,v])=>[(ventes.find(w=>w.id===id)||{}).nom||"Vente",v]),fmt));
  c.appendChild(g);
  // moyens de paiement
  const pm=PMTS.map(([p,lab])=>[lab,t.filter(x=>x.paiement===p).reduce((s,x)=>s+montant(x),0)]).filter(x=>x[1]>0);
  const totPm=pm.reduce((s,x)=>s+x[1],0);
  if(totPm>0){const b=el("div","dash-bloc");b.appendChild(txt("h3","sub","Moyens de paiement"));
    const barre=el("div","dash-pile");const couleurs=["var(--accent)","#b0826f","#d9bfb4","#8a6a5f","#ead9d2"];
    pm.forEach(([lab,v],i)=>{const sg=el("i");sg.style.cssText=`width:${(v/totPm*100).toFixed(1)}%;background:${couleurs[i%couleurs.length]}`;sg.title=lab+" : "+fmt(v);barre.appendChild(sg);});
    b.appendChild(barre);
    const leg=el("div","dash-leg");pm.forEach(([lab,v],i)=>leg.appendChild(el("span","",`<i style="background:${couleurs[i%couleurs.length]}"></i>${esc(lab)} <b class="num">${Math.round(v/totPm*100)} %</b>`)));
    b.appendChild(leg);c.appendChild(b);}
  // les commandes du site sont désormais la vente permanente « Site web » (synchro Stripe + import de l'export)
  m.appendChild(c);
}
// boutique en ligne Squarespace (administrateurs) : commandes synchronisées par la fonction « squarespace-sync »
let commandesEnLigne=[],sqSync={},sqAbonne=false;
function abonnerSquarespace(){
  if(sqAbonne)return;sqAbonne=true;
  db.collection("squarespace").onSnapshot(s=>{commandesEnLigne=s.docs.map(x=>({id:x.id,...x.data()}));if(page==="home")render();},()=>{});
}
async function synchroSquarespace(b){
  b.disabled=true;b.textContent="Synchronisation…";
  const {data,error}=await sb.functions.invoke("squarespace-sync",{body:{}});
  let msg=data&&data.erreur;if(error){try{msg=(await error.context.json()).erreur;}catch(e){}}
  if(error||!data||!data.ok)flash(msg||"La synchronisation a échoué.");
  else flash(data.deja?"Synchronisation déjà en cours.":`Boutique synchronisée : ${data.n} commande${data.n>1?"s":""} mise${data.n>1?"s":""} à jour.`,"ok");
  render();
}
function blocBoutique(dans){
  const b=el("div","dash-bloc dash-boutique");
  const tete=el("div","row");tete.appendChild(txt("h3","sub","🛒 Boutique en ligne (Squarespace)"));
  const sy=el("button","link","🔄 Synchroniser");sy.onclick=()=>synchroSquarespace(sy);tete.appendChild(sy);b.appendChild(tete);
  if(sqSync.erreur&&!commandesEnLigne.length){b.appendChild(txt("p","msg err",sqSync.erreur));return b;}
  if(!commandesEnLigne.length){b.appendChild(txt("p","muted","Aucune commande synchronisée pour l'instant. La synchronisation se fait toutes les heures, ou avec le bouton ci-dessus."));return b;}
  const cmd=commandesEnLigne.filter(o=>o.statut!=="CANCELED"&&dans(o));
  const net=o=>(o.total||0)-(o.rembourse||0);
  const ca=cmd.reduce((s,o)=>s+net(o),0),btl=cmd.reduce((s,o)=>s+(o.lignes||[]).reduce((a,l)=>a+(l.qte||0),0),0);
  const k=el("div","dash-kpis");
  [[fmt(ca),"CA en ligne"],[String(cmd.length),"Commandes"],[fmt(cmd.length?ca/cmd.length:0),"Panier moyen"]].forEach(([val,lab])=>k.appendChild(el("div","kpi",`<div class="val num">${val}</div><div class="lab">${lab}</div>`)));
  b.appendChild(k);
  const enCours=cmd.filter(o=>o.statut==="PENDING");
  if(enCours.length)b.appendChild(txt("p","attente-note",`📦 ${enCours.length} commande${enCours.length>1?"s":""} à expédier`));
  const g=el("div","dash-grille");
  const parP={};cmd.forEach(o=>(o.lignes||[]).forEach(l=>{const n=[l.nom,l.variante].filter(Boolean).join(" · ");parP[n]=(parP[n]||0)+(l.qte||0);}));
  const liste=(titre,lignes,format)=>{const d=el("div","dash-bloc");d.appendChild(txt("h3","sub",titre));const max=Math.max(...lignes.map(l=>l[1]),1);
    lignes.forEach(([nom,val,det],i)=>{const r=el("div","dash-ligne");r.innerHTML=`<span class="dash-rang">${i<3?["🥇","🥈","🥉"][i]:i+1}</span><span class="dash-nom" title="${esc(nom)}">${esc(nom)}${det?` <small class="muted">${esc(det)}</small>`:""}</span><b class="num">${format(val)}</b><span class="dash-barre"><i style="width:${Math.max(2,val/max*100).toFixed(1)}%"></i></span>`;d.appendChild(r);});
    if(!lignes.length)d.appendChild(txt("p","muted","–"));return d;};
  g.appendChild(liste("Produits les plus vendus en ligne",Object.entries(parP).sort((a,b)=>b[1]-a[1]).slice(0,5),v=>v+" btl"));
  const parC=new Map();cmd.forEach(o=>{const cl=o.client||{};const k2=cl.email||o.id;const x=parC.get(k2)||{nom:[cl.prenom,cl.nom].filter(Boolean).join(" ")||cl.email||"Client",total:0,n:0};x.total+=net(o);x.n++;parC.set(k2,x);});
  g.appendChild(liste("Meilleurs clients en ligne",[...parC.values()].sort((a,b)=>b.total-a.total).slice(0,5).map(x=>[x.nom,x.total,x.n>1?x.n+" commandes":""]),fmt));
  b.appendChild(g);
  // dernières commandes
  const der=el("div","dash-bloc");der.appendChild(txt("h3","sub","Dernières commandes"));
  [...commandesEnLigne].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,6).forEach(o=>{const cl=o.client||{};
    const st=o.statut==="CANCELED"?"Annulée":o.statut==="FULFILLED"?"Expédiée":"À expédier";
    der.appendChild(el("div","tx-line num",`<span>n° ${esc(o.numero)} · ${esc([cl.prenom,cl.nom].filter(Boolean).join(" ")||cl.email||"")}<small class="muted"> · ${o.date?new Date(o.date).toLocaleDateString("fr-FR"):""} · ${st}</small></span><span></span><b>${fmt(net(o))}</b>`));});
  b.appendChild(der);
  if(sqSync.dernier)b.appendChild(txt("p","muted",`Dernière synchronisation : ${new Date(sqSync.dernier).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}${sqSync.erreur?" · ⚠️ "+sqSync.erreur:""}`));
  return b;
}

// photos des vendeurs : photo du compte Google (enregistrée à la connexion) ou choisie par un administrateur
let photosVendeurs=new Map();
async function chargerPhotos(){
  const {data}=await sb.rpc("photos_vendeurs");
  if(Array.isArray(data)){photosVendeurs=new Map(data.map(x=>[x.nom,x.photo]));if(["home","vente","new-vente","admin"].includes(page))render();}
}
function photoDe(nom){
  if(!nom)return null;if(photosVendeurs.has(nom))return photosVendeurs.get(nom);
  // vendeur saisi au prénom seul : la photo si un seul membre porte ce prénom
  const p=normTxt(nom).split(" ")[0];const t=[...photosVendeurs].filter(([n])=>normTxt(n).split(" ")[0]===p);
  return t.length===1?t[0][1]:null;
}
function avatar(nom,cls){
  const u=photoDe(nom),ini=esc(String(nom||"?").trim().charAt(0).toUpperCase()||"?");
  return u?`<img class="avatar ${cls||""}" src="${esc(u)}" alt="" referrerpolicy="no-referrer" loading="lazy" data-ini="${ini}" onerror="avatarKo(this)">`:`<span class="avatar ini ${cls||""}" aria-hidden="true">${ini}</span>`;
}
function avatarKo(img){const s=document.createElement("span");s.className=img.className+" ini";s.textContent=img.dataset.ini||"?";img.replaceWith(s);}
async function envoyerPhotoVendeur(fichier,email){
  if(!String(fichier.type).startsWith("image/"))throw new Error("ce fichier n'est pas une image");
  const bmp=await createImageBitmap(fichier);
  const c=Math.min(bmp.width,bmp.height),t=Math.min(320,c);
  const cv=document.createElement("canvas");cv.width=t;cv.height=t;
  cv.getContext("2d").drawImage(bmp,(bmp.width-c)/2,(bmp.height-c)/2,c,c,0,0,t,t);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  const chemin=email.replace(/[^a-z0-9]/gi,"-")+"-"+Date.now()+".jpg";
  const {error}=await sb.storage.from("vendeurs").upload(chemin,blob,{contentType:"image/jpeg",upsert:false});
  if(error)throw error;
  return sb.storage.from("vendeurs").getPublicUrl(chemin).data.publicUrl;
}

/* ---------- fenêtre de confirmation (clôtures, suppressions) ----------
   confirmer({titre, texte, bouton, danger, saisie}) → Promise<boolean>.
   saisie : mot à recopier pour valider (suppressions lourdes). Le bouton reste inactif 1 seconde, pour ne pas valider par réflexe. */
function confirmer({titre,texte,bouton="Confirmer",danger=true,saisie=""}){
  return new Promise(ok=>{
    qs("#confirm-modal")?.remove();
    const m=el("div","modal");m.id="confirm-modal";m.setAttribute("role","alertdialog");m.setAttribute("aria-modal","true");
    const sh=el("div","sheet");m.appendChild(sh);
    sh.appendChild(txt("h2","sheet-title",titre));
    if(texte)sh.appendChild(el("div","confirm-texte",texte));
    let champ=null;
    if(saisie){const f=el("div","field");f.appendChild(Object.assign(txt("label","",`Pour confirmer, tapez « ${saisie} »`),{htmlFor:"confirm-saisie"}));
      champ=el("input");champ.id="confirm-saisie";champ.autocomplete="off";f.appendChild(champ);sh.appendChild(f);}
    const oui=el("button","btn "+(danger?"danger":"primary")+" full",bouton);oui.disabled=true;
    const non=el("button","btn ghost full","Annuler");
    const fin=v=>{m.remove();document.removeEventListener("keydown",esc2);ok(v);};
    const esc2=e=>{if(e.key==="Escape")fin(false);};document.addEventListener("keydown",esc2);
    const pret=()=>{oui.disabled=!(Date.now()-t0>=1000&&(!champ||normTxt(champ.value.trim())===normTxt(saisie)));};
    const t0=Date.now();setTimeout(pret,1000);if(champ)champ.oninput=pret;
    oui.onclick=()=>{if(!oui.disabled)fin(true);};non.onclick=()=>fin(false);m.onclick=e=>{if(e.target===m)fin(false);};
    sh.appendChild(oui);sh.appendChild(non);document.body.appendChild(m);
    setTimeout(()=>(champ||non).focus(),50);
  });
}
async function demanderCloture(v){
  const t=txsOf(v.id),att=t.filter(enAttente),nonEnv=t.filter(x=>facturable(x)&&!(x.facture_envois||[]).length);
  const ca=t.reduce((s,x)=>s+montant(x),0);
  const ok=await confirmer({titre:`Clôturer « ${v.nom} » ?`,bouton:"Clôturer la vente",
    texte:`<p>${t.length} transaction${t.length>1?"s":""} · <b class="num">${fmt(ca)}</b></p>`
      +(att.length?`<p class="msg err">⏳ ${att.length} paiement${att.length>1?"s":""} par carte encore en attente.</p>`:"")
      +(nonEnv.length?`<p class="msg err">📧 ${nonEnv.length} facture${nonEnv.length>1?"s":""} pas encore envoyée${nonEnv.length>1?"s":""}.</p>`:"")
      +`<p class="muted">Une fois clôturée, plus aucune transaction ne pourra être saisie dans cette vente.</p>`});
  if(ok)cloturer(v.id);
}
async function demanderSuppressionVente(v){
  const t=txsOf(v.id);
  const ok=await confirmer({titre:`Supprimer « ${v.nom} » ?`,bouton:"Supprimer définitivement",saisie:t.length?"SUPPRIMER":"",
    texte:t.length?`<p class="msg err">Ses ${t.length} transaction${t.length>1?"s":""} et les coordonnées clients associées seront effacées. C'est définitif.</p>`:`<p class="muted">La vente ne contient aucune transaction. C'est définitif.</p>`});
  if(ok)supprimerVente(v.id);
}

// sons générés par le navigateur (aucun fichier) ; le contexte audio s'ouvre au clic, sinon le téléphone le bloque
let audioCtx=null;
function ouvrirAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();}catch(e){}}
function sonCaisse(){
  const a=audioCtx;if(!a)return;const t=a.currentTime;
  // tiroir : bruit bref et grave
  const n=a.createBuffer(1,a.sampleRate*0.18,a.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const src=a.createBufferSource();src.buffer=n;const lp=a.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;
  const gn=a.createGain();gn.gain.value=0.5;src.connect(lp).connect(gn).connect(a.destination);src.start(t);
  // « ching » : deux clochettes aiguës
  [[2093,0.12],[2637,0.2]].forEach(([fq,dt])=>{[1,2.76].forEach((h,k)=>{const o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=fq*h;
    g.gain.setValueAtTime(0.0001,t+dt);g.gain.exponentialRampToValueAtTime(k?0.06:0.25,t+dt+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dt+0.9);
    o.connect(g).connect(a.destination);o.start(t+dt);o.stop(t+dt+1);});});
}
function direYippee(){
  try{
    const u=new SpeechSynthesisUtterance("Yippee-ki-yay!");u.lang="en-US";u.rate=0.85;u.pitch=0.7;u.volume=1;
    const voix=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
    u.voice=voix.find(x=>/male|david|daniel|fred|alex|guy/i.test(x.name)&&!/female/i.test(x.name))||voix[0]||null;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
// son de création de vente : fichier fourni par l'utilisateur ; le lecteur est « débloqué » au clic (exigence des téléphones)
// on ne joue que la phrase, de 1 s à 3,9 s du fichier (décodé une fois, puis joué par le contexte audio)
const SON_VENTE={fichier:"sons/yippee.mp3",debut:1,fin:3.9};

  ouvrirAudio();

async function jouerSonVente(){

}

const MOIS_COURTS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

    const tx={venteId:"site-web",source:"site",date,total:Math.round((brut-rembourse)*100)/100,paiement:/paypal/i.test(h["Payment Method"])?"PayPal":"CB",
      vendeurPrenom:"Domaine de Ravignan",statut:rembourse>=brut&&brut>0?"annulee":"payee",lignes:lignesCmd,commande:num,
      port:nombre(h["Shipping"]),remiseCode:h["Discount Code"]||"",remiseMontant:nombre(h["Discount Amount"]),rembourse};
    const nomC=(h["Billing Name"]||h["Shipping Name"]||"").trim().split(/\s+/);

      cp:h["Billing Zip"]||h["Shipping Zip"]||"",ville:h["Billing City"]||h["Shipping City"]||"",pays:h["Billing Country"]||h["Shipping Country"]||"",source:"Site web"};
    lot.push({collection:"transactions",id,data:tx,updated_at:maj},{collection:"clients",id,data:cl,updated_at:maj});n++;
  }
  // la vente permanente (créée si besoin), datée de la première commande
  const v=ventes.find(x=>x.id==="site-web");

  lot.unshift({collection:"ventes",id:"site-web",data:dv,updated_at:maj});

  return n;
}

// email de remerciement envoyé à tous les clients 7 jours après la fin de la vente (fonction « remerciements », tous les matins)
function renderRemerciements(m,v,t){
  if(!t.some(x=>x.type!=="avoir"&&!estGratuit(x.paiement)))return;
  const r=v.remerciements,fin=v.dateFin||v.dateDebut;
  const prevu=fin?new Date(fin+"T12:00:00"):null;if(prevu)prevu.setDate(prevu.getDate()+7);
  const trop=prevu&&Date.now()-prevu.getTime()>6*864e5;
  const p=el("div","merci-etat");
  if(r)p.appendChild(txt("span","",r.etat==="envoi"?"💌 Remerciements en cours d'envoi…":`💌 Remerciements envoyés le ${new Date(r.date).toLocaleDateString("fr-FR")} à ${r.n} client${r.n>1?"s":""}${r.echecs?` (${r.echecs} échec${r.echecs>1?"s":""})`:""}.`));
  else{
    p.appendChild(txt("span","",trop?"💌 Remerciements non envoyés (vente terminée depuis plus de deux semaines).":`💌 Email de remerciement automatique le ${prevu?prevu.toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"?"} à tous les clients, avec l'invitation à laisser un avis Google.`));
    const b=el("button","link","Envoyer maintenant");
    b.onclick=async()=>{if(!await confirmer({titre:"Envoyer les remerciements ?",texte:`<p>À tous les clients de « ${esc(v.nom)} ». Il ne part qu'une fois.</p>`,bouton:"Envoyer maintenant",danger:false}))return;
      b.disabled=true;b.textContent="Envoi…";
      const {data,error}=await sb.functions.invoke("remerciements",{body:{vente:v.id}});
      let msg=data&&data.erreur;if(error){try{msg=(await error.context.json()).erreur;}catch(e){}}
      if(error||!data||!data.ok){b.disabled=false;b.textContent="Envoyer maintenant";return flash(msg||"L'envoi a échoué.");}
      const res=(data.ventes||[])[0]||{n:0};v.remerciements={date:new Date().toISOString(),n:res.n,echecs:res.echecs||0};
      flash(`Remerciements envoyés à ${res.n} client${res.n>1?"s":""}.`,"ok");render();};
    p.appendChild(b);
  }
  m.appendChild(p);
}

// Annulation d'une transaction (administrateurs) : une transaction négative qui remet le stock,
// avec un avoir numéroté « AV-année-mois-jour-numéro » qui renvoie à la facture d'origine.
// bouteilles d'une ligne déjà reprises par des avoirs précédents
const avoirsDe=x=>txs.filter(t=>t.type==="avoir"&&t.annule===x.id);
const dejaRepris=(x,i)=>avoirsDe(x).reduce((s,a)=>s+(a.lignes||[]).filter(l=>l.idx===i).reduce((q,l)=>q-l.qte,0),0);
function confirmerAnnulation(x){
  qs("#annul-modal")?.remove();
  const gratuit=estGratuit(x.paiement);
  const lignes=(x.lignes||[]).map((l,i)=>({l,i,reste:l.qte-dejaRepris(x,i)})).filter(o=>o.reste>0);
  const garde=lignes.map(o=>o.reste); // tout est coché au départ : décocher = ne plus vendre
  const m=el("div","modal");m.id="annul-modal";
  const sh=el("div","sheet",`<h2 class="sheet-title">Annuler tout ou partie ?</h2>
    <p>${esc(nomClient(x))} · <b class="num">${fmt(x.total)}</b> · ${esc(x.paiement)}${x.facture?" · "+esc(x.facture):""}</p>
    <p class="muted">Décochez les bouteilles que le client ne garde pas. Elles reviennent dans le stock${gratuit?".":" et un avoir est établi sur la facture d'origine."}</p>`);
  const liste=el("div","annul-liste");sh.appendChild(liste);
  const recap=el("div","annul-total");sh.appendChild(recap);
  const ok=el("button","btn danger full");
  const maj=()=>{
    const rendu=lignes.reduce((s,o,k)=>s+(o.reste-garde[k]),0);
    const montant=lignes.reduce((s,o,k)=>s+(o.reste-garde[k])*o.l.prix,0);
    recap.innerHTML=`<span>${rendu} bouteille${rendu>1?"s":""} reprise${rendu>1?"s":""}</span><b class="num">${gratuit?"":"Avoir : "+fmt(-montant)}</b>`;
    ok.textContent=!rendu?"Décochez au moins une bouteille":gratuit?"Remettre en stock":"Valider et éditer l'avoir de "+fmt(montant);
    ok.disabled=!rendu;
  };
  lignes.forEach((o,k)=>{
    const r=el("label","annul-ligne");
    const cb=el("input");cb.type="checkbox";cb.checked=true;
    const nom=el("span","annul-nom",`${esc(o.l.nom)} ${esc(o.l.format||"")}<small class="muted num">${o.reste} × ${fmt(o.l.prix)}</small>`);
    r.appendChild(cb);r.appendChild(nom);
    let q=null;
    if(o.reste>1){
      // plusieurs bouteilles sur la ligne : on peut n'en reprendre qu'une partie
      q=el("input","annul-qte");q.type="number";q.min="0";q.max=String(o.reste);q.value=String(o.reste);q.inputMode="numeric";
      q.setAttribute("aria-label","Bouteilles gardées : "+o.l.nom);
      q.oninput=()=>{garde[k]=Math.max(0,Math.min(o.reste,Math.round(+q.value||0)));cb.checked=garde[k]>0;maj();};
      q.onblur=()=>{q.value=String(garde[k]);};
      const g=el("span","annul-garde");g.appendChild(txt("small","muted","gardées"));g.appendChild(q);r.appendChild(g);
    }
    cb.onchange=()=>{garde[k]=cb.checked?o.reste:0;if(q)q.value=String(garde[k]);r.classList.toggle("off",!cb.checked);maj();};
    q&&q.addEventListener("input",()=>r.classList.toggle("off",!garde[k]));
    liste.appendChild(r);
  });
  maj();
  ok.onclick=async()=>{ok.disabled=true;const rendus=lignes.map((o,k)=>({...o,qte:o.reste-garde[k]})).filter(o=>o.qte>0);await annulerTransaction(x,rendus);m.remove();};
  const no=el("button","btn ghost full","Ne rien faire");no.onclick=()=>m.remove();
  sh.appendChild(ok);sh.appendChild(no);m.appendChild(sh);m.onclick=e=>{if(e.target===m)m.remove();};document.body.appendChild(m);
}
// rendus : [{l, i, qte}] — les bouteilles reprises, ligne par ligne
async function annulerTransaction(x,rendus){
  if(!isAdmin())return flash("Réservé aux administrateurs.");
  if(busy||!rendus.length)return;busy=true;
  try{
    const gratuit=estGratuit(x.paiement);
    // la facture d'origine doit avoir son numéro pour que l'avoir y renvoie
    let numOrig=x.facture;
    if(!gratuit&&!numOrig){const {data,error}=await sb.rpc("numero_facture",{tx:x.id});if(error)throw error;numOrig=data;}
    const id="t"+uid();
    const lignes=rendus.map(o=>({...o.l,idx:o.i,qte:-o.qte}));
    // la transaction est entièrement annulée quand plus aucune bouteille ne reste vendue
    const total=(x.lignes||[]).reduce((s,l,i)=>s+l.qte-dejaRepris(x,i),0)===rendus.reduce((s,o)=>s+o.qte,0);
    const av={venteId:x.venteId,client:x.client,type:"avoir",annule:x.id,factureOrigine:numOrig||null,partiel:!total,...(x.remise?{remise:x.remise}:{}),
      lignes,paiement:x.paiement,total:lignes.reduce((s,l)=>s+l.qte*l.prix,0),
      vendeurPrenom:monPrenom||myEmail,date:new Date().toISOString()};
    await db.collection("transactions").doc(id).set(av);
    const avoirs=[...(x.avoirs||[]),id];
    await db.collection("transactions").doc(x.id).update(total?{avoirs,annuleePar:id}:{avoirs});
    const cl=clients.get(x.id);if(cl){try{await db.collection("clients").doc(id).set({...cl,date:av.date});}catch(e){}}
    if(!txs.find(t=>t.id===id))txs.push({id,...av});x.avoirs=avoirs;if(total)x.annuleePar=id;
    busy=false;render();flash((total?"Transaction annulée":"Annulation partielle enregistrée")+(gratuit?".":" : l'avoir est prêt."),"ok");
    if(!gratuit)envoyerFactureAuto(id);
  }catch(e){busy=false;console.error(e);flash(dbMessage(e));}
}

// journal des mouvements de stock : produits ajoutés, réassorts et corrections, du plus récent au plus ancien

    (r.corrections||[]).forEach(x=>ev.push({date:x.date,par:x.par,ico:"✏️",txt:`Stock modifié ${p}`,val:`${x.avant||"sans limite"} → ${x.apres}`}));

async function corrigerStock(v,refId,restant){
  if(!(restant>=0)||busy)return flash("Indiquez le nombre restant.");
  const r0=v.refs.find(r=>r.id===refId);if(!r0)return;
  const stock=venduDe(v.id,refId)+degusteDe(r0)+restant;
  // un stock à 0 voudrait dire « sans limite »
  if(stock<=0)return flash("Rien n'a été vendu : un stock à 0 rendrait ce produit sans limite. Retirez plutôt le produit, ou indiquez au moins 1.");
  busy=true;
  try{
    const refs=v.refs.map(r=>r.id!==refId?r:{...r,stock,corrections:[...(r.corrections||[]),{avant:r.stock||0,apres:stock,date:new Date().toISOString(),par:monPrenom||store.get(VENDEUR_KEY)||""}]});
    await db.collection("ventes").doc(v.id).update({refs});v.refs=refs;flash(`Stock corrigé : ${restant} restant${restant>1?"s":""}.`,"ok");
  }catch(e){flash(dbMessage(e));}
  finally{busy=false;render();}
}

const retourSumUp=(()=>{
  const p=new URLSearchParams(location.search+"&"+location.hash.replace(/^#[^?&]*[?&]?/,""));
  if(!p.get("smp-status"))return null;
  history.replaceState(null,"",location.pathname);
  return {id:p.get("foreign-tx-id")||"",ok:p.get("smp-status")==="success",code:p.get("smp-tx-code")||"",msg:p.get("smp-message")||""};
})();
async function traiterRetourSumUp(){

// statut d'une chambre : sur le séjour choisi, sinon pour la nuit de ce soir
function statut(c){
  if(c.type!=="chambre")return null;
  const [du,au]=sejourOk()?[sejour.du,sejour.au]:[today(),addDays(today(),1)];
  const r=resasDe(c.id).filter(x=>overlap(du,au,x.arrivee,x.depart));
  return r.length?{libre:false,qui:r.map(x=>x.nom).join(", ")}:{libre:true};
}

/* plan du château : photo aérienne (1500×842) et repères par étage et par côté */
const PLAN_W=1500, PLAN_H=842, CROP={x:410,y:330,w:450,h:290}; // cadrage sur le château
const LNG_EST=-0.28312, LNG_OUEST=-0.28356; // côté Balançoire (avant gauche) → côté Cuisine (arrière droite)
const LNG_COTE={Balançoire:-0.28320,Milieu:-0.28339,Cuisine:-0.28352};
const Y_ETAGE={1:505,2:474,3:446};
function posDefaut(c){
  let lng=null;const g=(c.gps||"").split(",").map(Number);
  if(g.length===2&&!isNaN(g[1])&&g[1]<0)lng=g[1];
  if(lng==null)lng=LNG_COTE[c.aile]??LNG_COTE.Milieu;
  const t=Math.min(1,Math.max(0,(lng-LNG_EST)/(LNG_OUEST-LNG_EST)));
  const x=470+t*330, y=(Y_ETAGE[c.etage]||505)-0.15*(x-470);
  return {px:(x-CROP.x)/CROP.w*100,py:(y-CROP.y)/CROP.h*100};
}
function renderPlan(z){
  const rooms=chambres.filter(c=>c.type==="chambre").sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  // bascule Photo ↔ 3D
  const seg=el("div","seg");seg.setAttribute("role","group");seg.setAttribute("aria-label","Affichage du plan");
  [["photo","Photo"],["3d","3D"]].forEach(([k,lab])=>{
    const b=el("button",planMode===k?"active":"",lab);b.setAttribute("aria-pressed",String(planMode===k));
    b.onclick=()=>{if(planMode===k)return;planMode=k;adjustPins=false;try{localStorage.setItem("planVue",k);}catch(e){}refreshChambres();};
    seg.appendChild(b);
  });
  z.appendChild(seg);
  const pos=rooms.map(c=>({c,...(typeof c.px==="number"&&typeof c.py==="number"?{px:c.px,py:c.py}:posDefaut(c))}));
  // écarte les repères superposés quand la position vient du calcul
  pos.forEach((p,i)=>{let k=0;while(pos.slice(0,i).some(o=>Math.abs(o.px-p.px)<4.5&&Math.abs(o.py-p.py)<6)&&k<8){p.px+=4.6;k++;}});
  if(planMode==="3d")renderPlan3D(z,pos);
  else{
    const wrap=el("div","plan"+(adjustPins?" adjust":""));
    wrap.style.aspectRatio=CROP.w+"/"+CROP.h;
    const img=el("img","plan-img");img.src="chateau.webp";img.alt="Vue aérienne du château de Ravignan";

function dragPin(pin,wrap,c){

      let vis=v3.z<1&&Math.abs(v3.x)<1.05&&Math.abs(v3.y)<1.05&&(!o.n||tmp.copy(cam).sub(o.p).dot(o.n)>0);
      if(vis){const d=tmp.copy(o.p).sub(cam).length();ray.set(cam,tmp.normalize());ray.far=d-.8;vis=!ray.intersectObjects(caches,false).length;}
      o.el.classList.toggle("hid",!vis);
      if(vis){o.el.style.left=((v3.x+1)/2*w).toFixed(1)+"px";o.el.style.top=((1-v3.y)/2*h).toFixed(1)+"px";}
    });
  }
  function boucle(){
    if(!renderer.domElement.isConnected){vue.tourne=false;return;}
    const w=box.clientWidth,h=box.clientHeight;
    if(w&&h&&(w!==lw||h!==lh)){lw=w;lh=h;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(!cadre){cadre=true;recentrer();}sale=true;}
    if(controls.update()||sale){renderer.render(scene,camera);placer();sale=false;}
    requestAnimationFrame(boucle);
  }
  const vue={tourne:false,camera,controls,
    attacher(b,pos){
      box=b;lw=lh=0;sale=true;
      b.appendChild(renderer.domElement);layer.innerHTML="";b.appendChild(layer);pts.length=0;
      etiquettes.forEach(([t,p])=>{const d=el("span","p3-lab");d.textContent=t;layer.appendChild(d);pts.push({el:d,p:new T.Vector3(...p)});});
      pos.forEach((p,i)=>{
        const s=statut(p.c),r=repere3D(p);
        const pin=el("button","pin "+(s.libre?"free":"busy"),String(i+1));pin.style.pointerEvents="auto";
        pin.title=p.c.nom+(s.libre?" · libre":" · "+s.qui);
        pin.setAttribute("aria-label",p.c.nom+(s.libre?", libre":", réservée"));
        pin.onclick=()=>openRoom(p.c.id);
        layer.appendChild(pin);pts.push({el:pin,p:new T.Vector3(...r.p),n:new T.Vector3(...r.n)});
      });
      const rb=el("button","p3-reset","Recentrer");rb.onclick=()=>{recentrer();sale=true;};b.appendChild(rb);
      if(!vue.tourne){vue.tourne=true;requestAnimationFrame(boucle);}
    }};
  return vue;
}

}

  sh.appendChild(meta);
  if(c.gps&&/^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(c.gps)){
    const a=el("a","map-link","Voir sur la carte ↗");a.href="https://www.google.com/maps?q="+encodeURIComponent(c.gps.replace(/\s+/g,""));a.target="_blank";a.rel="noopener";sh.appendChild(a);

  const rs=resasDe(c.id).filter(r=>r.depart>addDays(today(),-1));

  rs.forEach(r=>{

    const t=el("div");t.style.minWidth="0";
    const n=el("p");n.style.fontWeight="700";n.textContent=r.nom;t.appendChild(n);

      {const d=el("button","link","Annuler");d.onclick=async()=>{if(await confirmer({titre:"Annuler cette réservation ?",texte:`<p>${esc(r.nom||"Réservation")+" · "+frCourt(r.arrivee)+" → "+frCourt(r.depart)}</p><p class="muted">Elle sera supprimée du planning. C'est définitif.</p>`,bouton:"Annuler la réservation"}))supprimerResa(r.id);};row.appendChild(d);}
    }
    box.appendChild(row);
  });
  sh.appendChild(box);
  if(!canWrite)return;
  const form=el("form","card soft",`<h3 class="sheet-sub">Réserver cette chambre</h3>
    <div class="field"><label for="rs-nom">Pour qui ?</label><input id="rs-nom" required autocomplete="off" placeholder="ex : Tom & Jo"></div>
    <div class="grid2"><div class="field"><label for="rs-du">Arrivée</label><input id="rs-du" type="date" required></div>

    <p class="muted" id="rs-info"></p>
    <button class="btn primary full" type="submit" id="rs-ok">Réserver</button>`);
  form.style.padding="14px";

  form.querySelector("#rs-du").onchange=e=>{const b=form.querySelector("#rs-au");if(e.target.value&&b.value<=e.target.value)b.value=addDays(e.target.value,1);info();};
  form.querySelector("#rs-au").onchange=info;

async function reserver(c,form){
  if(busy)return;
  const nom=form.querySelector("#rs-nom").value.trim(),a=form.querySelector("#rs-du").value,b=form.querySelector("#rs-au").value,note=form.querySelector("#rs-note").value.trim();
  if(!nom)return flash("Indiquez pour qui est la réservation.");
  if(!(a&&b&&a<b))return flash("Le départ doit être après l'arrivée.");
  const conf=resasDe(c.id).filter(r=>overlap(a,b,r.arrivee,r.depart));
  if(conf.length)return flash(`${c.nom} est déjà réservée sur ces dates (${conf.map(r=>r.nom).join(", ")}).`);
  busy=true;form.querySelector("#rs-ok").disabled=true;
  try{
    await db.collection("reservations").doc("r"+uid()).set({chambreId:c.id,nom,arrivee:a,depart:b,note,createdAt:new Date().toISOString()});
    roomForm={nom:"",arrivee:b,depart:addDays(b,1),note:""};
    const f=qs("#modal .sheet #rs-nom");if(f)f.remove();
    flash(`${c.nom} réservée pour ${nom}, du ${frCourt(a)} au ${frCourt(b)}`,"ok");
  }catch(err){flash(dbMessage(err));}
  finally{busy=false;renderRoomModal();}
}
async function supprimerResa(id){
  if(busy)return;busy=true;
  try{await db.collection("reservations").doc(id).delete();confirmResa=null;flash("Réservation annulée.","ok");}
  catch(err){flash(dbMessage(err));}
  finally{busy=false;renderRoomModal();}
}

/* graphiques SVG simples (un seul axe, survol avec infobulle) */
function graphLigne({titre,series,ux,uy,points}){
  const W=640,H=280,L=48,R=16,T=16,B=36;
  const all=[...series.flatMap(s=>s.pts),...(points||[]).flatMap(s=>s.pts)];
  const xmin=Math.floor(Math.min(...all.map(p=>p.x))/5)*5,xmax=Math.ceil(Math.max(...all.map(p=>p.x))/5)*5;
  const ymax=Math.ceil(Math.max(...all.map(p=>p.y))/50)*50;
  const X=v=>L+(v-xmin)/(xmax-xmin)*(W-L-R),Y=v=>T+(1-v/ymax)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(titre)}">`;
  for(let v=0;v<=ymax;v+=ymax/5){s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axe" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v)}${uy}</text>`;}
  for(let v=xmin;v<=xmax;v+=5)s+=`<text class="axe" x="${X(v)}" y="${H-12}" text-anchor="middle">${v}${ux}</text>`;
  series.forEach(se=>{const ps=[...se.pts].sort((a,b)=>a.x-b.x);
    s+=`<polyline class="ligne ${se.cls}" points="${ps.map(p=>X(p.x)+","+Y(p.y)).join(" ")}"/>`;
    ps.forEach(p=>s+=`<circle class="pt ${se.cls}" cx="${X(p.x)}" cy="${Y(p.y)}" r="5" data-tip="${esc(se.nom+" "+(p.label||"")+" · "+p.x+ux+" · "+p.y+uy)}"/>`);});
  (points||[]).forEach(se=>se.pts.forEach(p=>s+=`<rect class="pt ${se.cls}" x="${X(p.x)-5}" y="${Y(p.y)-5}" width="10" height="10" rx="2" data-tip="${esc((p.label||se.nom)+" · "+p.x+ux+" · "+p.y+uy)}"/>`));
  s+="</svg>";
  const w=el("figure","fig",`<figcaption>${esc(titre)}</figcaption>`);
  const box=el("div","chart-box",s);const tip=el("div","tip");tip.hidden=true;box.appendChild(tip);w.appendChild(box);
  const lg=el("div","legende");[...series,...(points||[])].forEach(se=>lg.appendChild(el("span","",`<i class="sw ${se.cls}${points&&points.includes(se)?" carre":""}"></i>${esc(se.nom)}`)));
  if(series.length+(points||[]).length>1)w.appendChild(lg);
  brancherTip(box,tip);return w;
}
function graphDonut({titre,parts,note}){
  const tot=parts.reduce((s,p)=>s+p.v,0);const R=80,r=50,C=100;let a=-Math.PI/2;
  let s=`<svg viewBox="0 0 200 200" class="donut" role="img" aria-label="${esc(titre)}">`;
  parts.forEach(p=>{const da=p.v/tot*Math.PI*2,a2=a+da,g=0.012;
    const P=(rad,t)=>[C+rad*Math.cos(t),C+rad*Math.sin(t)];const [x1,y1]=P(R,a+g),[x2,y2]=P(R,a2-g),[x3,y3]=P(r,a2-g),[x4,y4]=P(r,a+g);const big=da>Math.PI?1:0;
    s+=`<path class="part ${p.cls}" d="M${x1} ${y1}A${R} ${R} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z" data-tip="${esc(p.nom+" : "+p.lab)}"/>`;a=a2;});
  s+="</svg>";
  const w=el("figure","fig",`<figcaption>${esc(titre)}</figcaption>`);
  const row=el("div","donut-row");const box=el("div","chart-box",s);const tip=el("div","tip");tip.hidden=true;box.appendChild(tip);row.appendChild(box);
  const lg=el("ul","legende-v");parts.forEach(p=>lg.appendChild(el("li","",`<i class="sw ${p.cls}"></i><span>${esc(p.nom)}</span><b class="num">${esc(p.lab)}</b>`)));row.appendChild(lg);
  w.appendChild(row);if(note)w.appendChild(txt("p","muted",note));brancherTip(box,tip);return w;
}
function brancherTip(box,tip){
  const montrer=e=>{const t=e.target.closest("[data-tip]");if(!t){tip.hidden=true;return;}const r=box.getBoundingClientRect();
    tip.textContent=t.dataset.tip;tip.hidden=false;const x=(e.clientX??r.left+r.width/2)-r.left,y=(e.clientY??r.top)-r.top;
    tip.style.left=Math.min(Math.max(x,70),r.width-70)+"px";tip.style.top=Math.max(y-12,0)+"px";};
  box.addEventListener("pointermove",montrer);box.addEventListener("pointerdown",montrer);box.addEventListener("pointerleave",()=>tip.hidden=true);
}

  const W=800,kx=Math.cos((minLat+maxLat)/2*Math.PI/180),H=Math.round(W*(maxLat-minLat)/((maxLng-minLng)*kx));
  const X=l=>(l-minLng)/(maxLng-minLng)*W,Y=l=>(maxLat-l)/(maxLat-minLat)*H;
  const NS="http://www.w3.org/2000/svg";const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","dmap");svg.setAttribute("role","img");svg.setAttribute("aria-label","Carte schématique des maisons d'armagnac");

function layoutFamille(){
  // Mise en page par familles : chaque couple forme un bloc, ses enfants sont centrés dessous,
  // et chaque branche occupe sa propre largeur pour ne jamais se mêler aux branches voisines.
  const byId=new Map(famille.map(p=>[p.id,p]));
  const par=p=>(p.parents||[]).filter(id=>byId.has(id));
  const conj=p=>(p.conjoints||[]).filter(id=>byId.has(id));
  const enfantsDe=new Map();famille.forEach(p=>par(p).forEach(id=>{if(!enfantsDe.has(id))enfantsDe.set(id,[]);enfantsDe.get(id).push(p);}));
  const descendants=id=>{const vu=new Set();const pile=[id];while(pile.length){const x=pile.pop();(enfantsDe.get(x)||[]).forEach(c=>{if(!vu.has(c.id)){vu.add(c.id);pile.push(c.id);}});}return vu;};
  // la lignée principale : les descendants de l'ancêtre qui en a le plus
  const racines=famille.filter(p=>!par(p).length);
  const ancetre=[...racines].sort((a,b)=>descendants(b.id).size-descendants(a.id).size)[0];
  const lignee=ancetre?descendants(ancetre.id):new Set();if(ancetre)lignee.add(ancetre.id);
  // qui est dessiné à côté de son conjoint plutôt que sous ses propres parents
  const hote=new Map();
  famille.forEach(p=>{const sp=conj(p);if(!sp.length)return;
    if(!par(p).length){const h=sp.find(s=>par(byId.get(s)).length||lignee.has(s));if(h&&!(hote.get(h)===p.id))hote.set(p.id,h);}
    else if(!lignee.has(p.id)){const h=sp.find(s=>lignee.has(s));if(h)hote.set(p.id,h);}});
  // un conjoint rattaché à un conjoint lui-même rattaché remonte jusqu'à la personne d'origine
  const ancre=id=>{let x=id,n=0;while(hote.has(x)&&n<5){x=hote.get(x);n++;}return x;};
  const unites=new Map();
  famille.forEach(p=>{const a=ancre(p.id);if(!unites.has(a))unites.set(a,{ancre:a,membres:[a],enfants:[]});if(a!==p.id)unites.get(a).membres.push(p.id);});
  const uniteDe=id=>unites.get(ancre(id));
  const tri=(a,b)=>(a.ordre??99)-(b.ordre??99)||annee(a.naissance).localeCompare(annee(b.naissance))||famille.indexOf(a)-famille.indexOf(b);
  // chaque enfant (non rattaché) est placé sous la famille de son premier parent connu
  const place=new Set();
  famille.filter(p=>!hote.has(p.id)&&par(p).length).sort(tri).forEach(p=>{const u=uniteDe(par(p)[0]);if(u&&u.ancre!==p.id&&!place.has(p.id)){u.enfants.push(unites.get(p.id));place.add(p.id);}});
  unites.forEach(u=>u.enfants.sort((a,b)=>tri(byId.get(a.ancre),byId.get(b.ancre))));
  const GF=48; // écart entre deux familles voisines
  const largeurBloc=u=>u.membres.length*NW+(u.membres.length-1)*GX;
  const larg=new Map();
  const largeur=u=>{if(larg.has(u))return larg.get(u);larg.set(u,largeurBloc(u));
    const k=u.enfants.reduce((s,c,i)=>s+largeur(c)+(i?GF:0),0);const w=Math.max(largeurBloc(u),k);larg.set(u,w);return w;};
  const pos=new Map();
  const poser=(u,gauche,niveau)=>{const w=largeur(u);
    const kw=u.enfants.reduce((s,c,i)=>s+largeur(c)+(i?GF:0),0);let x=gauche+(w-kw)/2;
    const centres=[];u.enfants.forEach(c=>{poser(c,x,niveau+1);const pc=pos.get(c.ancre);centres.push(pc.x+NW/2);x+=largeur(c)+GF;});
    const lb=largeurBloc(u);let x0=centres.length?(centres[0]+centres[centres.length-1])/2-lb/2:gauche+(w-lb)/2;
    x0=Math.max(gauche,Math.min(x0,gauche+w-lb));
    u.membres.forEach((id,i)=>pos.set(id,{x:x0+i*(NW+GX),y:niveau*(NH+GY)}));};
  // familles de départ : les racines qui ont des enfants dans l'arbre, la lignée principale d'abord
  const depart=[...unites.values()].filter(u=>!par(byId.get(u.ancre)).length&&!place.has(u.ancre));
  const avecEnfants=depart.filter(u=>u.enfants.length).sort((a,b)=>(lignee.has(b.ancre)?1:0)-(lignee.has(a.ancre)?1:0));
  let x=0;avecEnfants.forEach(u=>{poser(u,x,0);x+=largeur(u)+GF*3;});
  // familles « par alliance » (ex. les parents d'un conjoint) : au-dessus de leur enfant, sans chevaucher
  const occupe=y=>[...pos.values()].filter(p=>p.y===y);
  depart.filter(u=>!u.enfants.length&&!pos.has(u.ancre)).forEach(u=>{
    const ch=(enfantsDe.get(u.ancre)||[]).map(c=>pos.get(c.id)).filter(Boolean)[0];
    const lb=largeurBloc(u);let y=ch?ch.y-(NH+GY):0,xx=ch?ch.x:x;
    if(y<0){y=0;}
    const libre=v=>occupe(y).every(p=>v+lb+GX<=p.x||v>=p.x+NW+GX);
    let n=0;while(!libre(xx)&&n<200){xx+=NW/2;n++;}
    u.membres.forEach((id,i)=>pos.set(id,{x:xx+i*(NW+GX),y}));
    if(!ch)x+=lb+GF;});
  famille.forEach(p=>{if(!pos.has(p.id)){pos.set(p.id,{x,y:0});x+=NW+GF;}});
  return {pos,byId,par,conj,gen:null};
}

function voirFamille(id){const z=qs("#fam-zone");if(!z)return;const {pos}=layoutFamille();const p=famille.find(x=>x.id===id);if(!p)return;
  const ids=[id,...(p.conjoints||[]),...famille.filter(x=>(x.parents||[]).includes(id)).map(x=>x.id)].filter(i=>pos.has(i));
  const xs=ids.map(i=>pos.get(i));const x0=Math.min(...xs.map(q=>q.x)),x1=Math.max(...xs.map(q=>q.x))+NW,y0=Math.min(...xs.map(q=>q.y)),y1=Math.max(...xs.map(q=>q.y))+NH;
  const k=Math.max(0.45,Math.min(1,(z.clientWidth-60)/(x1-x0),(z.clientHeight-80)/(y1-y0)));
  famVue={k,x:(z.clientWidth-(x1-x0)*k)/2-x0*k,y:(z.clientHeight-(y1-y0)*k)/2-y0*k};}
function bornesArbre(){const {pos}=layoutFamille();const xs=[...pos.values()].map(p=>p.x),ys=[...pos.values()].map(p=>p.y);
  return {x0:Math.min(...xs),x1:Math.max(...xs)+NW,y0:Math.min(...ys),y1:Math.max(...ys)+NH};}
function ajusterVue(){const z=qs("#fam-zone");if(!z||!famille.length)return;const b=bornesArbre();const W=z.clientWidth,H=z.clientHeight;
  const k=Math.min(1.2,Math.max(0.25,Math.min((W-40)/(b.x1-b.x0),(H-40)/(b.y1-b.y0))));
  famVue={k,x:(W-(b.x1-b.x0)*k)/2-b.x0*k,y:(H-(b.y1-b.y0)*k)/2-b.y0*k};}
function centrerSur(id){const z=qs("#fam-zone");const p=layoutFamille().pos.get(id);if(!z||!p)return;famVue.k=Math.max(famVue.k,0.8);
  famVue.x=z.clientWidth/2-(p.x+NW/2)*famVue.k;famVue.y=z.clientHeight/2-(p.y+NH/2)*famVue.k;}
function zoomer(f,cx,cy){const z=qs("#fam-zone");if(!z)return;cx??=z.clientWidth/2;cy??=z.clientHeight/2;
  const k=Math.min(2.5,Math.max(0.2,famVue.k*f));famVue.x=cx-(cx-famVue.x)*k/famVue.k;famVue.y=cy-(cy-famVue.y)*k/famVue.k;famVue.k=k;dessinerArbre();}
const famDrag={bouge:false};
function brancherPanZoom(z){
  const pts=new Map();let start=null;
  z.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});famDrag.bouge=false;
    if(pts.size===1)start={x:e.clientX,y:e.clientY,vx:famVue.x,vy:famVue.y};
    if(pts.size===2){const [a,b]=[...pts.values()];start={d:Math.hypot(a.x-b.x,a.y-b.y),k:famVue.k};}});
  z.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1&&start&&start.vx!=null){const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)+Math.abs(dy)>4){famDrag.bouge=true;z.setPointerCapture(e.pointerId);}
      if(famDrag.bouge){famVue.x=start.vx+dx;famVue.y=start.vy+dy;dessinerArbre();}}
    else if(pts.size===2&&start&&start.d){famDrag.bouge=true;const [a,b]=[...pts.values()];const r=z.getBoundingClientRect();
      zoomer(start.k*Math.hypot(a.x-b.x,a.y-b.y)/start.d/famVue.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);}});
  const fin=e=>{pts.delete(e.pointerId);if(!pts.size)start=null;setTimeout(()=>{famDrag.bouge=false;},0);};

}

const stripId=q=>{const {id,...r}=q;return r;};
async function envoyerPortrait(fichier,id){
  if(!String(fichier.type).startsWith("image/"))throw new Error("ce fichier n'est pas une image");
  const bmp=await createImageBitmap(fichier);
  const c=Math.min(bmp.width,bmp.height),t=Math.min(480,c);
  const cv=document.createElement("canvas");cv.width=t;cv.height=t;
  cv.getContext("2d").drawImage(bmp,(bmp.width-c)/2,(bmp.height-c)/2,c,c,0,0,t,t);
  const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85));
  const chemin=id.replace(/[^a-z0-9-]/gi,"")+"-"+Date.now()+".jpg";
  const {error}=await sb.storage.from("portraits").upload(chemin,blob,{contentType:"image/jpeg",upsert:false});
  if(error)throw error;
  return sb.storage.from("portraits").getPublicUrl(chemin).data.publicUrl;
}
async function supprimerPersonne(id){

    for(const q of famille.filter(x=>(x.parents||[]).includes(id)||(x.conjoints||[]).includes(id)))

  }catch(err){flash(dbMessage(err));}
}

   Collection « crm » : une fiche par client (clé = email, sinon nom + téléphone).
   {prenom, nom, email, tel, adresse, cp, ville, pays, sources:[], newsletter, tags:[], notes,
    achats:[{date, source, ref, produits:[{nom,qte,prix}], total}]}
   Les ventes saisies dans l'app (collection « clients » + « transactions ») s'ajoutent à l'affichage. */
let crm=[], crmCharge=false, crmAbonne=false, crmQuery="", crmFiltre="tous", crmTri="total", crmSel=null, crmImport=null;
const normEmail=e=>String(e||"").trim().toLowerCase();
const normTxt=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const cleClient=c=>normEmail(c.email)?"e:"+normEmail(c.email):"n:"+normTxt((c.prenom||"")+" "+(c.nom||""))+(c.tel?"|"+String(c.tel).replace(/\D/g,"").slice(-9):"");
const idCrm=cle=>"c"+[...cle].reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0,7).toString(36)+cle.replace(/[^a-z0-9]/g,"").slice(0,24);

function abonnerCrm(){
  if(crmAbonne||!estMembre)return;crmAbonne=true;
  db.collection("crm").onSnapshot(s=>{crm=s.docs.map(x=>({id:x.id,...x.data()}));crmCharge=true;if(page==="clients"&&!crmImport)render();},e=>flash(dbMessage(e)));
}
// fusion : fiches CRM + acheteurs des ventes privées
function clientsFusion(){
  const map=new Map();
  crm.forEach(c=>map.set(cleClient(c),{...c,achats:[...(c.achats||[])],sources:[...(c.sources||[])]}));
  txs.forEach(t=>{
    const c=clients.get(t.id);if(!c)return;
    const k=cleClient(c);let f=map.get(k);
    // rattache aussi par nom quand l'email manque d'un côté
    if(!f&&!normEmail(c.email)){for(const v of map.values()){if(normTxt(v.prenom+" "+v.nom)===normTxt(c.prenom+" "+c.nom)){f=v;break;}}}
    if(!f){f={id:null,prenom:c.prenom,nom:c.nom,email:c.email,tel:c.tel,sources:[],achats:[],tags:[]};map.set(k,f);}
    if(!f.email&&c.email)f.email=c.email;if(!f.tel&&c.tel)f.tel=c.tel;
    for(const k of ["cp","ville","adresse","raisonSociale","siren","tvaClient"])if(!f[k]&&c[k])f[k]=c[k];if(c.pro)f.pro=true;
    const src=t.source==="site"?"Site web":"Ventes privées";
    if(!f.sources.includes(src))f.sources.push(src);
    const v=ventes.find(x=>x.id===t.venteId);
    if(src==="Site web")f._site=true;
    f.achats.push({date:t.date,source:src,ref:v?v.nom:"",produits:(t.lignes||[]).map(l=>({nom:(l.nom+" "+(l.format||"")).trim(),qte:l.qte,prix:l.prix})),total:montant(t),paiement:t.paiement});
  });
  return [...map.values()].map(c=>{
    if(c._site){c.achats=c.achats.filter(a=>a.source!=="Squarespace");delete c._site;}
    const achats=c.achats.filter(a=>a.total||a.produits?.length).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    const total=achats.reduce((s,a)=>s+(+a.total||0),0);
    return {...c,achats,total,nbAchats:achats.reduce((s,a)=>s+(a.nb||1),0),dernier:achats[0]?.date||null};
  });
}

/* import CSV : Mailchimp (export d'audience) et Squarespace (commandes ou clients) */
function lireCsv(texte){
  texte=texte.replace(/^﻿/,"");const sep=(texte.split("\n")[0].match(/;/g)||[]).length>(texte.split("\n")[0].match(/,/g)||[]).length?";":",";
  const lignes=[];let champ="",ligne=[],q=false;
  for(let i=0;i<texte.length;i++){const ch=texte[i];
    if(q){if(ch==='"'){if(texte[i+1]==='"'){champ+='"';i++;}else q=false;}else champ+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){ligne.push(champ);champ="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&texte[i+1]==="\n")i++;ligne.push(champ);champ="";if(ligne.some(v=>v!==""))lignes.push(ligne);ligne=[];}
    else champ+=ch;}
  ligne.push(champ);if(ligne.some(v=>v!==""))lignes.push(ligne);
  const tete=lignes.shift()||[];return lignes.map(l=>Object.fromEntries(tete.map((h,i)=>[h.trim(),(l[i]??"").trim()])));
}
const col=(r,...noms)=>{for(const n of noms){const k=Object.keys(r).find(x=>x.toLowerCase()===n.toLowerCase());if(k&&r[k])return r[k];}return "";};
const nombre=v=>{v=String(v||"").replace(/[^\d,.-]/g,"");if(v.includes(",")&&v.includes("."))v=v.replace(/\./g,"").replace(",",".");else v=v.replace(",",".");return +v||0;};
const MOIS={janvier:1,"février":2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,"août":8,aout:8,septembre:9,octobre:10,novembre:11,"décembre":12,decembre:12};
const dateIso=v=>{v=String(v||"").trim();const fr=v.match(/^(\d{1,2})\s+([a-zéûô]+)\s+(\d{4})/i);if(fr&&MOIS[fr[2].toLowerCase()])return fr[3]+"-"+String(MOIS[fr[2].toLowerCase()]).padStart(2,"0")+"-"+fr[1].padStart(2,"0");const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");const d=new Date(v);return isNaN(d)?null:d.toISOString().slice(0,10);};
function analyserImport(rows,nomFichier=""){
  const h=Object.keys(rows[0]||{}).map(x=>x.toLowerCase());
  const contacts=new Map();
  const ajout=(c,achat)=>{const k=cleClient(c);if(k==="n:")return;const f=contacts.get(k)||{...c,sources:[],achats:[],tags:[],notes:""};
    if(c.notes&&!String(f.notes||"").includes(c.notes))f.notes=[f.notes,c.notes].filter(Boolean).join(" · ");
    for(const kk of ["prenom","nom","email","tel","adresse","cp","ville","pays"])if(!f[kk]&&c[kk])f[kk]=c[kk];
    if(c.newsletter)f.newsletter=true;(c.tags||[]).forEach(t=>{if(!f.tags.includes(t))f.tags.push(t);});
    if(!f.sources.includes(c.source))f.sources.push(c.source);
    if(achat){const ex=f.achats.find(a=>a.ref===achat.ref&&a.source===achat.source);if(ex){ex.produits.push(...achat.produits);if(!ex.total&&achat.total)ex.total=achat.total;}else f.achats.push(achat);}
    contacts.set(k,f);};
  let type="inconnu";
  const fichier=nomFichier.toLowerCase();
  if(h.includes("adresse email")||(h.includes("email address")&&h.includes("member_rating")&&h.some(x=>x.startsWith("part - ")||x.startsWith("pros - ")))){
    const statut=fichier.includes("unsubscribed")?"Désabonné":fichier.includes("cleaned")?"Email invalide":"";
    type="Mailchimp"+(statut?" ("+statut.toLowerCase()+"s)":" (abonnés)");
    const groupes=Object.keys(rows[0]||{}).filter(k=>/^(part|pros)\s*-/i.test(k.trim()));
    rows.forEach(r=>{
      const tags=groupes.filter(g=>r[g]).map(g=>(/^pros/i.test(g.trim())?"Pro : ":"")+g.replace(/^(part|pros)\s*-\s*/i,"").trim());
      col(r,"TAGS").replace(/"/g,"").split(",").map(t=>t.trim()).filter(Boolean).forEach(t=>tags.push(t));
      if(statut)tags.push(statut);
      const ev=col(r,"Nom de la vente ou évènement");if(ev)tags.push(ev);
      const notes=[col(r,"Entreprise")&&"Entreprise : "+col(r,"Entreprise"),col(r,"Commentaire_libre"),col(r,"Comment avez-vous connu Ravignan ?")&&"A connu Ravignan : "+col(r,"Comment avez-vous connu Ravignan ?")].filter(Boolean).join(" · ");
      ajout({source:"Mailchimp",email:normEmail(col(r,"Adresse email","Email Address")),prenom:col(r,"Prénom","First Name"),nom:col(r,"Nom de famille","Last Name"),
        tel:col(r,"Numéro de téléphone","Phone Number"),adresse:col(r,"Address"),pays:col(r,"CC"),newsletter:!statut,tags,notes});});
  }
  else if(h.includes("e-mail")&&h.includes("nombre de commandes")){type="Squarespace (clients)";
    rows.forEach(r=>{const nb=+col(r,"Nombre de commandes")||0;
      ajout({source:"Squarespace",email:normEmail(col(r,"E-mail")),prenom:col(r,"Prénom"),nom:col(r,"Nom de famille"),
        tel:col(r,"Numéro de téléphone associé à la facturation","Numéro de téléphone associé à la livraison","Numéro de téléphone"),
        adresse:[col(r,"Adresse de facturation 1","Adresse de livraison 1"),col(r,"Adresse de facturation 2","Adresse de livraison 2")].filter(Boolean).join(", "),
        cp:col(r,"Code postal de facturation","Code postal de livraison"),ville:col(r,"Ville de facturation","Ville de livraison"),pays:col(r,"Pays de facturation","Pays de livraison"),
        newsletter:/^(oui|yes|true|vrai)/i.test(col(r,"Accepte les communications marketing par e-mail")),tags:[]},
        nb?{source:"Squarespace",ref:"Boutique en ligne · "+nb+" commande"+(nb>1?"s":""),nb,date:dateIso(col(r,"Date de la dernière commande")),produits:[],total:nombre(col(r,"Total des dépenses"))}:null);});
  }
  else if(h.includes("email address")&&(h.includes("first name")||h.includes("member_rating")||h.includes("optin_time"))){type="Mailchimp";
    rows.forEach(r=>ajout({source:"Mailchimp",email:normEmail(col(r,"Email Address")),prenom:col(r,"First Name","FNAME"),nom:col(r,"Last Name","LNAME"),tel:col(r,"Phone Number","PHONE"),
      adresse:col(r,"Address","ADDRESS"),newsletter:true,tags:col(r,"TAGS").replace(/"/g,"").split(",").map(t=>t.trim()).filter(Boolean)}));}
  else if(h.includes("order id")||h.includes("lineitem name")){type="Squarespace (commandes)";
    // les lignes suivantes d'une même commande peuvent laisser le client vide : on reprend celui de la commande
    const parCommande=new Map();
    rows.forEach(r=>{const oid=col(r,"Order ID");const prec=parCommande.get(oid);
      if(prec&&!col(r,"Email")&&!col(r,"Billing Name"))Object.assign(r,prec);else if(oid)parCommande.set(oid,{Email:col(r,"Email"),"Billing Name":col(r,"Billing Name"),"Billing Phone":col(r,"Billing Phone"),"Billing City":col(r,"Billing City"),"Billing Zip":col(r,"Billing Zip"),"Billing Country":col(r,"Billing Country"),"Billing Address1":col(r,"Billing Address1")});
      const nomc=col(r,"Billing Name","Shipping Name");const [p,...n]=nomc.split(" ");
      const qte=+col(r,"Lineitem quantity")||1,prix=+String(col(r,"Lineitem price")).replace(",",".")||0;
      ajout({source:"Squarespace",email:normEmail(col(r,"Email")),prenom:p||"",nom:n.join(" "),tel:col(r,"Billing Phone","Shipping Phone"),
        adresse:col(r,"Billing Address1","Shipping Address1"),cp:col(r,"Billing Zip","Shipping Zip"),ville:col(r,"Billing City","Shipping City"),pays:col(r,"Billing Country","Shipping Country"),
        newsletter:/yes|oui|true/i.test(col(r,"Accepts Marketing"))},
        {source:"Squarespace",ref:"Commande "+col(r,"Order ID"),date:col(r,"Paid at","Created at"),produits:col(r,"Lineitem name")?[{nom:col(r,"Lineitem name"),qte,prix}]:[],total:+String(col(r,"Total")).replace(",",".")||0});});}
  else if(h.includes("email")&&(h.includes("first name")||h.includes("last name"))){type="Squarespace (clients)";
    rows.forEach(r=>ajout({source:"Squarespace",email:normEmail(col(r,"Email")),prenom:col(r,"First Name"),nom:col(r,"Last Name"),tel:col(r,"Phone","Phone Number"),
      ville:col(r,"City","Billing City"),pays:col(r,"Country","Billing Country"),newsletter:/yes|oui|true|subscribed/i.test(col(r,"Accepts Marketing","Subscribed","Email Marketing"))}));}
  return {type,contacts:[...contacts.values()]};
}

        for(const kk of ["prenom","nom","email","tel","adresse","cp","ville","pays"])if(!d[kk]&&x[kk])d[kk]=x[kk];

        if(!d.notes&&x.notes)d.notes=x.notes;

/* ---------- base de données (Supabase) ----------
   Petite couche qui imite l'API de documents utilisée par l'app :
   db.collection(c).onSnapshot / .doc(id).set|update|delete, db.doc("c/id"). */
const sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,detectSessionInUrl:true,flowType:"implicit"}});
function makeDb(){
  const cache={}, listeners={}, loading={};
  const snapOf=c=>({docs:[...(cache[c]||new Map())].map(([id,d])=>({id,exists:true,data:()=>d}))});
  const emit=c=>(listeners[c]||[]).forEach(f=>{try{f(snapOf(c))}catch(e){console.error(e)}});
  const err=e=>({code:e&&(e.code==="42501"||/row-level security/i.test(e.message||""))?"invalid_argument":"unavailable",message:e&&e.message||""});
  async function load(c){
    const {data,error}=await sb.from("docs").select("id,data").eq("collection",c);
    if(error)throw err(error);
    cache[c]=new Map(data.map(r=>[r.id,r.data]));emit(c);
  }
  sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{
    const row=p.eventType==="DELETE"?p.old:p.new;if(!row||!row.collection)return;
    const c=row.collection;if(!cache[c])return;
    if(p.eventType==="DELETE")cache[c].delete(row.id);else cache[c].set(row.id,row.data);
    emit(c);
  }).subscribe();
  // si le temps réel décroche (veille du téléphone), on recharge au retour
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)Object.keys(listeners).forEach(c=>load(c).catch(()=>{}));});
  const docRef=(c,id)=>({
    async get(){if(!cache[c])await load(c);const d=cache[c].get(id);return {id,exists:!!d,data:()=>d};},
    async set(data){
      let {error}=await sb.from("docs").insert({collection:c,id,data});
      if(error&&error.code==="23505")({error}=await sb.from("docs").update({data,updated_at:new Date().toISOString()}).eq("collection",c).eq("id",id));
      if(error)throw err(error);(cache[c]||(cache[c]=new Map())).set(id,data);emit(c);
    },
    async update(patch){
      const cur=(cache[c]&&cache[c].get(id))||{};const data={...cur,...patch};
      const {error}=await sb.from("docs").update({data,updated_at:new Date().toISOString()}).eq("collection",c).eq("id",id);
      if(error)throw err(error);(cache[c]||(cache[c]=new Map())).set(id,data);emit(c);
    },
    async delete(){
      const {error}=await sb.from("docs").delete().eq("collection",c).eq("id",id);
      if(error)throw err(error);cache[c]&&cache[c].delete(id);emit(c);
    },
    onSnapshot(next,onError){
      const f=s=>{const d=s.docs.find(x=>x.id===id);next(d||{id,exists:false,data:()=>undefined});};
      return collRef(c).onSnapshot(f,onError);
    }
  });
  const collRef=c=>({
    doc:(id)=>docRef(c,id||("x"+uid())),
    onSnapshot(next,onError){
      (listeners[c]||(listeners[c]=[])).push(next);
      if(cache[c])next(snapOf(c));
      else if(!loading[c])loading[c]=load(c).catch(e=>{loading[c]=null;onError&&onError(e);});
      return ()=>{listeners[c]=(listeners[c]||[]).filter(x=>x!==next);};
    }
  });
  const recharger=c=>{if(listeners[c])load(c).catch(()=>{});};
  return {collection:collRef,recharger,doc:p=>{const [c,id]=p.split("/");return docRef(c,id);}};
}

/* ---------- I Armagnac : assistant vocal ----------
   Écoute (reconnaissance vocale du navigateur), réponse calculée ici à partir des données de l'app
   (questions prévues : stock, prix, chiffre d'affaires, vendeurs, notes de dégustation, clients…),
   lue à voix haute (synthèse vocale du téléphone, voix française). Aucune donnée ne quitte l'app.
   Réservé aux membres connectés. La fonction Supabase « i-armagnac » (Claude) reste prête si une clé API est ajoutée. */
let iaMsgs=[], iaVoix=true, iaEcoute=null, iaOccupe=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function iaAjouter(role,texte){
  const b=el("div","ia-bulle "+(role==="user"?"moi":"lui"));b.textContent=texte;qs("#ia-fil").appendChild(b);
  qs("#ia-fil").scrollTop=qs("#ia-fil").scrollHeight;return b;
}
function iaParler(texte){
  if(!iaVoix||!window.speechSynthesis)return;
  try{
    const u=new SpeechSynthesisUtterance(texte);u.lang="fr-FR";u.rate=1.02;u.pitch=0.9;
    const voix=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
    u.voice=voix.find(v=>/thomas|henri|paul|mathieu|nicolas|male|homme/i.test(v.name)&&!/female|amelie|audrey|marie|julie|virginie/i.test(v.name))||voix.find(v=>/fr-FR/i.test(v.lang))||voix[0]||null;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
let iaDegu=null;
const iaEur=n=>{const v=Math.round((Number(n)||0)*100)/100;return (Number.isInteger(v)?String(v):v.toFixed(2).replace(".",","))+" euros";};
const iaPl=(n,mot,pl)=>`${n} ${n>1?(pl||mot+"s"):mot}`;
const iaJour=d=>d?new Date(d).toLocaleDateString("fr-FR",{day:"numeric",month:"long"}):"";
// la vente dont on parle : celle ouverte à l'écran, sinon la dernière en cours, sinon la plus récente
function iaVente(q){
  const nommee=ventes.find(v=>v.nom&&normTxt(q).includes(normTxt(v.nom)));if(nommee)return nommee;
  if(venteId&&["vente","saisie"].includes(page)){const v=getVente();if(v)return v;}
  const tri=[...ventes].sort((a,b)=>String(b.dateDebut||b.createdAt||"").localeCompare(String(a.dateDebut||a.createdAt||"")));
  return tri.find(v=>!v.cloturee)||tri[0];
}
const iaRefsDe=(v,an,q)=>(v.refs||[]).filter(r=>an?String(r.nom).includes(an):normTxt(q).includes(normTxt(r.nom).replace(/^millesime /,"")));
async function iaRepondre(question){
  const q=normTxt(question),an=(question.match(/\b(19[5-9]\d|20[0-2]\d)\b/)||[])[0];
  const v=iaVente(q),tv=v?txsOf(v.id):[];
  const a=(...mots)=>mots.some(m=>(" "+q+" ").includes(m));
  // aide
  if(a("aide","que sais","quoi demander","tu sais faire","peux tu faire"))
    return "Demandez-moi le stock d'un millésime, son prix, sa note de dégustation, le chiffre d'affaires de la vente, qui a le plus vendu, les paiements en attente, ou ce qu'a acheté un client.";
  // dégustation
  if(a("degust","note","nez","bouche","robe","arome","gout","accord")){
    if(!iaDegu)iaDegu=await chargerContenu("degustation").catch(()=>null);
    if(!iaDegu)return "Je n'arrive pas à lire les notes de dégustation.";
    if(!an){const f=iaDegu.familles||[];return `${iaDegu.titre||"L'ordre de dégustation"} : ${f.map(x=>`famille ${x.nom}, ${x.millesimes.join(", ")}`).join(" ; puis ")}.`;}
    const n=(iaDegu.notes||{})[an];if(!n)return `Hè bé, je n'ai pas de note de dégustation pour le ${an}.`;
    const ph=t=>{t=String(t).trim();return t.charAt(0).toUpperCase()+t.slice(1).replace(/[.s]*$/,".");};
    return [`Le ${an}${n.robe?", robe "+n.robe.toLowerCase():""}.`,n.nez?ph("au nez, "+n.nez.charAt(0).toLowerCase()+n.nez.slice(1)):"",n.bouche?ph("en bouche, "+n.bouche.charAt(0).toLowerCase()+n.bouche.slice(1)):"",n.accord?ph(n.accord):"",n.medaille?ph(n.medaille):""].filter(Boolean).join(" ");
  }
  // prix
  if(a("prix","coute","tarif","combien vaut")){
    if(!an)return "De quel millésime voulez-vous le prix ?";
    const enVente=v?iaRefsDe(v,an,q):[];
    if(enVente.length)return `Sur la vente « ${v.nom} », le ${an} est à ${enVente.map(r=>`${iaEur(r.prix)} en ${r.format}`).join(", ")}.`;
    const m=MILL.find(x=>x.an===an);if(!m)return `Je n'ai pas de prix pour le ${an}.`;
    return `Le ${an} est à ${m.formats.map(f=>`${iaEur(f.p)} en ${f.f}`).join(", ")}.`;
  }
  // paiements en attente
  if(a("attente","pas paye","impaye","sumup")){
    const at=txs.filter(enAttente);if(!at.length)return "Aucun paiement par carte en attente. Tout est encaissé.";
    return `${iaPl(at.length,"paiement")} par carte en attente, pour ${iaEur(at.reduce((s,x)=>s+(x.total||0),0))} : ${at.slice(0,4).map(x=>`${nomClient(x)}, ${iaEur(x.total)}`).join(" ; ")}.`;
  }
  // stock
  if(a("stock","reste","restant","rupture","combien de bouteille","il en reste")){
    if(!v)return "Il n'y a aucune vente pour l'instant.";
    const refs=an||iaRefsDe(v,"",q).length?iaRefsDe(v,an,q):v.refs||[];
    if(!refs.length)return `Le ${an||"produit"} n'est pas dans la vente « ${v.nom} ».`;
    const etat=r=>{const reste=r.stock?resteDispo(v,r):null;return `${r.nom} ${r.format} : ${reste===null?"sans limite, "+iaPl(venduDe(v.id,r.id),"vendue"):reste<=0?(reste<0?`à découvert de ${-reste}`:"plus rien"):iaPl(reste,"bouteille")}`;};
    if(refs.length<=3)return `Sur la vente « ${v.nom} », ${refs.map(etat).join(" ; ")}.`;
    const bas=refs.filter(r=>r.stock&&resteDispo(v,r)<=2);
    return `La vente « ${v.nom} » a ${iaPl(refs.length,"produit")}.${bas.length?` Attention, presque plus de : ${bas.map(etat).join(" ; ")}.`:" Aucun produit n'est presque épuisé."} Demandez-moi un millésime pour le détail.`;
  }
  // vendeurs
  if(a("vendeur","qui a vendu","qui a le plus","meilleur","classement")){
    if(!v)return "Il n'y a aucune vente pour l'instant.";
    const par={};tv.forEach(x=>{const n=x.vendeurPrenom||"Inconnu";par[n]=(par[n]||0)+montant(x);});
    const cl=Object.entries(par).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]);if(!cl.length)return `Personne n'a encore vendu sur « ${v.nom} ».`;
    return `Sur « ${v.nom} », ${cl.slice(0,3).map(([n,m],i)=>`${i?"":"en tête "}${n} avec ${iaEur(m)}`).join(", puis ")}.`;
  }
  // client
  if(a("client","achete","a pris","dernier achat","commande")){
    const liste=clientsFusion();
    const mots=q.split(/[^a-z0-9-]+/).filter(m=>m.length>2&&!["client","cliente","quoi","qu'a","achete","dernier","achat","combien","est","que","les","des","pour","avec","commande","pris"].includes(m));
    const trouves=liste.filter(c=>{const n=normTxt([c.prenom,c.nom].join(" "));return mots.length&&mots.every(m=>n.includes(m));});
    if(!mots.length||!trouves.length){
      if(a("combien de client","nombre de client"))return `Le fichier compte ${iaPl(liste.length,"client")}.`;
      return "Quel client ? Dites son prénom et son nom.";
    }
    if(trouves.length>3)return `J'ai ${trouves.length} clients qui correspondent. Précisez le nom.`;
    return trouves.map(c=>{const d=c.achats&&c.achats[0];
      return `${[c.prenom,c.nom].filter(Boolean).join(" ")}${c.ville?", de "+c.ville:""} : ${iaPl(c.nbAchats||0,"achat")} pour ${iaEur(c.total)}`
        +(d?`, le dernier le ${iaJour(d.date)}${(d.produits||[]).length?" : "+d.produits.slice(0,3).map(p=>`${p.qte} ${p.nom}`).join(", "):""}`:"");}).join(". ")+".";
  }
  // chiffre d'affaires
  if(a("chiffre","ca ","combien on a","combien avons","vendu","total","encaisse","recette","aujourd")){
    if(a("aujourd")){const auj=new Date().toDateString(),t=txs.filter(x=>x.date&&new Date(x.date).toDateString()===auj);
      return t.length?`Aujourd'hui : ${iaPl(t.length,"transaction")}, ${iaEur(t.reduce((s,x)=>s+montant(x),0))}.`:"Pas encore de vente aujourd'hui.";}
    if(!v)return "Il n'y a aucune vente pour l'instant.";
    const btl=tv.reduce((s,x)=>s+(x.lignes||[]).reduce((a2,l)=>a2+(l.qte||0),0),0);
    return `La vente « ${v.nom} » fait ${iaEur(tv.reduce((s,x)=>s+montant(x),0))}, en ${iaPl(tv.length,"transaction")} et ${iaPl(btl,"bouteille")}.`;
  }
  // ventes
  if(a("vente","quelle vente","en cours","prochaine")){
    const enCours=ventes.filter(x=>!x.cloturee);
    return enCours.length?`${iaPl(enCours.length,"vente")} en cours : ${enCours.map(x=>`« ${x.nom} » à ${x.lieu||"?"}`).join(", ")}.`:"Aucune vente en cours.";
  }
  if(a("bonjour","salut","adishatz","coucou"))return `Adishatz ${(monPrenom||"").split(" ")[0]} ! Que voulez-vous savoir ?`;
  if(a("merci"))return "Avec plaisir, macarel !";
  return "Hè bé, je n'ai pas compris. Demandez-moi par exemple : combien il reste de 1992, le prix du 1983, la note du 1987, ou le chiffre de la vente.";
}
async function iaDemander(question){
  question=String(question||"").trim();if(!question||iaOccupe)return;
  iaOccupe=true;iaAjouter("user",question);iaMsgs.push({role:"user",content:question});
  const att=iaAjouter("assistant","…");att.classList.add("attente");
  let texte;
  try{
    texte=await iaRepondre(question);
    iaMsgs.push({role:"assistant",content:texte});att.classList.remove("attente");att.textContent=texte;iaParler(texte);
  }catch(e){att.classList.remove("attente");att.classList.add("erreur");att.textContent=e.message;iaMsgs.pop();}
  finally{iaOccupe=false;}
}
function iaOuvrir(ouvert){
  qs("#ia-panel").hidden=!ouvert;qs("#ia-btn").setAttribute("aria-expanded",String(ouvert));
  if(ouvert){if(!iaMsgs.length&&!qs("#ia-fil").children.length)iaAjouter("assistant",`Adishatz ${(monPrenom||"").split(" ")[0]} ! Demandez-moi une vente, un millésime ou un client${SR?" : appuyez sur le micro et parlez.":"."}`);
    try{speechSynthesis.getVoices();}catch(e){}if(!SR)qs("#ia-texte").focus();}
  else{try{speechSynthesis.cancel();iaEcoute&&iaEcoute.abort();}catch(e){}}
}
function iaMicro(){
  if(!SR)return;
  if(iaEcoute){iaEcoute.stop();return;}
  try{speechSynthesis.cancel();}catch(e){}
  const r=new SR();r.lang="fr-FR";r.interimResults=true;r.maxAlternatives=1;iaEcoute=r;
  const m=qs("#ia-micro"),inp=qs("#ia-texte");m.classList.add("ecoute");m.setAttribute("aria-label","Arrêter l'écoute");
  let final="";
  r.onresult=e=>{let t="";for(const x of e.results){t+=x[0].transcript;if(x.isFinal)final=t;}inp.value=t;};
  r.onerror=e=>{if(e.error==="not-allowed")flash("Autorisez le micro pour parler à I Armagnac.");};
  r.onend=()=>{iaEcoute=null;m.classList.remove("ecoute");m.setAttribute("aria-label","Parler");
    const q=(final||inp.value).trim();if(q){inp.value="";iaDemander(q);}};
  r.start();
}
qs("#ia-btn").onclick=()=>iaOuvrir(qs("#ia-panel").hidden);
qs("#ia-fermer").onclick=()=>iaOuvrir(false);
qs("#ia-son").onclick=e=>{iaVoix=!iaVoix;e.currentTarget.textContent=iaVoix?"🔊":"🔇";e.currentTarget.setAttribute("aria-pressed",String(iaVoix));
  e.currentTarget.title=iaVoix?"Couper la voix":"Remettre la voix";if(!iaVoix)try{speechSynthesis.cancel();}catch(x){}};

function majPied(){
  qs("#side-user").textContent=myEmail?"Connecté : "+myEmail:"";
  qs("#btn-logout").hidden=!myEmail;
  qs("#ia-btn").hidden=!estMembre;if(!estMembre)iaOuvrir(false);
}
function demarrerDonnees(){
  db=makeDb();downloads={save:telecharger};
  const onErr=e=>{flash(dbMessage(e));};
  db.collection("famille").onSnapshot(s=>{
    famille=s.docs.map(x=>({id:x.id,...x.data()}));
    const premier=!familleChargee;familleChargee=true;
    if(page!=="genealogie")return;
    if(premier||!qs("#fam-svg"))render();else{dessinerArbre();if(!famEdit)ficheFamille();}
  },()=>{familleChargee=true;});
  chargerContenu("genealogie").then(d=>{famResume=d.resume||"";if(page==="genealogie"&&!famEdit)render();}).catch(()=>{});
  chargerVendeurs();
  db.collection("reglages").onSnapshot(s=>{const d=s.docs.find(x=>x.id==="caisse");reglages=d?d.data():{};const q=s.docs.find(x=>x.id==="squarespace_sync");sqSync=q?q.data():{};},()=>{});
  db.collection("chambres").onSnapshot(s=>{
    chambres=s.docs.map(x=>({id:x.id,...x.data()}));loaded.chambres=true;
    if(page==="chambres")refreshChambres();
  },onErr);
  db.collection("reservations").onSnapshot(s=>{
    resas=s.docs.map(x=>({id:x.id,...x.data()})).filter(r=>r.chambreId&&r.arrivee&&r.depart);
    if(page==="chambres")refreshChambres();
  },onErr);
  db.collection("ventes").onSnapshot(s=>{
    ventes=s.docs.map(x=>({id:x.id,...x.data()}));loaded.ventes=true;
    if(LIVE_PAGES.includes(page))render();
  },onErr);
  db.collection("transactions").onSnapshot(s=>{
    txs=s.docs.map(x=>({id:x.id,...x.data()}));
    if(!loaded.txs)traiterRetourSumUp().then(fait=>{if(!fait)reprendreFacture();});
    loaded.txs=true;
    if(LIVE_PAGES.includes(page))render();
    else if(page==="saisie"&&!horsOpen){renderLignes();updateTotal();}
  },onErr);
  render();
}
async function verifierSession(session){
  if(!session){myEmail="";monPrenom="";isOwner=false;estMembre=false;accesPrive=false;authState="login";majPied();render();return;}
  myEmail=(session.user.email||"").toLowerCase();
  monPrenom=String(session.user.user_metadata?.full_name||session.user.user_metadata?.name||"").trim().split(/\s+/)[0]||"";
  const {data,error}=await sb.from("membres").select("role,nom").eq("email",myEmail).maybeSingle();
  // réseau pas encore revenu (téléphone qui sort de veille) : on garde l'état et on réessaie, sans afficher l'écran de connexion
  if(error){console.warn("membres",error);setTimeout(()=>sb.auth.getSession().then(r=>verifierSession(r.data.session)),3000);return;}
  if(data&&data.nom)monPrenom=data.nom;
  {const pic=session.user.user_metadata?.avatar_url||session.user.user_metadata?.picture;
    if(data&&pic&&/^https:\/\//.test(pic))sb.rpc("maj_ma_photo",{url:pic}).then(()=>chargerPhotos());}
  // le vendeur proposé par défaut est la personne connectée, sous son nom de la liste des accès
  if(monPrenom){
    store.set(VENDEUR_KEY,monPrenom);
    if(!nv.nom&&!nv.refs.length){nv.vendeur=monPrenom;delete nv.vendeurs;}
    if(!sv.lignes.length)sv.vendeur=monPrenom;
  }
  isOwner=!!data&&data.role==="admin";estMembre=!!data;
  if(estMembre)chargerPhotos();
  accesPrive=estMembre&&(await sb.rpc("acces_prive")).data===true;
  if(isOwner||accesPrive)db.recharger("famille");
  if(accesPrive)["chambres","reservations"].forEach(db.recharger);
  if(accesPrive&&!coordsAbonne){coordsAbonne=true;db.collection("coordonnees").onSnapshot(s=>{coords=new Map(s.docs.map(x=>[x.id,x.data()]));if(page==="genealogie"&&!famEdit)ficheFamille();},()=>{});}
  authState=isOwner?"ok":"denied";majPied();
  if(estMembre)abonnerCrm();

  if(estMembre&&!clientsAbonne){
    clientsAbonne=true;
    db.collection("clients").onSnapshot(s=>{
      clients=new Map(s.docs.map(x=>[x.id,x.data()]));
      if(LIVE_PAGES.includes(page))render();
    },()=>{});
  }
  // arrivée par le lien de connexion : ouvrir directement l'administration
  if(arriveeParLien&&page!=="admin"){page="admin";}
  if(location.hash)history.replaceState(null,"",location.pathname);
  render();
}
demarrerDonnees();
sb.auth.onAuthStateChange((ev,session)=>{
  // Supabase renvoie SIGNED_IN à chaque retour sur l'onglet : même personne déjà vérifiée, rien à refaire
  if(ev==="SIGNED_IN"&&session&&estMembre&&String(session.user.email||"").toLowerCase()===myEmail)return;
  if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>verifierSession(session),0);
});
