.hdr-btn{background:transparent;color:var(--hdr-ink);border:1px solid var(--hdr-soft);border-radius:999px;font-size:12px;font-weight:700;padding:5px 12px;cursor:pointer}

<script>
const MILL=[

  {id:"af",nom:"Armafizz",format:"75cl",prix:26},
  {id:"fl",nom:"Floc de Gascogne",format:"75cl",prix:16},

  {id:"cb150",nom:"Caissette bois",format:"Magnum",prix:10},

const PMTS=[["CB","💳 CB"],["Espèces","💵 Espèces"],["Caisse centrale","🏛️ Caisse"]];
const VENDEUR_KEY="ravignan.vendeur";

const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>(Number(n)||0).toFixed(2).replace(".",",")+" €";
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const frDate=s=>s?s.split("-").reverse().join("/"):"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const qs=s=>document.querySelector(s);
const store={get(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const periode=v=>frDate(v.dateDebut)+(v.dateFin&&v.dateFin!==v.dateDebut?" → "+frDate(v.dateFin):"");

let db=null, downloads=null, canWrite=true;
let ventes=[], txs=[], loaded={ventes:false,txs:false}, dbError=null;
let page="home", venteId=null, tab="tx", confirmClose=false, busy=false;
const blankNv=()=>({nom:"",lieu:"",dateDebut:today(),dateFin:today(),vendeur:store.get(VENDEUR_KEY),refs:[],extras:[]});
const blankSv=()=>({client:{nom:"",prenom:"",tel:"",email:""},lignes:[],pmt:"CB",vendeur:store.get(VENDEUR_KEY)});
let nv=blankNv(), sv=blankSv();
let saisieProdCard=null, horsOpen=false;
let userApi=null, isOwner=false, myId=null, adminIds=[], adminYear="all";
const isAdmin=()=>isOwner||(!!myId&&adminIds.includes(myId));
const LIVE_PAGES=["home","vente","admin"];
const TOP_PAGES=["home","chambres","admin"];
let chambres=[], chFilter="all", chQuery="";

/* ---------- menu ---------- */
function setMenu(open){
  qs("#side").classList.toggle("open",open);qs("#scrim").hidden=!open;
  qs("#btn-menu").setAttribute("aria-expanded",String(open));
}
function updateNav(){
  const section=page==="chambres"?"chambres":page==="admin"?"admin":"home";
  document.querySelectorAll(".nav-item").forEach(b=>{
    b.classList.toggle("active",b.dataset.nav===section);
    if(b.dataset.nav==="admin")b.hidden=!isAdmin();
  });
}
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{setMenu(false);go(b.dataset.nav);});
qs("#btn-menu").onclick=()=>setMenu(!qs("#side").classList.contains("open"));
qs("#scrim").onclick=()=>setMenu(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){setMenu(false);if(roomOpenId)closeRoom();}});
qs("#modal").onclick=e=>{if(e.target.id==="modal")closeRoom();};

const getVente=()=>ventes.find(v=>v.id===venteId);
const txsOf=vid=>txs.filter(t=>t.venteId===vid).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
const venduDe=(vid,refId)=>txsOf(vid).reduce((s,t)=>s+(t.lignes||[]).filter(l=>l.refId===refId).reduce((a,l)=>a+(l.qte||0),0),0);

function flash(text,kind="err"){
  const f=qs("#flash");f.innerHTML="";
  if(!text){f.hidden=true;return;}
  f.appendChild(el("div","msg "+kind,esc(text)));f.hidden=false;
  if(kind!=="err")setTimeout(()=>{if(f.textContent===text)flash("");},3000);
}
function dbMessage(e){
  const c=e&&e.code;
  if(c==="invalid_argument")return "Vous n'avez pas le droit de modifier les ventes. Demandez au propriétaire de vous inviter comme Éditeur.";
  if(c==="quota_exceeded")return "La base est pleine. Supprimez d'anciennes ventes avant d'en ajouter.";
  return "L'enregistrement a échoué. Vérifiez la connexion et réessayez.";
}

/* ---------- navigation ---------- */
function go(p,id){
  page=p;if(id)venteId=id;confirmClose=false;flash("");
  window.scrollTo(0,0);
  render();
}
function render(){
  const back=qs("#btn-back");
  back.hidden=TOP_PAGES.includes(page);
  back.onclick=()=>{
    if(page==="saisie")go("vente",venteId);
    else{if(page==="new-vente")nv=blankNv();go("home");}
  };
  const titles={home:"Ventes privées","new-vente":"Nouvelle vente",vente:getVente()?.nom||"Vente",saisie:"Nouvelle transaction",admin:"Administration",chambres:"Chambres"};
  qs("#hdr-title").textContent=titles[page]||"Domaine de Ravignan";
  updateNav();
  const m=qs("#main");m.innerHTML="";saisieProdCard=null;
  m.classList.toggle("wide",page==="chambres"||page==="admin");
  if(!db){
    m.appendChild(el("div","empty",dbError||"Chargement…"));return;
  }
  if(page==="vente"&&!getVente()){page="home";}
  if(page==="admin"&&!isAdmin()){page="home";}
  if(page==="chambres")renderChambres(m);
  else if(page==="admin")renderAdmin(m);
  else if(page==="home")renderHome(m);
  else if(page==="new-vente")renderNewVente(m);
  else if(page==="vente")renderVente(m);
  else if(page==="saisie")renderSaisie(m);
}

/* ---------- accueil ---------- */
function renderHome(m){
  const intro=el("div","card soft",`<p style="font-weight:800;color:var(--accent-ink)">Ventes privées</p>
    <p class="muted">Créez une vente, saisissez les transactions sur place et suivez le stock en direct. Tous les vendeurs voient les mêmes chiffres.</p>`);
  m.appendChild(intro);
  if(canWrite){const b=el("button","btn primary full","+ Nouvelle vente");b.onclick=()=>go("new-vente");m.appendChild(b);}
  else m.appendChild(el("div","msg info","Lecture seule : demandez au propriétaire de vous inviter comme Éditeur pour saisir des ventes."));
  if(!loaded.ventes){m.appendChild(el("div","empty","Chargement…"));return;}
  if(ventes.length===0){m.appendChild(el("div","empty","Aucune vente pour l'instant.<br>Créez la première avec le bouton ci-dessus."));return;}
  const list=[...ventes].sort((a,b)=>(a.cloturee-b.cloturee)||(b.dateDebut||"").localeCompare(a.dateDebut||""));
  list.forEach(v=>{
    const t=txsOf(v.id);const ca=t.reduce((s,x)=>s+(x.total||0),0);
    const c=el("button","card vente",`<div class="row" style="align-items:flex-start">
      <div style="min-width:0"><p style="font-weight:700">${esc(v.nom)}</p>
      <p class="muted">${esc(v.lieu)} · ${esc(periode(v))}</p></div>
      <span class="badge ${v.cloturee?"closed":"open"}">${v.cloturee?"Clôturée":"En cours"}</span></div>
      <div class="row muted num" style="justify-content:flex-start;gap:16px"><span>${t.length} transaction${t.length>1?"s":""}</span><span><b style="color:var(--accent-ink)">${fmt(ca)}</b></span></div>`);
    c.onclick=()=>go("vente",v.id);
    m.appendChild(c);
  });
}

function renderProdPicker(c){
  c.innerHTML=`<h2>Produits <span style="color:var(--accent)">(${nv.refs.length+nv.extras.length})</span></h2>`;
  const box=el("div","card soft",`<p style="font-size:12px;font-weight:700;color:var(--accent-ink)">Ajouter un millésime</p>
    <div class="grid2">
      <div class="field"><label for="sel-an">Millésime</label><select id="sel-an"><option value="">— Année —</option>${MILL.map(x=>`<option value="${x.an}">${x.an}</option>`).join("")}</select></div>
      <div class="field"><label for="sel-fmt">Format</label><select id="sel-fmt"><option value="">— Format —</option></select></div>
    </div>`);
  box.style.padding="12px";
  const add=el("button","btn primary sm","Ajouter ce millésime");add.disabled=true;box.appendChild(add);c.appendChild(box);
  const selAn=box.querySelector("#sel-an"),selF=box.querySelector("#sel-fmt");
  selAn.onchange=()=>{
    selF.innerHTML=`<option value="">— Format —</option>`;
    const mm=MILL.find(x=>x.an===selAn.value);
    if(mm)mm.formats.forEach(f=>{const o=document.createElement("option");o.value=f.f;o.textContent=`${f.f} · ${fmt(f.p)}`;selF.appendChild(o);});
    add.disabled=true;
  };
  selF.onchange=()=>{add.disabled=!selF.value;};
  add.onclick=()=>{
    const mm=MILL.find(x=>x.an===selAn.value);const f=mm&&mm.formats.find(x=>x.f===selF.value);if(!f)return;
    const id="m_"+mm.an+"_"+f.f;
    if(!nv.refs.find(r=>r.id===id))nv.refs.push({id,nom:"Millésime "+mm.an,format:f.f,stock:"",prix:f.p});
    renderProdPicker(c);
  };
  const autres=el("div","field",`<label>Autres produits</label>`);
  const chips=el("div","chips");
  AUTRES.forEach(p=>{
    const on=nv.refs.some(r=>r.id===p.id);
    const ch=el("button","chip"+(on?" sel":""),`${on?"✓ ":""}${esc(p.nom)} (${esc(p.format)})`);
    ch.onclick=()=>{if(on)nv.refs=nv.refs.filter(r=>r.id!==p.id);else nv.refs.push({...p,stock:""});renderProdPicker(c);};
    chips.appendChild(ch);
  });
  autres.appendChild(chips);c.appendChild(autres);
  if(nv.refs.length){
    c.appendChild(el("p","muted","Stock emporté et prix pour cette vente (stock vide ou 0 = sans limite)"));
    nv.refs.forEach(r=>{
      const row=el("div","ref",`<div class="row"><div style="min-width:0"><p style="font-size:14px;font-weight:700">${esc(r.nom)}</p><p class="muted">${esc(r.format)}</p></div><button class="x" aria-label="Retirer">×</button></div>
        <div class="grid2">
          <div class="field"><label for="st-${r.id}">Stock</label><input id="st-${r.id}" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(r.stock)}"></div>
          <div class="field"><label for="px-${r.id}">Prix (€)</label><input id="px-${r.id}" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(r.prix)}"></div>
        </div>`);
      row.querySelector(".x").onclick=()=>{nv.refs=nv.refs.filter(x=>x.id!==r.id);renderProdPicker(c);};
      row.querySelector("#st-"+r.id).oninput=e=>{r.stock=e.target.value;};
      row.querySelector("#px-"+r.id).oninput=e=>{r.prix=e.target.value;};
      c.appendChild(row);
    });
  }
  nv.extras.forEach(x=>{
    const row=el("div","ref",`<div class="row"><div style="min-width:0"><p style="font-size:14px;font-weight:700">${esc(x.nom)}</p><p class="muted">${esc(x.format)} · ${fmt(x.prix)} · stock ${x.stock||"sans limite"}</p></div><button class="x" aria-label="Retirer">×</button></div>`);
    row.querySelector(".x").onclick=()=>{nv.extras=nv.extras.filter(e=>e.id!==x.id);renderProdPicker(c);};
    c.appendChild(row);
  });
  const btn=el("button","dashed","+ Produit hors catalogue");
  const form=el("div","card soft",`<div class="field"><label for="hc-nom">Nom</label><input id="hc-nom" placeholder="ex : Millésime 1975"></div>
    <div class="grid3"><div class="field"><label for="hc-fmt">Format</label><input id="hc-fmt" placeholder="70cl"></div>
    <div class="field"><label for="hc-stock">Stock</label><input id="hc-stock" type="number" min="0" placeholder="0"></div>
    <div class="field"><label for="hc-prix">Prix (€)</label><input id="hc-prix" type="number" min="0" placeholder="0"></div></div>
    <div class="row" style="justify-content:flex-start"><button class="btn go sm" id="hc-add">Ajouter</button><button class="btn ghost sm" id="hc-cancel">Annuler</button></div>`);
  form.style.padding="12px";form.hidden=true;
  btn.onclick=()=>{form.hidden=!form.hidden;};
  c.appendChild(btn);c.appendChild(form);
  form.querySelector("#hc-add").onclick=()=>{
    const nom=form.querySelector("#hc-nom").value.trim();if(!nom)return;
    nv.extras.push({id:"x"+uid(),nom,format:form.querySelector("#hc-fmt").value.trim(),stock:parseInt(form.querySelector("#hc-stock").value)||0,prix:parseFloat(form.querySelector("#hc-prix").value)||0});
    renderProdPicker(c);
  };
  form.querySelector("#hc-cancel").onclick=()=>{form.hidden=true;};
}

async function createVente(){
  if(busy)return;
  if(!nv.nom.trim()||!nv.lieu.trim())return flash("Indiquez le nom et le lieu de la vente.");
  if(!nv.vendeur.trim())return flash("Indiquez votre prénom.");
  if(!nv.refs.length&&!nv.extras.length)return flash("Ajoutez au moins un produit.");
  if(nv.dateFin&&nv.dateFin<nv.dateDebut)return flash("La date de fin est avant la date de début.");
  const refs=[...nv.refs.map(r=>({id:r.id,nom:r.nom,format:r.format,stock:Math.max(0,parseInt(r.stock)||0),prix:parseFloat(r.prix)||0})),
              ...nv.extras.map(x=>({id:x.id,nom:x.nom,format:x.format,stock:Math.max(0,x.stock||0),prix:x.prix}))];
  const id="v"+uid();
  const v={nom:nv.nom.trim(),lieu:nv.lieu.trim(),dateDebut:nv.dateDebut,dateFin:nv.dateFin||nv.dateDebut,vendeurPrincipal:nv.vendeur.trim(),refs,cloturee:false,createdAt:new Date().toISOString()};
  busy=true;qs("#btn-create").disabled=true;
  try{
    await db.collection("ventes").doc(id).set(v);
    store.set(VENDEUR_KEY,nv.vendeur.trim());
    nv=blankNv();
    if(!ventes.find(x=>x.id===id))ventes.push({id,...v});
    go("vente",id);flash("Vente créée.","ok");
  }catch(e){flash(dbMessage(e));const b=qs("#btn-create");if(b)b.disabled=false;}
  finally{busy=false;}
}

/* ---------- détail d'une vente ---------- */
function renderVente(m){
  const v=getVente();const t=txsOf(v.id);
  const ca=t.reduce((s,x)=>s+(x.total||0),0);
  const btl=t.reduce((s,x)=>s+(x.lignes||[]).reduce((a,l)=>a+(l.qte||0),0),0);
  m.appendChild(el("div","row",`<p class="muted">${esc(v.lieu)} · ${esc(periode(v))}</p><span class="badge ${v.cloturee?"closed":"open"}">${v.cloturee?"Clôturée":"En cours"}</span>`));
  const k=el("div","grid3");
  [[fmt(ca),"Chiffre d'affaires"],[t.length,"Transactions"],[btl,"Articles"]].forEach(([val,lab])=>k.appendChild(el("div","kpi",`<div class="val num">${val}</div><div class="lab">${lab}</div>`)));
  m.appendChild(k);
  // répartition par paiement
  const parP=PMTS.map(([p,lab])=>[lab,t.filter(x=>x.paiement===p).reduce((s,x)=>s+(x.total||0),0)]).filter(x=>x[1]>0);
  if(parP.length)m.appendChild(el("p","muted num",parP.map(([l,s])=>`${l} ${fmt(s)}`).join(" · ")));
  const actions=el("div","grid2");
  if(!v.cloturee&&canWrite){
    const b=el("button","btn go full","+ Transaction");
    b.onclick=()=>{sv=blankSv();horsOpen=false;go("saisie",v.id);};actions.appendChild(b);
  }
  if(downloads){const e=el("button","btn ghost full","Exporter CSV");e.onclick=()=>exportCSV(v);actions.appendChild(e);}
  if(actions.children.length===1)actions.style.gridTemplateColumns="1fr";
  if(actions.children.length)m.appendChild(actions);
  if(!v.cloturee&&canWrite){
    if(!confirmClose){
      const l=el("button","link","Clôturer la vente");l.onclick=()=>{confirmClose=true;render();};m.appendChild(l);
    }else{
      const cf=el("div","confirm",`<p style="font-size:13px;font-weight:700;color:var(--bad)">Clôturer « ${esc(v.nom)} » ? Plus aucune transaction ne pourra être saisie.</p>`);
      const r=el("div","grid2");
      const yes=el("button","btn danger sm","Clôturer");yes.onclick=()=>cloturer(v.id);
      const no=el("button","btn ghost sm","Annuler");no.onclick=()=>{confirmClose=false;render();};
      r.appendChild(yes);r.appendChild(no);cf.appendChild(r);m.appendChild(cf);
    }
  }
  const tabs=el("div","tabs");
  const tv=el("button",tab==="tx"?"active":"","Transactions"),ts=el("button",tab==="stock"?"active":"","Stocks");
  tv.onclick=()=>{tab="tx";render();};ts.onclick=()=>{tab="stock";render();};
  tabs.appendChild(tv);tabs.appendChild(ts);m.appendChild(tabs);
  if(tab==="tx")renderTxList(m,t);else renderStock(m,v);
}

async function cloturer(vid){
  if(busy)return;busy=true;
  try{await db.collection("ventes").doc(vid).update({cloturee:true});confirmClose=false;flash("Vente clôturée.","ok");}
  catch(e){flash(dbMessage(e));}
  finally{busy=false;render();}
}

function renderTxList(m,t){
  if(!t.length){m.appendChild(el("div","empty","Aucune transaction pour l'instant."));return;}
  [...t].reverse().forEach(x=>{
    const heure=x.date?new Date(x.date).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
    let h=`<div class="row" style="align-items:flex-start">
      <div style="min-width:0"><p style="font-weight:700">${esc(x.client?.prenom)} ${esc(x.client?.nom)}</p>
      ${x.client?.tel?`<p class="muted">📞 ${esc(x.client.tel)}</p>`:""}
      ${x.client?.email?`<p class="muted" style="overflow-wrap:anywhere">✉️ ${esc(x.client.email)}</p>`:""}
      <p class="muted">${esc(heure)}${x.vendeurPrenom?" · par "+esc(x.vendeurPrenom):""}</p></div>
      <div style="text-align:right"><p class="num" style="font-weight:800;color:var(--accent-ink);font-size:16px">${fmt(x.total)}</p>
      <span class="badge closed">${esc(x.paiement)}</span></div></div>`;
    (x.lignes||[]).forEach(l=>{h+=`<div class="tx-line num"><span>${esc(l.nom)} ${esc(l.format)}</span><span>${l.qte} × ${fmt(l.prix)}</span><b>${fmt(l.qte*l.prix)}</b></div>`;});
    m.appendChild(el("div","card",h));
  });
}

function renderStock(m,v){
  const c=el("div","card");
  v.refs.forEach(r=>{
    const vendu=venduDe(v.id,r.id);const illimite=!r.stock;
    const reste=(r.stock||0)-vendu;const pct=illimite?1:Math.max(0,reste/r.stock);
    const col=illimite?"var(--muted)":reste<=0?"var(--bad)":reste<=2?"var(--warn)":"var(--ok)";
    const etat=illimite?`${vendu} vendu${vendu>1?"s":""} · sans limite`:reste<=0?"Rupture":`${reste} / ${r.stock}`;
    c.appendChild(el("div","stack",`<div class="row" style="font-size:14px"><span style="font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nom)} ${esc(r.format)}</span>
      <span class="num" style="font-weight:700;white-space:nowrap;color:${col}">${esc(etat)}</span></div>
      ${illimite?"":`<div class="bar"><i style="width:${pct*100}%;background:${col}"></i></div>`}
      <p class="muted num">${fmt(r.prix)} / unité${illimite?"":" · "+vendu+" vendu"+(vendu>1?"s":"")}</p>`));
  });
  // ventes hors catalogue saisies en direct
  const libres={};txsOf(v.id).forEach(t=>(t.lignes||[]).filter(l=>l.libre).forEach(l=>{const k=l.nom+" "+l.format;libres[k]=(libres[k]||0)+l.qte;}));
  Object.entries(libres).forEach(([k,q])=>c.appendChild(el("div","row",`<span style="font-size:14px">${esc(k)} <span class="muted">(hors catalogue)</span></span><span class="num muted">${q} vendu${q>1?"s":""}</span>`)));
  m.appendChild(c);
}

/* ---------- saisie d'une transaction ---------- */
function renderSaisie(m){
  const v=getVente();
  if(v.cloturee){m.appendChild(el("div","msg info","Cette vente est clôturée."));return;}
  const cv=el("div","card",`<div class="field"><label for="sv-vendeur">Vendeur (votre prénom)</label><input id="sv-vendeur" placeholder="ex : Marie" value="${esc(sv.vendeur)}"></div>`);
  m.appendChild(cv);
  cv.querySelector("#sv-vendeur").oninput=e=>{sv.vendeur=e.target.value;};
  const cc=el("div","card",`<h2>Client</h2>
    <div class="grid2"><div class="field"><label for="cl-pre">Prénom *</label><input id="cl-pre" autocomplete="off" value="${esc(sv.client.prenom)}"></div>
    <div class="field"><label for="cl-nom">Nom *</label><input id="cl-nom" autocomplete="off" value="${esc(sv.client.nom)}"></div></div>
    <div class="grid2"><div class="field"><label for="cl-tel">Téléphone</label><input id="cl-tel" type="tel" autocomplete="off" placeholder="optionnel" value="${esc(sv.client.tel)}"></div>
    <div class="field"><label for="cl-email">Email</label><input id="cl-email" type="email" autocomplete="off" placeholder="optionnel" value="${esc(sv.client.email)}"></div></div>`);
  m.appendChild(cc);
  const cmap={"cl-pre":"prenom","cl-nom":"nom","cl-tel":"tel","cl-email":"email"};
  Object.keys(cmap).forEach(id=>{qs("#"+id).oninput=e=>{sv.client[cmap[id]]=e.target.value;};});
  saisieProdCard=el("div","card");m.appendChild(saisieProdCard);renderLignes();
  const cp=el("div","card",`<h2>Paiement</h2>`);const pm=el("div","pmts");
  PMTS.forEach(([p,lab])=>{
    const b=el("button","pmt"+(sv.pmt===p?" sel":""),lab);
    b.onclick=()=>{sv.pmt=p;pm.querySelectorAll(".pmt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");};
    pm.appendChild(b);
  });
  cp.appendChild(pm);m.appendChild(cp);
  const tot=el("div","total",`<small>Total à encaisser</small><strong id="total-val" class="num">0,00 €</strong>`);tot.id="total-box";m.appendChild(tot);
  const ok=el("button","btn go full","✓ Valider la transaction");ok.id="btn-valider";ok.onclick=submitTx;m.appendChild(ok);
  const an=el("button","btn ghost full","Annuler");an.onclick=()=>go("vente",venteId);m.appendChild(an);
  updateTotal();
}

function resteDispo(v,ref){ // stock restant hors panier en cours ; Infinity si sans limite
  if(!ref.stock)return Infinity;
  return ref.stock-venduDe(v.id,ref.id);
}

function renderLignes(){
  const c=saisieProdCard;if(!c)return;const v=getVente();if(!v)return;
  c.innerHTML="<h2>Produits</h2>";
  v.refs.forEach(ref=>{
    const ligne=sv.lignes.find(l=>l.refId===ref.id);
    const dispo=resteDispo(v,ref);const dansPanier=ligne?ligne.qte:0;
    const rupture=dispo-dansPanier<=0&&!ligne;
    const info=dispo===Infinity?"sans limite":rupture?"Rupture":`${dispo-dansPanier} restant${dispo-dansPanier>1?"s":""}`;
    const row=el("button","prod-row"+(ligne?" sel":rupture?" rupt":""),`<span class="check">${ligne?"✓":""}</span>
      <span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:${ligne?700:500}">${esc(ref.nom)} <span class="muted">(${esc(ref.format)})</span></span>

function ligneCtrl(ligne,dispo){
  const ctrl=el("div","ctrl");
  const st=el("div","stepper");
  const minus=el("button","","−");minus.setAttribute("aria-label","Retirer un");
  minus.onclick=()=>{if(ligne.qte>1)ligne.qte--;else sv.lignes=sv.lignes.filter(l=>l!==ligne);renderLignes();updateTotal();};
  const cnt=el("span","num",String(ligne.qte));
  const plus=el("button","","+");plus.setAttribute("aria-label","Ajouter un");
  plus.disabled=ligne.qte>=dispo;
  plus.onclick=()=>{if(ligne.qte<dispo){ligne.qte++;renderLignes();updateTotal();}};
  st.appendChild(minus);st.appendChild(cnt);st.appendChild(plus);
  const px=el("input","prix num");px.type="number";px.min="0";px.step="0.5";px.inputMode="decimal";px.value=ligne.prix;px.setAttribute("aria-label","Prix unitaire");

  px.oninput=e=>{ligne.prix=parseFloat(e.target.value)||0;tot.textContent=fmt(ligne.qte*ligne.prix);updateTotal();};
  ctrl.appendChild(st);ctrl.appendChild(px);ctrl.appendChild(el("span","muted","€"));ctrl.appendChild(tot);

function updateTotal(){
  const total=sv.lignes.reduce((s,l)=>s+l.qte*l.prix,0);
  const box=qs("#total-box"),val=qs("#total-val"),btn=qs("#btn-valider");
  if(box)box.hidden=!sv.lignes.length;
  if(val)val.textContent=fmt(total);
  if(btn)btn.disabled=!sv.lignes.length||busy;
}

async function submitTx(){
  if(busy)return;
  const v=getVente();
  if(!v||v.cloturee)return flash("Cette vente est clôturée.");
  if(!sv.vendeur.trim())return flash("Indiquez votre prénom de vendeur.");
  if(!sv.client.prenom.trim()||!sv.client.nom.trim())return flash("Indiquez le prénom et le nom du client.");
  if(!sv.lignes.length)return flash("Ajoutez au moins un produit.");
  // contrôle du stock avec les dernières ventes des autres vendeurs
  for(const l of sv.lignes){
    if(l.libre)continue;
    const ref=v.refs.find(r=>r.id===l.refId);if(!ref)continue;
    const dispo=resteDispo(v,ref);
    if(l.qte>dispo){renderLignes();updateTotal();return flash(dispo<=0?`${ref.nom} ${ref.format} est en rupture.`:`Il ne reste que ${dispo} × ${ref.nom} ${ref.format}.`);}
  }
  const id="t"+uid();
  const lignes=sv.lignes.map(l=>({refId:l.refId,nom:l.nom,format:l.format,qte:l.qte,prix:l.prix,...(l.libre?{libre:true}:{})}));
  const tx={venteId:v.id,client:{prenom:sv.client.prenom.trim(),nom:sv.client.nom.trim(),tel:sv.client.tel.trim(),email:sv.client.email.trim()},
    lignes,paiement:sv.pmt,total:lignes.reduce((s,l)=>s+l.qte*l.prix,0),vendeurPrenom:sv.vendeur.trim(),date:new Date().toISOString()};
  busy=true;updateTotal();
  try{
    await db.collection("transactions").doc(id).set(tx);
    store.set(VENDEUR_KEY,sv.vendeur.trim());
    if(!txs.find(x=>x.id===id))txs.push({id,...tx});
    sv=blankSv();horsOpen=false;
    busy=false;go("vente",v.id);flash(`Transaction enregistrée : ${fmt(tx.total)}.`,"ok");
  }catch(e){busy=false;updateTotal();flash(dbMessage(e));}
}

    bar.style.alignItems="flex-end";bar.appendChild(prev);bar.appendChild(next);m.appendChild(bar);
  }
  const zone=el("div","stack");zone.id="ch-zone";m.appendChild(zone);
  refreshChambres();
}
function refreshChambres(){
  const z=qs("#ch-zone");if(z){z.innerHTML="";
    if(!loaded.chambres)z.appendChild(el("div","empty","Chargement des chambres…"));
    else if(!chambres.length)z.appendChild(el("div","empty","Aucune chambre enregistrée pour l'instant."));
    else if(chView==="plan")renderPlan(z);
    else if(chView==="planning")renderPlanning(z);
    else renderListe(z);
  }
  if(roomOpenId)renderRoomModal();
}

function renderListe(list){
  const q=chQuery.trim().toLowerCase();
  const match=c=>!q||[c.nom,c.personnes,c.localisation,c.couchage,...resasDe(c.id).map(r=>r.nom)].some(x=>(x||"").toLowerCase().includes(q));
  const rooms=chambres.filter(c=>c.type==="chambre");
  const lieux=chambres.filter(c=>c.type!=="chambre");
  const libres=rooms.filter(c=>statut(c).libre);
  list.appendChild(el("p","muted",`${rooms.length} chambres · ${libres.length} libres ${sejourOk()?"sur ces dates":"ce soir"} · ${lieux.length} lieux du domaine`));
  const groups=[];
  ETAGES.forEach(([n,lab])=>{
    if(chFilter!=="all"&&chFilter!=="libre"&&chFilter!==String(n))return;
    groups.push([lab,rooms.filter(c=>c.etage===n&&(chFilter!=="libre"||statut(c).libre))]);
  });
  if(chFilter==="all"||chFilter==="lieux")groups.push(["Lieux du domaine",lieux]);
  let shown=0;
  groups.forEach(([lab,items])=>{
    items=items.filter(match).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
    if(!items.length)return;shown+=items.length;
    list.appendChild(el("h2","floor-h",esc(lab)));
    const g=el("div","rooms");
    items.forEach(c=>g.appendChild(roomCard(c)));
    list.appendChild(g);
  });
  if(!shown)list.appendChild(el("div","empty","Aucun résultat."));
}
function roomPhoto(c,cls){
  const img=el("img",cls);img.src=photoUrl(c);img.alt="Photo : "+c.nom;img.loading="lazy";
  img.onerror=()=>img.remove();
  return img;
}
function statusTag(c){
  const s=statut(c);if(!s)return null;
  const t=el("span","tag "+(s.libre?"free":"busy"));t.textContent=s.libre?"Libre":"Réservée";
  if(!s.libre)t.title=s.qui;
  return t;
}
function roomCard(c){
  const card=el("button","room");
  card.onclick=()=>openRoom(c.id);
  card.appendChild(roomPhoto(c,"room-photo"));
  const h=el("h3");h.textContent=c.nom;card.appendChild(h);
  const meta=el("div","meta");
  const st=statusTag(c);if(st)meta.appendChild(st);
  if(c.couchage){const t=el("span","tag bed");t.textContent=c.couchage;meta.appendChild(t);}
  if(c.localisation){const t=el("span","tag");t.textContent=c.localisation;meta.appendChild(t);}
  card.appendChild(meta);
  const s=statut(c);
  if(s&&!s.libre){const w=el("p","who");w.textContent=s.qui;card.appendChild(w);}
  const n=resasDe(c.id).filter(r=>r.depart>today()).length;
  if(n)card.appendChild(el("p","muted",`${n} réservation${n>1?"s":""} à venir`));
  return card;
}

/* plan du château : photo aérienne (1500×842) et repères par étage et par côté */
const PLAN_W=1500, PLAN_H=842, CROP={x:410,y:330,w:450,h:290}; // cadrage sur le château
const LNG_EST=-0.28312, LNG_OUEST=-0.28356; // côté Balançoire (avant gauche) → côté Cuisine (arrière droite)
const LNG_COTE={Balançoire:-0.28320,Milieu:-0.28339,Cuisine:-0.28352};
const Y_ETAGE={1:505,2:474,3:446};
function posDefaut(c){
  let lng=null;const g=(c.gps||"").split(",").map(Number);
  if(g.length===2&&!isNaN(g[1])&&g[1]<0)lng=g[1];
  if(lng==null)lng=LNG_COTE[c.aile]??LNG_COTE.Milieu;
  const t=Math.min(1,Math.max(0,(lng-LNG_EST)/(LNG_OUEST-LNG_EST)));
  const x=470+t*330, y=(Y_ETAGE[c.etage]||505)-0.15*(x-470);
  return {px:(x-CROP.x)/CROP.w*100,py:(y-CROP.y)/CROP.h*100};
}
function renderPlan(z){
  const rooms=chambres.filter(c=>c.type==="chambre").sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  const wrap=el("div","plan"+(adjustPins?" adjust":""));
  wrap.style.aspectRatio=CROP.w+"/"+CROP.h;
  const img=el("img","plan-img");img.src="chateau.webp";img.alt="Vue aérienne du château de Ravignan";
  img.style.width=(PLAN_W/CROP.w*100)+"%";img.style.left=(-CROP.x/CROP.w*100)+"%";img.style.top=(-CROP.y/CROP.h*100)+"%";
  wrap.appendChild(img);
  const pos=rooms.map(c=>({c,...(typeof c.px==="number"&&typeof c.py==="number"?{px:c.px,py:c.py}:posDefaut(c))}));
  // écarte les repères superposés quand la position vient du calcul
  pos.forEach((p,i)=>{let k=0;while(pos.slice(0,i).some(o=>Math.abs(o.px-p.px)<4.5&&Math.abs(o.py-p.py)<6)&&k<8){p.px+=4.6;k++;}});
  pos.forEach((p,i)=>{
    const s=statut(p.c);
    const pin=el("button","pin "+(s.libre?"free":"busy"),String(i+1));
    pin.style.left=p.px+"%";pin.style.top=p.py+"%";
    pin.title=p.c.nom+(s.libre?" · libre":" · "+s.qui);
    pin.setAttribute("aria-label",p.c.nom+(s.libre?", libre":", réservée"));
    if(adjustPins)dragPin(pin,wrap,p.c);else pin.onclick=()=>openRoom(p.c.id);
    wrap.appendChild(pin);
  });
  z.appendChild(wrap);
  const tools=el("div","row");
  tools.appendChild(el("p","muted",adjustPins?"Faites glisser chaque repère sur sa fenêtre. La position est enregistrée au relâchement.":"Repères placés d'après l'étage et le côté de chaque chambre. Touchez un numéro pour ouvrir la chambre."));
  if(canWrite){const b=el("button","btn ghost sm",adjustPins?"Terminer":"Ajuster les repères");b.onclick=()=>{adjustPins=!adjustPins;refreshChambres();};tools.appendChild(b);}
  z.appendChild(tools);
  const leg=el("div","legend");
  pos.forEach((p,i)=>{
    const s=statut(p.c);
    const b=el("button","leg-item",`<span class="leg-n ${s.libre?"free":"busy"}">${i+1}</span>`);
    const t=el("span");t.textContent=p.c.nom;b.appendChild(t);
    b.onclick=()=>openRoom(p.c.id);leg.appendChild(b);
  });
  z.appendChild(leg);
}
function dragPin(pin,wrap,c){
  pin.onpointerdown=e=>{
    e.preventDefault();pin.setPointerCapture(e.pointerId);pin.classList.add("drag");
    const r=wrap.getBoundingClientRect();let px,py;
    const move=ev=>{px=Math.min(99,Math.max(1,(ev.clientX-r.left)/r.width*100));py=Math.min(99,Math.max(1,(ev.clientY-r.top)/r.height*100));pin.style.left=px+"%";pin.style.top=py+"%";};
    pin.onpointermove=move;
    pin.onpointerup=async()=>{
      pin.onpointermove=null;pin.onpointerup=null;pin.classList.remove("drag");
      if(px==null)return;
      try{await db.collection("chambres").doc(c.id).update({px:Math.round(px*100)/100,py:Math.round(py*100)/100});}
      catch(err){flash(dbMessage(err));}
    };
  };
}

function renderPlanning(z){
  const rooms=chambres.filter(c=>c.type==="chambre").sort((a,b)=>(b.etage-a.etage)||((a.ordre||0)-(b.ordre||0)));
  const jours=[...Array(14)].map((_,i)=>addDays(planStart,i));
  const w=el("div","tbl-wrap");
  const t=el("table","planning");
  const head=el("tr");head.appendChild(el("th","pl-room","Chambre"));
  jours.forEach(d=>{const dt=new Date(d+"T12:00:00");head.appendChild(el("th",[0,6].includes(dt.getDay())?"we":"",`${dt.toLocaleDateString("fr-FR",{weekday:"narrow"})}<br>${dt.getDate()}`));});
  const th=el("thead");th.appendChild(head);t.appendChild(th);
  const tb=el("tbody");
  rooms.forEach(c=>{
    const tr=el("tr");const n=el("th","pl-room");
    const nb=el("button","pl-name");nb.textContent=c.nom;nb.onclick=()=>openRoom(c.id);n.appendChild(nb);tr.appendChild(n);
    const rs=resasDe(c.id);
    jours.forEach(d=>{
      const r=rs.find(x=>x.arrivee<=d&&d<x.depart);
      const td=el("td",r?"occ":"");
      if(r){td.title=`${r.nom} · ${frCourt(r.arrivee)} → ${frCourt(r.depart)}`;if(r.arrivee===d||d===planStart)td.textContent=r.nom;}
      else{td.title="Réserver à partir du "+frCourt(d);td.onclick=()=>openRoom(c.id,d);td.classList.add("free");}
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);w.appendChild(t);z.appendChild(w);
  z.appendChild(el("p","muted","Chaque colonne est une nuit. Touchez une case vide pour réserver à partir de cette nuit."));
}

/* fiche chambre et réservation */
function openRoom(id,arrivee){
  roomOpenId=id;confirmResa=null;
  const du=arrivee||(sejourOk()?sejour.du:today());
  const au=arrivee?addDays(arrivee,1):(sejourOk()?sejour.au:addDays(du,1));
  roomForm={nom:"",arrivee:du,depart:au,note:""};
  qs("#modal").hidden=false;document.body.style.overflow="hidden";document.body.classList.add("modal-open");
  renderRoomModal();
  setTimeout(()=>qs("#modal .sheet")?.focus(),0);
}
function closeRoom(){roomOpenId=null;qs("#modal").hidden=true;document.body.style.overflow="";document.body.classList.remove("modal-open");}
function renderRoomModal(){
  const c=chambres.find(x=>x.id===roomOpenId);const sh=qs("#modal .sheet");
  if(!c){closeRoom();return;}
  // garde la saisie en cours si le formulaire est déjà affiché
  const f=sh.querySelector("#rs-nom");
  if(f){roomForm.nom=f.value;roomForm.arrivee=sh.querySelector("#rs-du").value;roomForm.depart=sh.querySelector("#rs-au").value;roomForm.note=sh.querySelector("#rs-note").value;}
  sh.innerHTML="";
  const top=el("div","row");const h=el("h2","sheet-title");h.textContent=c.nom;top.appendChild(h);
  const x=el("button","x","×");x.setAttribute("aria-label","Fermer");x.onclick=closeRoom;top.appendChild(x);sh.appendChild(top);
  sh.appendChild(roomPhoto(c,"sheet-photo"));
  const meta=el("div","meta");
  const st=statusTag(c);if(st)meta.appendChild(st);
  [c.couchage,c.localisation].filter(Boolean).forEach(v=>{const t=el("span","tag");t.textContent=v;meta.appendChild(t);});
  sh.appendChild(meta);
  if(c.personnes){const p=el("p","muted");p.textContent="Note de l'ancien tableau : "+c.personnes;sh.appendChild(p);}
  if(c.gps&&/^-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?$/.test(c.gps)){
    const a=el("a","map-link","Voir sur la carte ↗");a.href="https://www.google.com/maps?q="+encodeURIComponent(c.gps.replace(/\s+/g,""));a.target="_blank";a.rel="noopener";sh.appendChild(a);
  }
  if(c.type!=="chambre")return;
  // réservations
  const rs=resasDe(c.id).filter(r=>r.depart>addDays(today(),-1));
  const box=el("div","stack");box.appendChild(el("h3","sheet-sub","Réservations"));
  if(!rs.length)box.appendChild(el("p","muted","Aucune réservation à venir."));
  rs.forEach(r=>{
    const row=el("div","resa");
    const t=el("div");t.style.minWidth="0";
    const n=el("p");n.style.fontWeight="700";n.textContent=r.nom;t.appendChild(n);
    t.appendChild(el("p","muted num",`${esc(frCourt(r.arrivee))} → ${esc(frCourt(r.depart))} · ${nuits(r.arrivee,r.depart)} nuit${nuits(r.arrivee,r.depart)>1?"s":""}`));
    if(r.note){const no=el("p","muted");no.textContent=r.note;t.appendChild(no);}
    row.appendChild(t);
    if(canWrite){
      if(confirmResa===r.id){
        const g=el("div","row");
        const y=el("button","btn danger sm","Annuler la réservation");y.onclick=()=>supprimerResa(r.id);
        const n2=el("button","btn ghost sm","Garder");n2.onclick=()=>{confirmResa=null;renderRoomModal();};
        g.appendChild(y);g.appendChild(n2);row.appendChild(g);
      }else{const d=el("button","link","Annuler");d.onclick=()=>{confirmResa=r.id;renderRoomModal();};row.appendChild(d);}
    }
    box.appendChild(row);
  });
  sh.appendChild(box);
  if(!canWrite)return;
  const form=el("form","card soft",`<h3 class="sheet-sub">Réserver cette chambre</h3>
    <div class="field"><label for="rs-nom">Pour qui ?</label><input id="rs-nom" required autocomplete="off" placeholder="ex : Tom & Jo"></div>
    <div class="grid2"><div class="field"><label for="rs-du">Arrivée</label><input id="rs-du" type="date" required></div>
    <div class="field"><label for="rs-au">Départ</label><input id="rs-au" type="date" required></div></div>
    <div class="field"><label for="rs-note">Note</label><input id="rs-note" autocomplete="off" placeholder="optionnel (lit bébé, arrivée tardive…)"></div>
    <p class="muted" id="rs-info"></p>
    <button class="btn primary full" type="submit" id="rs-ok">Réserver</button>`);
  form.style.padding="14px";
  form.querySelector("#rs-nom").value=roomForm.nom;form.querySelector("#rs-du").value=roomForm.arrivee;
  form.querySelector("#rs-au").value=roomForm.depart;form.querySelector("#rs-note").value=roomForm.note;
  const info=()=>{const a=form.querySelector("#rs-du").value,b=form.querySelector("#rs-au").value;
    const conf=a&&b&&a<b?resasDe(c.id).filter(r=>overlap(a,b,r.arrivee,r.depart)):[];
    const p=form.querySelector("#rs-info");
    p.style.color=conf.length?"var(--bad)":"";
    p.textContent=!(a&&b&&a<b)?"Le départ doit être après l'arrivée.":conf.length?"Déjà réservée sur ces dates par "+conf.map(r=>r.nom).join(", ")+".":`${nuits(a,b)} nuit${nuits(a,b)>1?"s":""}, chambre libre.`;
  };
  form.querySelector("#rs-du").onchange=e=>{const b=form.querySelector("#rs-au");if(e.target.value&&b.value<=e.target.value)b.value=addDays(e.target.value,1);info();};
  form.querySelector("#rs-au").onchange=info;
  form.onsubmit=e=>{e.preventDefault();reserver(c,form);};
  info();sh.appendChild(form);
}
async function reserver(c,form){
  if(busy)return;
  const nom=form.querySelector("#rs-nom").value.trim(),a=form.querySelector("#rs-du").value,b=form.querySelector("#rs-au").value,note=form.querySelector("#rs-note").value.trim();
  if(!nom)return flash("Indiquez pour qui est la réservation.");
  if(!(a&&b&&a<b))return flash("Le départ doit être après l'arrivée.");
  const conf=resasDe(c.id).filter(r=>overlap(a,b,r.arrivee,r.depart));
  if(conf.length)return flash(`${c.nom} est déjà réservée sur ces dates (${conf.map(r=>r.nom).join(", ")}).`);
  busy=true;form.querySelector("#rs-ok").disabled=true;
  try{
    await db.collection("reservations").doc("r"+uid()).set({chambreId:c.id,nom,arrivee:a,depart:b,note,createdAt:new Date().toISOString()});
    roomForm={nom:"",arrivee:b,depart:addDays(b,1),note:""};
    const f=qs("#modal .sheet #rs-nom");if(f)f.remove();
    flash(`${c.nom} réservée pour ${nom}, du ${frCourt(a)} au ${frCourt(b)}`,"ok");
  }catch(err){flash(dbMessage(err));}
  finally{busy=false;renderRoomModal();}
}
async function supprimerResa(id){
  if(busy)return;busy=true;
  try{await db.collection("reservations").doc(id).delete();confirmResa=null;flash("Réservation annulée.","ok");}
  catch(err){flash(dbMessage(err));}
  finally{busy=false;renderRoomModal();}
}
const renderChambresList=refreshChambres;

    const d=s.exists?s.data():null;

  },onErr);
  db.collection("ventes").onSnapshot(s=>{
    ventes=s.docs.map(x=>({id:x.id,...x.data()}));loaded.ventes=true;
    if(LIVE_PAGES.includes(page))render();
  },onErr);
  db.collection("transactions").onSnapshot(s=>{

  },onErr);
})();
